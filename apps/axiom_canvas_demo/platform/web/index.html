<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Minimal Runtime Host · Web</title>
<style>
html,body { margin:0; height:100%; background:#e9edf2; font:14px system-ui; }
body { display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; flex:0 0 36px; align-items:center; gap:16px; padding:10px 16px; background:#fff; border-bottom:1px solid #cbd1db; }
header strong { flex:1; } button { padding:6px 12px; }
#stage { position:relative; flex:1; min-height:100px; background:white; overflow:hidden; }
#axiom-canvas,#axiom-preview { position:absolute; width:100%; height:100%; inset:0; touch-action:none; }
#axiom-preview { pointer-events:none; visibility:hidden; }
#debugUi { position:absolute; left:8px; top:8px; width:min(900px,calc(100% - 16px)); height:min(650px,calc(100% - 16px)); z-index:5; touch-action:none; }
[hidden] { display:none!important; }
#status { margin:0; flex:0 0 20px; padding:6px 16px; color:#384454; background:#f7f8fa; font:12px/20px system-ui; }
</style>
<header><strong>Axiom Minimal Runtime Host · Web</strong><button id="debugUiToggle" type="button" hidden>Debug UI</button></header>
<div id="stage"><canvas id="axiom-canvas"></canvas><canvas id="axiom-preview"></canvas><canvas id="debugUi" width="900" height="650" hidden tabindex="0"></canvas></div>
<pre id="status">正在启动…</pre>
<script type="module" src="./host.js"></script>
</html>
