<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Minimal Runtime Host · Web</title>
<style>
html,body { margin:0; height:100%; background:#e9edf2; font:14px system-ui; }
body { display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; flex:0 0 36px; align-items:center; gap:16px; padding:10px 16px; background:#fff; border-bottom:1px solid #cbd1db; }
header strong { flex:1; } button { padding:6px 12px; }
#stage { position:relative; flex:1; min-height:100px; background:white; overflow:hidden; }
#axiom-canvas,#axiom-preview { position:absolute; width:100%; height:100%; inset:0; touch-action:none; }
#axiom-preview { pointer-events:none; visibility:hidden; }
#debugUi { position:absolute; left:8px; top:8px; width:min(410px,calc(100% - 16px)); height:min(650px,calc(100% - 16px)); z-index:5; touch-action:none; }
[hidden] { display:none!important; }
#status { margin:0; flex:0 0 20px; padding:6px 16px; color:#384454; background:#f7f8fa; font:12px/20px system-ui; }
</style>
<header><strong>Axiom Minimal Runtime Host · Web</strong><label>Text width <input id="textWidth" type="number" min="1" max="1000000" value="320" style="width:72px" disabled></label><button id="textTool" type="button">Text</button><button id="debugUiToggle" type="button" hidden>Debug UI</button></header>
<div id="stage"><canvas id="axiom-canvas"></canvas><canvas id="axiom-preview"></canvas><canvas id="debugUi" width="410" height="650" hidden tabindex="0"></canvas></div>
<pre id="status">正在启动…</pre>
<script type="module">
// Keep the complete module/WASM graph on the requested artifact version.
const entry = new URL('./host.js', location.href);
entry.searchParams.set('rev', new URL(location.href).searchParams.get('rev') || '@AXIOM_WEB_ASSET_REVISION@');
const ready = import(entry.href).then(module => module.ready);
globalThis.axiomMinimalReady = ready;
globalThis.axiomG310Ready = ready;
</script>
</html>
