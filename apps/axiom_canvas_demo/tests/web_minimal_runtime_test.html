<!doctype html><meta charset="utf-8"><title>Minimal Web runtime regression</title>
<iframe id="app" src="../index.html" width="1000" height="720"></iframe>
<pre id="result">PENDING</pre>
<script type="module">
const frame = document.getElementById('app'), results = [], uiGeometry = [];
const assert = (value, message) => { if (!value) throw new Error(message); };
frame.addEventListener('load', async () => {
  try {
    const win = frame.contentWindow;
    const host = await (win.axiomMinimalReady || win.axiomG310Ready);
    assert(host && host.flush && host.control, 'Minimal composition frame/control entry missing');
    const doc = frame.contentDocument, canvas = doc.getElementById('axiom-canvas');
    canvas.setPointerCapture = () => {}; canvas.releasePointerCapture = () => {};
    const event = (type, id, x, y, time, target = canvas) => {
      const rect = target.getBoundingClientRect();
      const value = new win.PointerEvent(type, {pointerId: id, pointerType: 'touch',
        clientX: rect.left + x, clientY: rect.top + y, pressure: .5,
        bubbles: true, cancelable: true, buttons: type === 'pointerup' ? 0 : 1});
      Object.defineProperty(value, 'timeStamp', {value: time});
      target.dispatchEvent(value);
    };
    const pixels = id => {
      const c = doc.getElementById(id), gl = c.getContext('webgl2');
      const saved = gl.getParameter(gl.FRAMEBUFFER_BINDING);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const data = new Uint8Array(c.width * c.height * 4);
      gl.readPixels(0, 0, c.width, c.height, gl.RGBA, gl.UNSIGNED_BYTE, data);
      gl.bindFramebuffer(gl.FRAMEBUFFER, saved);
      let dark = 0, visible = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3]) ++visible;
        if (data[i + 3] && data[i] < 230 && data[i + 1] < 230) ++dark;
      }
      return {dark, visible};
    };
    let clock = 1000;
    const stroke = async (id, y) => {
      clock += 600;
      event('pointerdown', id, 40, y, clock);
      event('pointermove', id, 110, y, clock + 16);
      await host.flush();
      assert(pixels('axiom-preview').visible > 0, 'active preview has no pixels');
      event('pointerup', id, 180, y, clock + 32);
      await host.flush();
      assert(doc.getElementById('axiom-preview').style.visibility === 'hidden', 'handoff did not retire preview');
    };
    const test = async (name, action) => { await action(); results.push({name, result: 'PASS'}); };
    await test('DOM Down/Move/Up renders preview and canonical', async () => {
      await stroke(1, 80);
      assert(host.observation().objects === 1, 'stroke did not commit exactly once');
      assert(pixels('axiom-canvas').dark > 20, 'canonical has no ink pixels');
      assert(host.observation().rejectedInputs === 0, 'DOM input rejected');
    });
    await test('ten strokes retain sampling and independent commits', async () => {
      for (let i = 0; i < 10; ++i) await stroke(10 + i, 100 + i * 12);
      assert(host.observation().objects === 11, 'ten strokes lost or duplicated commits');
    });
    await test('Facade Shape presets and return to Ink', async () => {
      for (let preset = 0; preset < 5; ++preset) {
        await host.control('shape', preset);
        clock += 600;
        event('pointerdown', 30 + preset, 250, 50 + preset * 45, clock);
        event('pointermove', 30 + preset, 360, 85 + preset * 45, clock + 16);
        event('pointerup', 30 + preset, 360, 85 + preset * 45, clock + 32);
        await host.flush();
      }
      assert(host.observation().objects === 16, 'Shape/Line/Arrow commits missing');
      await host.control('tool', 0);
      await stroke(40, 280);
      assert(host.observation().objects === 17, 'Ink after Shape failed');
    });
    await test('Facade Undo and Redo read back', async () => {
      await host.control('undo'); assert(host.observation().objects === 16, 'Undo failed');
      await host.control('redo'); assert(host.observation().objects === 17, 'Redo failed');
    });
    await test('cancel, identity reuse and stale generation rejection', async () => {
      clock += 600; event('pointerdown', 50, 60, 320, clock);
      event('pointermove', 50, 120, 320, clock + 16); await host.flush();
      const old = host.observation().lastPointer;
      event('pointercancel', 50, 120, 320, clock + 32); await host.flush();
      assert(host.observation().objects === 17, 'Cancel committed');
      clock += 600; event('pointerdown', 50, 60, 340, clock);
      const current = host.observation().lastPointer;
      assert(current.generation > old.generation, 'reused ID did not advance generation');
      assert(!host.module._axiom_web_cancel_pointer(host.handle, old.source, old.pointer,
        BigInt(old.generation)), 'stale cancel accepted');
      event('pointermove', 50, 120, 340, clock + 16);
      event('pointerup', 50, 180, 340, clock + 32); await host.flush();
      assert(host.observation().objects === 18 && host.observation().activePointers === 0, 'reuse poisoned new stroke');
    });
    await test('frozen AutoIntent: within 250 ms zoom; later MultiInk', async () => {
      clock += 600; const before = host.observation();
      event('pointerdown', 60, 200, 200, clock);
      event('pointerdown', 61, 260, 200, clock + 100);
      event('pointermove', 61, 320, 200, clock + 116); await host.flush();
      assert(host.observation().camera.scale > before.camera.scale, 'two-contact zoom missing');
      event('pointerup', 60, 200, 200, clock + 132);
      event('pointerup', 61, 320, 200, clock + 148); await host.flush();
      assert(host.observation().objects === before.objects, 'navigation created Ink');
      clock += 1000;
      event('pointerdown', 62, 80, 250, clock);
      event('pointerdown', 63, 200, 300, clock + 300);
      event('pointermove', 62, 140, 250, clock + 316);
      event('pointermove', 63, 260, 300, clock + 332);
      event('pointerup', 62, 160, 250, clock + 348);
      event('pointerup', 63, 280, 300, clock + 364); await host.flush();
      assert(host.observation().objects === before.objects + 2, 'late contact MultiInk missing');
    });
    await test('resize cancels active input and preserves canonical', async () => {
      clock += 600; event('pointerdown', 70, 60, 60, clock);
      const count = host.observation().objects;
      host.resize(501.5, 347.5, 2); await host.flush();
      assert(host.observation().dpr === 2 && canvas.width === 1003 && canvas.height === 695,
        'fractional logical size/DPR changed during resize');
      assert(host.observation().activePointers === 0, 'resize retained pointer');
      assert(host.observation().objects === count, 'resize lost canonical');
      await stroke(71, 100); assert(host.observation().objects === count + 1, 'stroke after resize failed');
    });
    await test('Debug UI sibling uses Facade and cannot penetrate canvas', async () => {
      const enabled = host.observation().debugUiEnabled;
      assert(doc.getElementById('debugUiToggle').hidden === !enabled, 'debug toggle build mismatch');
      if (!enabled) return;
      host.toggleDebugUi(); await host.flush();
      assert(pixels('debugUi').visible > 0, 'Debug UI has no pixels');
      const debug = doc.getElementById('debugUi');
      const bounds = debug.getBoundingClientRect();
      assert(bounds.width <= 410, `Debug UI width ${bounds.width}px exceeds 410px`);
      assert(debug.width === 410, `Debug UI backing width ${debug.width}px stretches the panel`);
      const beforeResize = host.observation();
      for (const width of [1200, 800, 360]) {
        host.resize(width, 700, 2); await host.flush();
        const rect = debug.getBoundingClientRect();
        uiGeometry.push({stageWidth: width, panelWidth: rect.width, backingWidth: debug.width});
        assert(rect.width === Math.min(410, width - 16), 'Debug UI does not fit its bounded host width');
      }
      host.resize(beforeResize.logicalWidth, beforeResize.logicalHeight, beforeResize.dpr); await host.flush();
      debug.setPointerCapture = () => {}; debug.releasePointerCapture = () => {};
      const count = host.observation().pointerSamples;
      clock += 600;
      event('pointerdown', 80, 30, 30, clock, debug);
      event('pointerup', 80, 30, 30, clock + 16, debug); await host.flush();
      assert(host.observation().pointerSamples === count, 'Debug UI penetrated canvas');
      host.toggleDebugUi();
    });
    await test('idle does not continuously submit canonical frames', async () => {
      await host.flush(); const count = host.observation().presentedFrames;
      for (let i = 0; i < 4; ++i) await new Promise(resolve => win.requestAnimationFrame(resolve));
      assert(host.observation().presentedFrames === count, 'idle kept rendering');
    });
    await test('capture/focus loss cancel input and the next stroke works', async () => {
      const count = host.observation().objects;
      clock += 600; event('pointerdown',90,40,150,clock);
      event('pointermove',90,110,150,clock+16); await host.flush();
      canvas.dispatchEvent(new win.PointerEvent('lostpointercapture',{pointerId:90,pointerType:'touch'}));
      await host.flush(); assert(host.observation().activePointers === 0, 'capture loss retained pointer');
      clock += 600; event('pointerdown',91,40,180,clock);
      event('pointermove',91,110,180,clock+16);
      win.dispatchEvent(new win.Event('blur')); await host.flush();
      assert(host.observation().objects === count && host.observation().activePointers === 0, 'loss committed or retained input');
      await stroke(92,200); assert(host.observation().objects === count+1, 'stroke after loss failed');
    });
    await test('failed Down permits tool switch and next drawing', async () => {
      const count=host.observation().objects;
      canvas.setPointerCapture=()=>{throw new win.DOMException('fixture capture failure');};
      clock+=600;event('pointerdown',93,40,220,clock);
      canvas.setPointerCapture=()=>{};
      await host.control('tool',0);await stroke(94,220);
      assert(host.observation().objects===count+1 && !host.observation().failure,'failed Down poisoned later input');
    });
    await test('surface loss/rebind preserves canonical and permits drawing', async () => {
      const count=host.observation().objects;
      clock+=600;event('pointerdown',95,40,240,clock);
      assert(host.loseSurface(),'surface loss rejected');
      await new Promise(resolve=>win.requestAnimationFrame(resolve));
      assert(host.observation().activePointers===0 && host.observation().state===3,'surface loss did not cancel');
      host.resize(501.5,347.5,2);await host.flush();
      assert(host.observation().objects===count && pixels('axiom-canvas').dark>0,'rebind lost canonical');
      await stroke(96,250);assert(host.observation().objects===count+1,'stroke after rebind failed');
    });
    await test('mouse/pen sources, coalesced history and tool controls use the same owner', async () => {
      await host.control('ink',9,.6,-1);assert(host.observation().size===9 && Math.abs(host.observation().opacity-.6)<.001,'Ink options readback failed');
      await host.control('preset',1);await host.control('tool',1);
      assert(host.observation().tool===1,'Select control missing');
      await host.control('tool',0);
      const count=host.observation().objects;
      for(const [id,type] of [[110,'mouse'],[111,'pen']]) {
        clock+=600;
        const rect=canvas.getBoundingClientRect();
        const make=(kind,x,time)=>{const v=new win.PointerEvent(kind,{pointerId:id,pointerType:type,clientX:rect.left+x,clientY:rect.top+280,pressure:.7,buttons:kind==='pointerup'?0:1,bubbles:true,cancelable:true});Object.defineProperty(v,'timeStamp',{value:time});return v;};
        canvas.dispatchEvent(make('pointerdown',40,clock));
        const move=make('pointermove',150,clock+32);
        Object.defineProperty(move,'getCoalescedEvents',{value:()=>[make('pointermove',90,clock+16),make('pointermove',130,clock+24)]});
        canvas.dispatchEvent(move);canvas.dispatchEvent(make('pointerup',180,clock+48));await host.flush();
      }
      assert(host.observation().objects===count+2,'mouse/pen drawing missing');
      const trace=host.observation().trace;
      assert(trace.some(v=>v.source===1) && trace.some(v=>v.source===2 && v.history),'sources/history not preserved');
    });
    document.getElementById('result').textContent = JSON.stringify({status: 'PASS', results, uiGeometry, observation: host.observation()});
  } catch (error) {
    document.getElementById('result').textContent = JSON.stringify({status: 'FAIL', results, error: String(error), stack: error.stack});
  }
}, {once: true});
</script>
