<!doctype html>
<meta charset="utf-8">
<title>Axiom Ink Playground</title>
<style>
  body { margin: 0; font: 14px sans-serif; background: #eef1f7; }
  #surfaceStack { position: relative; width: min(100vw, 1024px); height: min(80vh, 768px); }
  #ink, #arcPreview { position: absolute; inset: 0; width: 100%; height: 100%;
         background: white; touch-action: none; border: 1px solid #c5cad6; }
  #arcPreview { pointer-events: none; background: transparent; border: 0; }
  #debugUi { position: absolute; left: 12px; top: 12px; width: 410px; height: 560px;
             display: none; pointer-events: auto; border: 0; background: transparent; z-index: 5; }
  #debugUi.visible { display: block; }
  #debugUiToggle { margin-left: 8px; padding: 6px 10px; border: 1px solid #b8c0d0;
                   border-radius: 4px; background: #fff; cursor: pointer; }
  #brushBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; background: #f7f8fb; }
  #toolPalette { display: flex; gap: 6px; flex-wrap: wrap; }
  #toolPalette button { padding: 6px 10px; border: 1px solid #b8c0d0; background: white; border-radius: 4px; cursor: pointer; }
  #toolPalette button.active { color: white; background: #4058a8; border-color: #4058a8; }
  #hud { padding: 8px; color: #25304a; }
  #evidence { margin: 0 8px 8px; padding: 8px 12px; }
</style>
<div id="brushBar"><span>工具：</span><div id="toolPalette" role="toolbar" aria-label="笔刷和橡皮擦">
  <button type="button" data-tool="brush" data-profile="vector-solid-v1" data-family="1">vector-solid-v1</button>
  <button type="button" data-tool="brush" data-profile="marker-flat-v1" data-family="2">marker-flat-v1</button>
  <button type="button" data-tool="brush" data-profile="chalk-grain-v1" data-family="3">chalk-grain-v1</button>
  <button type="button" data-tool="brush" data-profile="membrane-v1" data-family="4">Membrane</button>
  <button type="button" data-tool="object-eraser">Object Eraser</button>
  <button type="button" data-tool="partial-eraser">Partial Eraser</button>
</div><span id="brushDescription">vector-solid-v1</span><button id="debugUiToggle" type="button">Debug UI</button></div>
<div id="surfaceStack"><canvas id="ink" width="1024" height="768"></canvas><canvas id="arcPreview" width="1024" height="768"></canvas><canvas id="debugUi" width="410" height="560" tabindex="0"></canvas></div>
<pre id="hud">loading</pre>
<button id="evidence" type="button" disabled>导出 Web 证据</button>
<script type="module">
  const canvas = document.getElementById("ink");
  const previewCanvas = document.getElementById("arcPreview");
  const debugCanvas = document.getElementById("debugUi");
  const debugUiToggle = document.getElementById("debugUiToggle");
  const brushDescription = document.getElementById("brushDescription");
  const toolPalette = document.getElementById("toolPalette");
  const hud = document.getElementById("hud");
  const evidenceButton = document.getElementById("evidence");
  addEventListener("error", event => { hud.textContent = `Ink Playground error: ${event.message}`; });
  addEventListener("unhandledrejection", event => { hud.textContent = `Ink Playground rejection: ${event.reason}`; });
  try {
  const imported = await import("./axiom_ink_playground_web.js?v=web-debug-ui-physical-e12833e3-2adfa914");
  const createAxiomInkPlayground = imported.default;
  const module = await createAxiomInkPlayground({
    canvas,
    // Keep the local physical-test page from reusing an older WASM after a
    // rebuild. The query is intentionally limited to the generated binary.
    locateFile: path => `${path}?v=web-debug-ui-physical-e12833e3-2adfa914`
  });
  const host = module._axiom_ink_create();
  // The Web App owns canvas/context creation. WASM only wraps the current
  // context through the provider registration seam.
  if (!host || !module._axiom_ink_bind_surface(host, canvas.width, canvas.height)) {
    throw new Error("Ink Playground surface binding failed");
  }
  if (!module._axiom_ink_bind_preview_surface(host, previewCanvas.width, previewCanvas.height)) {
    throw new Error("ARC preview provider binding failed");
  }
  if (!module._axiom_ink_debug_ui_init(host, debugCanvas.width, debugCanvas.height)) {
    throw new Error("Debug UI surface binding failed");
  }
  const setDebugVisibility = visible => {
    debugCanvas.classList.toggle("visible", visible);
    debugUiToggle.textContent = visible ? "Hide Debug UI" : "Debug UI";
    requestAnimationFrame(() => module._axiom_ink_debug_ui_render(host));
  };
  debugUiToggle.addEventListener("click", () => {
    setDebugVisibility(module._axiom_ink_debug_ui_toggle(host) !== 0);
  });
  const debugPoint = event => {
    const rect = debugCanvas.getBoundingClientRect();
    return [(event.clientX - rect.left) * debugCanvas.width / rect.width,
      (event.clientY - rect.top) * debugCanvas.height / rect.height];
  };
  const debugPointers = new Set();
  const debugPointerButtons = new Map();
  const forwardedDebugPointers = new Set();
  const debugUiWantsMouse = () => module._axiom_ink_debug_ui_wants_capture_mouse(host) !== 0;
  const imguiKeyForEvent = event => {
    const named = {
      Tab: 512, ArrowLeft: 513, ArrowRight: 514, ArrowUp: 515, ArrowDown: 516,
      PageUp: 517, PageDown: 518, Home: 519, End: 520, Insert: 521, Delete: 522,
      Backspace: 523, Space: 524, Enter: 525, Escape: 526,
      ControlLeft: 527, ShiftLeft: 528, AltLeft: 529, MetaLeft: 530,
      ControlRight: 531, ShiftRight: 532, AltRight: 533, MetaRight: 534,
      F1: 572, F2: 573, F3: 574, F4: 575, F5: 576, F6: 577,
      F7: 578, F8: 579, F9: 580, F10: 581, F11: 582, F12: 583
    };
    if (named[event.code] !== undefined) return named[event.code];
    if (/^Digit[0-9]$/.test(event.code)) return 536 + Number(event.code.slice(5));
    if (/^Key[A-Z]$/.test(event.code)) return 546 + event.code.charCodeAt(3) - 65;
    return 0;
  };
  const sendDebugKey = (event, down) => {
    const key = imguiKeyForEvent(event);
    if (key !== 0) module._axiom_ink_debug_ui_key(host, key, down ? 1 : 0);
  };
  const forwardDebugPointer = (event, phase) => {
    if (phase === "down") canvas.setPointerCapture(event.pointerId);
    send(event, phase);
  };
  debugCanvas.addEventListener("pointerdown", event => {
    const [x, y] = debugPoint(event);
    const mouseButton = event.button >= 0 && event.button < 5 ? event.button : 0;
    debugPointerButtons.set(event.pointerId, mouseButton);
    debugCanvas.setPointerCapture(event.pointerId);
    module._axiom_ink_debug_ui_capture_begin(host, BigInt(event.pointerId));
    module._axiom_ink_debug_ui_pointer(host, 0, event.pointerId, mouseButton,
      x, y);
    requestRender();
    // This canvas is only the visible ImGui panel rectangle, so its down
    // sequence is owned by Debug for the full terminal lifecycle. The
    // underlying Ink canvas remains the owner everywhere outside this rect.
    debugPointers.add(event.pointerId);
    event.preventDefault();
    event.stopPropagation();
  });
  debugCanvas.addEventListener("pointermove", event => {
    if (!debugCanvas.hasPointerCapture(event.pointerId)) return;
    const [x, y] = debugPoint(event);
    const mouseButton = debugPointerButtons.get(event.pointerId) ?? 0;
    if (debugPointers.has(event.pointerId) && module._axiom_ink_debug_ui_capture_route(host, BigInt(event.pointerId))) {
      module._axiom_ink_debug_ui_pointer(host, 1, event.pointerId, mouseButton, x, y);
    } else if (forwardedDebugPointers.has(event.pointerId)) {
      forwardDebugPointer(event, "move");
    }
    event.stopPropagation();
  });
  debugCanvas.addEventListener("pointerup", event => {
    const [x, y] = debugPoint(event);
    const mouseButton = debugPointerButtons.get(event.pointerId) ?? 0;
    if (debugPointers.has(event.pointerId) && module._axiom_ink_debug_ui_capture_route(host, BigInt(event.pointerId))) {
      module._axiom_ink_debug_ui_pointer(host, 2, event.pointerId, mouseButton, x, y);
      debugPointers.delete(event.pointerId);
      requestRender();
    } else if (forwardedDebugPointers.has(event.pointerId)) {
      forwardDebugPointer(event, "up");
      forwardedDebugPointers.delete(event.pointerId);
    }
    module._axiom_ink_debug_ui_capture_terminal(host, BigInt(event.pointerId));
    debugPointerButtons.delete(event.pointerId);
    if (debugCanvas.hasPointerCapture(event.pointerId)) debugCanvas.releasePointerCapture(event.pointerId);
    event.preventDefault();
    event.stopPropagation();
  });
  debugCanvas.addEventListener("pointercancel", event => {
    const [x, y] = debugPoint(event);
    const mouseButton = debugPointerButtons.get(event.pointerId) ?? 0;
    if (debugPointers.has(event.pointerId) && module._axiom_ink_debug_ui_capture_route(host, BigInt(event.pointerId))) {
      module._axiom_ink_debug_ui_pointer(host, 3, event.pointerId, mouseButton, x, y);
      debugPointers.delete(event.pointerId);
    } else if (forwardedDebugPointers.has(event.pointerId)) {
      forwardDebugPointer(event, "cancel");
      forwardedDebugPointers.delete(event.pointerId);
    }
    module._axiom_ink_debug_ui_capture_terminal(host, BigInt(event.pointerId));
    debugPointerButtons.delete(event.pointerId);
    if (debugCanvas.hasPointerCapture(event.pointerId)) debugCanvas.releasePointerCapture(event.pointerId);
    event.stopPropagation();
  });
  debugCanvas.addEventListener("wheel", event => {
    if (debugUiWantsMouse()) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, { passive: false });
  debugCanvas.addEventListener("keydown", event => {
    sendDebugKey(event, true);
    if (module._axiom_ink_debug_ui_wants_capture_keyboard(host)) event.preventDefault();
    event.stopPropagation();
  });
  debugCanvas.addEventListener("keyup", event => {
    sendDebugKey(event, false);
    event.stopPropagation();
  });
  previewCanvas.addEventListener("webglcontextlost", event => { event.preventDefault(); module._axiom_ink_lose_surface(host); });
  previewCanvas.addEventListener("webglcontextrestored", () => {
    previewCanvas.getContext("webgl2");
    module._axiom_ink_rebind_surface(host);
  });
  canvas.addEventListener("webglcontextlost", event => { event.preventDefault(); module._axiom_ink_lose_surface(host); });
  canvas.addEventListener("webglcontextrestored", () => module._axiom_ink_rebind_surface(host));
  const baselineObservation = () => {
    const artifact = `${location.href}|${navigator.userAgent}`;
    const pointer = module.stringToNewUTF8(artifact);
    const result = module._axiom_ink_run_baseline_observation(host, pointer);
    const json = result ? module.UTF8ToString(result) : null;
    module._free(pointer);
    return json;
  };
  const skiaBrushSurface = true;
  let sampleSequence = 0;
  const started = new Set();
  const trace = [];
  const webSource = 1;
  let runtimeScale = 1;
  let runtimeTranslationX = 0;
  let runtimeTranslationY = 0;
  const viewportScale = () => runtimeScale;
  const viewportTranslationX = () => runtimeTranslationX;
  const viewportTranslationY = () => runtimeTranslationY;
  const updateViewport = () => {
    runtimeScale = module._axiom_ink_viewport_scale(host);
    runtimeTranslationX = module._axiom_ink_viewport_translation_x(host);
    runtimeTranslationY = module._axiom_ink_viewport_translation_y(host);
  };
  const evidenceWorker = new Worker("./evidence_worker.js");
  let evidenceTimer = 0;
  let evidenceVersion = 0;
  let renderPending = false;
  let lastBatch = 0;
  let latestEvidence = null;
  let selectedBrushFamily = 1;
  let activeTool = "brush";
  let activeProfile = "vector-solid-v1";
  const brushFamilyName = () => activeProfile;
  const brushProfileName = () => activeProfile;
  const syncToolSelection = () => {
    const selected = Number(module._axiom_ink_selected_tool(host));
    const button = [...toolPalette.querySelectorAll("button")].find(candidate => {
      const tool = candidate.dataset.tool;
      const id = tool === "object-eraser" ? 4105 : tool === "partial-eraser" ? 4106
        : 4100 + Number(candidate.dataset.family || 0);
      return id === selected;
    });
    if (!button) return;
    activeTool = button.dataset.tool;
    activeProfile = button.dataset.profile || activeProfile;
    selectedBrushFamily = Number(button.dataset.family || selectedBrushFamily);
    brushDescription.textContent = button.textContent;
    for (const candidate of toolPalette.querySelectorAll("button")) {
      candidate.classList.toggle("active", candidate === button);
      candidate.setAttribute("aria-pressed", candidate === button ? "true" : "false");
    }
  };
  const setToolSelection = button => {
    const nextTool = button.dataset.tool;
    const nextProfile = button.dataset.profile || activeProfile;
    const nextFamily = Number(button.dataset.family || selectedBrushFamily);
    if (nextTool === "brush") {
      const profilePtr = module.stringToNewUTF8(nextProfile);
        const revision = nextProfile === "chalk-grain-v1" ? 4 : 1;
        if (!module._axiom_ink_select_brush_profile(host, profilePtr, revision)) {
        module._free(profilePtr); return false;
      }
      module._free(profilePtr);
      selectedBrushFamily = nextFamily;
      activeProfile = nextProfile;
    }
    const mode = nextTool === "object-eraser" ? 1 : nextTool === "partial-eraser" ? 2 : 0;
    if (!module._axiom_ink_select_tool(host, mode)) return false;
    activeTool = nextTool;
    brushDescription.textContent = button.textContent;
    for (const candidate of toolPalette.querySelectorAll("button")) {
      candidate.classList.toggle("active", candidate === button);
      candidate.setAttribute("aria-pressed", candidate === button ? "true" : "false");
    }
    requestRender();
    return true;
  };
  const initialButton = toolPalette.querySelector('[data-profile="vector-solid-v1"]');
  if (!setToolSelection(initialButton)) throw new Error("initial tool selection failed");
  toolPalette.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (button) setToolSelection(button);
  });
  const nowNs = () => Math.round(performance.now() * 1000000);
  const canvasPoint = sample => {
    const rect = canvas.getBoundingClientRect();
    const physicalX = (sample.clientX - rect.left) * canvas.width / rect.width;
    const physicalY = (sample.clientY - rect.top) * canvas.height / rect.height;
    return {
      viewX: physicalX,
      viewY: physicalY,
      x: (physicalX - runtimeTranslationX) / runtimeScale,
      y: (physicalY - runtimeTranslationY) / runtimeScale
    };
  };
  function render() {
    renderPending = false;
    // Keep the two surfaces independently dirty-gated. A frame tick may
    // submit the retained amber preview without clearing/repainting canonical.
    module._axiom_ink_preview_render(host);
    if (module._axiom_ink_debug_ui_visible(host)) module._axiom_ink_debug_ui_render(host);
    syncToolSelection();
    const pointCount = trace.length;
    hud.textContent = JSON.stringify({
      pointCount,
      coalescedBatch: lastBatch,
      evidence: latestEvidence ? "ready" : "pending",
      viewportScale: viewportScale().toFixed(2),
      viewportTranslationX: viewportTranslationX().toFixed(2),
      viewportTranslationY: viewportTranslationY().toFixed(2),
      surface: "skia-webgl2"
      ,brushProfile: brushProfileName(), tool: activeTool
    });
  }
  function requestRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(render);
  }
  const snapshotEvidence = () => ({
    version: ++evidenceVersion,
    width: canvas.width,
    height: canvas.height,
    traceSequence: sampleSequence,
    viewportScale: viewportScale(),
    viewportTranslationX: viewportTranslationX(),
    viewportTranslationY: viewportTranslationY(),
    userAgent: navigator.userAgent,
    renderPath: {
      input_boundary: "PointerEvent.coalescedEvents→WASM",
      runtime_boundary: "C++ InkPlaygroundHost",
      renderer: "Skia Ganesh",
      surface_type: "WebGL2 canvas framebuffer",
      submission_count: Number(module._axiom_ink_render_submission_count(host)),
      readback_count: 0,
      cpu_copy_count: 0,
      present_count: Number(module._axiom_ink_render_flush_count(host)),
      viewport_transform_applied: "true"
    },
    baselineObservation: baselineObservation(),
    captureBlob: canvas.toDataURL("image/png")
  });
  const persistEvidence = snapshot => {
    const traceSnapshot = trace.filter(sample => sample.sequence <= snapshot.traceSequence);
    evidenceWorker.postMessage({ ...snapshot, trace: traceSnapshot });
  };
  const scheduleEvidenceSnapshot = () => {
    const snapshot = snapshotEvidence();
    clearTimeout(evidenceTimer);
    evidenceTimer = setTimeout(() => persistEvidence(snapshot), 500);
  };
  const download = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };
  const exportEvidence = () => {
    if (!latestEvidence) return false;
    download(latestEvidence.traceBlob, "web-pointer-trace.json");
    if (latestEvidence.captureBlob) download(latestEvidence.captureBlob, "web-ink-playground.png");
    download(latestEvidence.recordBlob, "web-functional-smoke.json");
    if (latestEvidence.baselineBlob) download(latestEvidence.baselineBlob,
      "observation.json");
    return true;
  };
  evidenceWorker.addEventListener("message", event => {
    if (event.data.version !== evidenceVersion) return;
    latestEvidence = event.data;
    evidenceButton.disabled = false;
    requestRender();
  });
  evidenceWorker.addEventListener("error", event => {
    hud.textContent = `Ink Playground evidence error: ${event.message}`;
  });
  evidenceButton.addEventListener("click", exportEvidence);
  const send = (event, phase) => {
    const coalesced = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
    const list = coalesced.length === 0 ? [event] : coalesced;
    if (phase === "down") {
      started.add(event.pointerId);
    }
    if (!started.has(event.pointerId)) return;
    list.forEach(sample => {
      const point = canvasPoint(sample);
      const phaseCode = phase === "down" && sample === list[0] ? 0
        : phase === "up" && sample === list[list.length - 1] ? 2
        : phase === "cancel" ? 3 : 1;
      const pressure = sample.pressure || 0.5;
      const timeNs = Math.round(sample.timeStamp * 1000000);
      const sequence = ++sampleSequence;
      module._axiom_ink_platform_batch(host, webSource, event.pointerId,
        BigInt(sequence), BigInt(timeNs),
        point.viewX, point.viewY, pressure, phaseCode, selectedBrushFamily,
        point.x, point.y);
      trace.push({ pointer_id: event.pointerId, sequence: sampleSequence,
        x: point.x, y: point.y, pressure, tool: sample.pointerType || "mouse",
        phase, time_ns: timeNs });
    });
    updateViewport();
    const viewportClaimed = module._axiom_ink_viewport_claimed(host) !== 0;
    if (viewportClaimed) {
    }
    lastBatch = list.length;
    if (phase === "up") {
      started.delete(event.pointerId);
      scheduleEvidenceSnapshot();
    } else if (phase === "cancel") {
      module._axiom_ink_platform_batch(host, webSource, event.pointerId,
        BigInt(++sampleSequence), BigInt(nowNs()), 0, 0, 0, 3,
        selectedBrushFamily, 0, 0);
      started.delete(event.pointerId);
      scheduleEvidenceSnapshot();
    }
    requestRender();
  };
  const swallowPageZoom = event => {
    if (event.cancelable) event.preventDefault();
  };
  let gestureStartScale = 1;
  let gestureLastScale = 1;
  const handleWheel = event => {
    if (module._axiom_ink_debug_ui_visible(host) && debugUiWantsMouse()) {
      if (event.cancelable) event.preventDefault();
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const overCanvas = event.target === canvas ||
      (event.clientX >= rect.left && event.clientX <= rect.right &&
       event.clientY >= rect.top && event.clientY <= rect.bottom);
    if (!overCanvas) return;
    swallowPageZoom(event);
    const anchorX = (event.clientX - rect.left) * canvas.width / rect.width;
    const anchorY = (event.clientY - rect.top) * canvas.height / rect.height;
    if (!event.ctrlKey) {
      module._axiom_ink_apply_viewport_wheel_pan(host, event.deltaX, event.deltaY);
      updateViewport();
      requestRender();
      return;
    }
    const factor = Math.exp(-event.deltaY * 0.01);
    module._axiom_ink_apply_viewport_ctrl_wheel_zoom(host, event.deltaY, anchorX, anchorY);
    updateViewport();
    requestRender();
  };
  addEventListener("wheel", handleWheel, { passive: false, capture: true });
  canvas.addEventListener("gesturestart", event => {
    swallowPageZoom(event);
    gestureStartScale = 1;
    gestureLastScale = 1;
  }, { passive: false });
  canvas.addEventListener("gesturechange", event => {
    swallowPageZoom(event);
    const rect = canvas.getBoundingClientRect();
    const anchorX = (event.clientX - rect.left) * canvas.width / rect.width;
    const anchorY = (event.clientY - rect.top) * canvas.height / rect.height;
    const scaleDelta = event.scale / gestureLastScale;
    module._axiom_ink_apply_viewport_gesture(host, scaleDelta, anchorX, anchorY);
    gestureLastScale = event.scale;
    updateViewport();
    requestRender();
  }, { passive: false });
  canvas.addEventListener("gestureend", swallowPageZoom, { passive: false });
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); send(e, "down"); });
  canvas.addEventListener("pointermove", e => { if (started.has(e.pointerId)) send(e, "move"); });
  canvas.addEventListener("pointerup", e => send(e, "up"));
  canvas.addEventListener("pointercancel", e => { if (started.has(e.pointerId)) send(e, "cancel"); });
  addEventListener("keydown", event => {
    if (event.key === "F12") {
      event.preventDefault();
      setDebugVisibility(module._axiom_ink_debug_ui_toggle(host) !== 0);
      return;
    }
    if (module._axiom_ink_debug_ui_visible(host)) {
      sendDebugKey(event, true);
      if (module._axiom_ink_debug_ui_wants_capture_keyboard(host)) event.preventDefault();
    }
  });
  addEventListener("keyup", event => {
    if (module._axiom_ink_debug_ui_visible(host)) sendDebugKey(event, false);
  });
  addEventListener("resize", () => {
    if (module._axiom_ink_debug_ui_visible(host)) module._axiom_ink_debug_ui_render(host);
  });
  requestRender();
  globalThis.axiomInkPlayground = { module, host, exportEvidence,
    toggleDebugUi: () => setDebugVisibility(module._axiom_ink_debug_ui_toggle(host) !== 0),
    getLatestEvidence: () => latestEvidence };
  } catch (error) {
    hud.textContent = `Ink Playground load error: ${error?.stack || error}`;
  }
</script>
