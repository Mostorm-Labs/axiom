<!doctype html>
<meta charset="utf-8">
<title>Axiom Ink Playground</title>
<style>
  body { margin: 0; font: 14px sans-serif; background: #eef1f7; }
  #ink { display: block; width: min(100vw, 1024px); height: min(80vh, 768px);
         background: white; touch-action: none; border: 1px solid #c5cad6; }
  #hud { padding: 8px; color: #25304a; }
</style>
<canvas id="ink" width="1024" height="768"></canvas><pre id="hud">loading</pre>
<script type="module">
  const canvas = document.getElementById("ink");
  const hud = document.getElementById("hud");
  addEventListener("error", event => { hud.textContent = `Ink Playground error: ${event.message}`; });
  addEventListener("unhandledrejection", event => { hud.textContent = `Ink Playground rejection: ${event.reason}`; });
  try {
  const imported = await import("./axiom_ink_playground_web.js");
  const createAxiomInkPlayground = imported.default;
  const module = await createAxiomInkPlayground({ canvas });
  const host = module._axiom_ink_create();
  if (!host || !module._axiom_ink_bind_surface(host, canvas.width, canvas.height)) {
    throw new Error("Ink Playground surface binding failed");
  }
  let stroke = 0;
  let sampleSequence = 0;
  const started = new Set();
  const strokes = [];
  const activeStrokes = new Map();
  const generations = new Map();
  const webSource = 1;
  const nowNs = () => Math.round(performance.now() * 1000000);
  const canvasPoint = sample => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (sample.clientX - rect.left) * canvas.width / rect.width,
      y: (sample.clientY - rect.top) * canvas.height / rect.height
    };
  };
  const send = (event, phase) => {
    const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
    let generation = generations.get(event.pointerId) || 1;
    if (phase === "down") { stroke += 1; started.add(event.pointerId); generation += 1; generations.set(event.pointerId, generation); const active = []; activeStrokes.set(event.pointerId, { points: active, stroke, generation }); strokes.push(active); module._axiom_ink_begin_pointer(host, webSource, event.pointerId, generation, stroke); }
    const activeStroke = activeStrokes.get(event.pointerId);
    if (!activeStroke) return;
    list.forEach(sample => { const point = canvasPoint(sample); const phaseCode = phase === "down" ? 0 : phase === "up" ? 2 : phase === "cancel" ? 3 : 1; module._axiom_ink_pointer_sample_phase(host, webSource, event.pointerId, activeStroke.generation, ++sampleSequence, nowNs(),
      point.x, point.y, sample.pressure || 0.5, 0, phaseCode, nowNs()); activeStroke.points.push(point); });
    if (phase === "up") { module._axiom_ink_commit_pointer(host, webSource, event.pointerId, activeStroke.generation, activeStroke.stroke, activeStroke.stroke); started.delete(event.pointerId); activeStrokes.delete(event.pointerId); }
    const context = canvas.getContext("2d");
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = "#1a5bff"; context.lineWidth = 3;
    strokes.forEach(points => {
      if (points.length === 0) return;
      context.beginPath();
      points.forEach((point, i) => { if (i === 0) context.moveTo(point.x, point.y); else context.lineTo(point.x, point.y); });
      context.stroke();
    });
    const pointCount = strokes.reduce((count, points) => count + points.length, 0);
    hud.textContent = JSON.stringify({ pointCount, coalescedBatch: list.length, surface: "available" });
  };
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); send(e, "down"); });
  canvas.addEventListener("pointermove", e => { if (started.has(e.pointerId)) send(e, "move"); });
  canvas.addEventListener("pointerup", e => send(e, "up"));
  canvas.addEventListener("pointercancel", e => { if (activeStrokes.has(e.pointerId)) send(e, "cancel"); started.delete(e.pointerId); activeStrokes.delete(e.pointerId); });
  globalThis.axiomInkPlayground = { module, host };
  } catch (error) {
    hud.textContent = `Ink Playground load error: ${error?.stack || error}`;
  }
</script>
