<!doctype html>
<meta charset="utf-8">
<title>Axiom Ink Playground</title>
<style>
  body { margin: 0; font: 14px sans-serif; background: #eef1f7; }
  #surfaceStack { position: relative; width: min(100vw, 1024px); height: min(80vh, 768px); }
  #ink, #arcPreview { position: absolute; inset: 0; width: 100%; height: 100%;
         background: white; touch-action: none; border: 1px solid #c5cad6; }
  #arcPreview { pointer-events: none; background: transparent; border: 0; }
  #brushBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; background: #f7f8fb; }
  #brushSelector { min-width: 180px; padding: 6px; font-size: 14px; }
  #hud { padding: 8px; color: #25304a; }
  #evidence { margin: 0 8px 8px; padding: 8px 12px; }
</style>
<div id="brushBar"><label for="brushSelector">笔刷：</label><select id="brushSelector">
  <option value="1">vector-solid-v1</option>
</select><span id="brushDescription">选择后再画下一笔</span></div>
<div id="surfaceStack"><canvas id="ink" width="1024" height="768"></canvas><canvas id="arcPreview" width="1024" height="768"></canvas></div>
<pre id="hud">loading</pre>
<button id="evidence" type="button" disabled>导出 Web 证据</button>
<script type="module">
  const canvas = document.getElementById("ink");
  const previewCanvas = document.getElementById("arcPreview");
  const brushSelector = document.getElementById("brushSelector");
  const brushDescription = document.getElementById("brushDescription");
  const hud = document.getElementById("hud");
  const evidenceButton = document.getElementById("evidence");
  addEventListener("error", event => { hud.textContent = `Ink Playground error: ${event.message}`; });
  addEventListener("unhandledrejection", event => { hud.textContent = `Ink Playground rejection: ${event.reason}`; });
  try {
  const imported = await import("./axiom_ink_playground_web.js");
  const createAxiomInkPlayground = imported.default;
  const module = await createAxiomInkPlayground({ canvas });
  const host = module._axiom_ink_create();
  // The Web App owns canvas/context creation. WASM only wraps the current
  // context through the provider registration seam.
  if (!host || !module._axiom_ink_bind_surface(host, canvas.width, canvas.height)) {
    throw new Error("Ink Playground surface binding failed");
  }
  if (!module._axiom_ink_bind_preview_surface(host, previewCanvas.width, previewCanvas.height)) {
    throw new Error("ARC preview provider binding failed");
  }
  previewCanvas.addEventListener("webglcontextlost", event => { event.preventDefault(); module._axiom_ink_lose_surface(host); });
  previewCanvas.addEventListener("webglcontextrestored", () => {
    previewCanvas.getContext("webgl2");
    module._axiom_ink_rebind_surface(host);
  });
  canvas.addEventListener("webglcontextlost", event => { event.preventDefault(); module._axiom_ink_lose_surface(host); });
  canvas.addEventListener("webglcontextrestored", () => module._axiom_ink_rebind_surface(host));
  const baselineObservation = () => {
    const artifact = `${location.href}|${navigator.userAgent}`;
    const pointer = module.stringToNewUTF8(artifact);
    const result = module._axiom_ink_run_baseline_observation(host, pointer);
    const json = result ? module.UTF8ToString(result) : null;
    module._free(pointer);
    return json;
  };
  const skiaBrushSurface = true;
  let sampleSequence = 0;
  const started = new Set();
  const trace = [];
  const webSource = 1;
  let runtimeScale = 1;
  let runtimeTranslationX = 0;
  let runtimeTranslationY = 0;
  const viewportScale = () => runtimeScale;
  const viewportTranslationX = () => runtimeTranslationX;
  const viewportTranslationY = () => runtimeTranslationY;
  const updateViewport = () => {
    runtimeScale = module._axiom_ink_viewport_scale(host);
    runtimeTranslationX = module._axiom_ink_viewport_translation_x(host);
    runtimeTranslationY = module._axiom_ink_viewport_translation_y(host);
  };
  const evidenceWorker = new Worker("./evidence_worker.js");
  let evidenceTimer = 0;
  let evidenceVersion = 0;
  let renderPending = false;
  let lastBatch = 0;
  let latestEvidence = null;
  let selectedBrushFamily = 1;
  const brushFamilyName = () => "vector-solid-v1";
  brushSelector.innerHTML = '<option value="1">vector-solid-v1</option>';
  brushSelector.addEventListener("change", () => {
    selectedBrushFamily = 1;
    brushDescription.textContent = "vector-solid-v1";
    requestRender();
  });
  const nowNs = () => Math.round(performance.now() * 1000000);
  const canvasPoint = sample => {
    const rect = canvas.getBoundingClientRect();
    const physicalX = (sample.clientX - rect.left) * canvas.width / rect.width;
    const physicalY = (sample.clientY - rect.top) * canvas.height / rect.height;
    return {
      viewX: physicalX,
      viewY: physicalY,
      x: (physicalX - runtimeTranslationX) / runtimeScale,
      y: (physicalY - runtimeTranslationY) / runtimeScale
    };
  };
  const render = () => {
    renderPending = false;
    // Keep the two surfaces independently dirty-gated. A frame tick may
    // submit the retained amber preview without clearing/repainting canonical.
    module._axiom_ink_preview_render(host);
    const pointCount = trace.length;
    hud.textContent = JSON.stringify({
      pointCount,
      coalescedBatch: lastBatch,
      evidence: latestEvidence ? "ready" : "pending",
      viewportScale: viewportScale().toFixed(2),
      viewportTranslationX: viewportTranslationX().toFixed(2),
      viewportTranslationY: viewportTranslationY().toFixed(2),
      surface: "skia-webgl2"
    });
  };
  const requestRender = () => {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(render);
  };
  const snapshotEvidence = () => ({
    version: ++evidenceVersion,
    width: canvas.width,
    height: canvas.height,
    traceSequence: sampleSequence,
    viewportScale: viewportScale(),
    viewportTranslationX: viewportTranslationX(),
    viewportTranslationY: viewportTranslationY(),
    userAgent: navigator.userAgent,
    renderPath: {
      input_boundary: "PointerEvent.coalescedEvents→WASM",
      runtime_boundary: "C++ InkPlaygroundHost",
      renderer: "Skia Ganesh",
      surface_type: "WebGL2 canvas framebuffer",
      submission_count: Number(module._axiom_ink_render_submission_count(host)),
      readback_count: 0,
      cpu_copy_count: 0,
      present_count: Number(module._axiom_ink_render_flush_count(host)),
      viewport_transform_applied: "true"
    },
    baselineObservation: baselineObservation(),
    captureBlob: canvas.toDataURL("image/png")
  });
  const persistEvidence = snapshot => {
    const traceSnapshot = trace.filter(sample => sample.sequence <= snapshot.traceSequence);
    evidenceWorker.postMessage({ ...snapshot, trace: traceSnapshot });
  };
  const scheduleEvidenceSnapshot = () => {
    const snapshot = snapshotEvidence();
    clearTimeout(evidenceTimer);
    evidenceTimer = setTimeout(() => persistEvidence(snapshot), 500);
  };
  const download = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };
  const exportEvidence = () => {
    if (!latestEvidence) return false;
    download(latestEvidence.traceBlob, "web-pointer-trace.json");
    if (latestEvidence.captureBlob) download(latestEvidence.captureBlob, "web-ink-playground.png");
    download(latestEvidence.recordBlob, "web-functional-smoke.json");
    if (latestEvidence.baselineBlob) download(latestEvidence.baselineBlob,
      "observation.json");
    return true;
  };
  evidenceWorker.addEventListener("message", event => {
    if (event.data.version !== evidenceVersion) return;
    latestEvidence = event.data;
    evidenceButton.disabled = false;
    requestRender();
  });
  evidenceWorker.addEventListener("error", event => {
    hud.textContent = `Ink Playground evidence error: ${event.message}`;
  });
  evidenceButton.addEventListener("click", exportEvidence);
  const send = (event, phase) => {
    const coalesced = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
    const list = coalesced.length === 0 ? [event] : coalesced;
    if (phase === "down") started.add(event.pointerId);
    if (!started.has(event.pointerId)) return;
    list.forEach(sample => {
      const point = canvasPoint(sample);
      const phaseCode = phase === "down" && sample === list[0] ? 0
        : phase === "up" && sample === list[list.length - 1] ? 2
        : phase === "cancel" ? 3 : 1;
      const pressure = sample.pressure || 0.5;
      const timeNs = Math.round(sample.timeStamp * 1000000);
      const sequence = ++sampleSequence;
      module._axiom_ink_platform_batch(host, webSource, event.pointerId,
        BigInt(sequence), BigInt(timeNs),
        point.viewX, point.viewY, pressure, phaseCode, selectedBrushFamily,
        point.x, point.y);
      trace.push({ pointer_id: event.pointerId, sequence: sampleSequence,
        x: point.x, y: point.y, pressure, tool: sample.pointerType || "mouse",
        phase, time_ns: timeNs });
    });
    updateViewport();
    const viewportClaimed = module._axiom_ink_viewport_claimed(host) !== 0;
    if (viewportClaimed) {
    }
    lastBatch = list.length;
    if (phase === "up") {
      started.delete(event.pointerId);
      scheduleEvidenceSnapshot();
    } else if (phase === "cancel") {
      module._axiom_ink_platform_batch(host, webSource, event.pointerId,
        BigInt(++sampleSequence), BigInt(nowNs()), 0, 0, 0, 3,
        selectedBrushFamily, 0, 0);
      started.delete(event.pointerId);
      scheduleEvidenceSnapshot();
    }
    requestRender();
  };
  const swallowPageZoom = event => {
    if (event.cancelable) event.preventDefault();
  };
  let gestureStartScale = 1;
  let gestureLastScale = 1;
  const handleWheel = event => {
    const rect = canvas.getBoundingClientRect();
    const overCanvas = event.target === canvas ||
      (event.clientX >= rect.left && event.clientX <= rect.right &&
       event.clientY >= rect.top && event.clientY <= rect.bottom);
    if (!overCanvas) return;
    swallowPageZoom(event);
    const anchorX = (event.clientX - rect.left) * canvas.width / rect.width;
    const anchorY = (event.clientY - rect.top) * canvas.height / rect.height;
    if (!event.ctrlKey) {
      module._axiom_ink_apply_viewport_wheel_pan(host, event.deltaX, event.deltaY);
      updateViewport();
      requestRender();
      return;
    }
    const factor = Math.exp(-event.deltaY * 0.01);
    module._axiom_ink_apply_viewport_ctrl_wheel_zoom(host, event.deltaY, anchorX, anchorY);
    updateViewport();
    requestRender();
  };
  addEventListener("wheel", handleWheel, { passive: false, capture: true });
  canvas.addEventListener("gesturestart", event => {
    swallowPageZoom(event);
    gestureStartScale = 1;
    gestureLastScale = 1;
  }, { passive: false });
  canvas.addEventListener("gesturechange", event => {
    swallowPageZoom(event);
    const rect = canvas.getBoundingClientRect();
    const anchorX = (event.clientX - rect.left) * canvas.width / rect.width;
    const anchorY = (event.clientY - rect.top) * canvas.height / rect.height;
    const scaleDelta = event.scale / gestureLastScale;
    module._axiom_ink_apply_viewport_gesture(host, scaleDelta, anchorX, anchorY);
    gestureLastScale = event.scale;
    updateViewport();
    requestRender();
  }, { passive: false });
  canvas.addEventListener("gestureend", swallowPageZoom, { passive: false });
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); send(e, "down"); });
  canvas.addEventListener("pointermove", e => { if (started.has(e.pointerId)) send(e, "move"); });
  canvas.addEventListener("pointerup", e => send(e, "up"));
  canvas.addEventListener("pointercancel", e => { if (started.has(e.pointerId)) send(e, "cancel"); });
  requestRender();
  globalThis.axiomInkPlayground = { module, host, exportEvidence,
    getLatestEvidence: () => latestEvidence };
  } catch (error) {
    hud.textContent = `Ink Playground load error: ${error?.stack || error}`;
  }
</script>
