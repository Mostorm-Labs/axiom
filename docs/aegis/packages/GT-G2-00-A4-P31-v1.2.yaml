cpp_contract:
  RecordHandle: std::uint64_t
  SceneDelta:
    header: runtime/scene/include/canvas/scene/scene_delta.hpp
    fields: [generationFrom, generationTo, addedRecords, updatedRecords, removedHandles, orderChanges, boundsChanges]
    owner: RuntimeScene_execution_layer_only
  PreparedDelta:
    header: runtime/scene/include/canvas/scene/scene_delta.hpp
    fields: [sceneDelta, slotWrites, objectIndexUpdates, orderIndexUpdates]
    move_only: true
    wrapper: foundation::Result<std::unique_ptr<PreparedDelta>>

  SceneRecordStore:
    prepareApply: foundation::Result<PreparedDelta>(std::span<const SceneMutation>) const
    commit: void(PreparedDelta&&) noexcept
    materializeSnapshot: foundation::Result<std::vector<SceneRecord>>() const
    full_enumeration_only_in: materializeSnapshot

  RenderBoundary:
    interface_header: runtime/scene/include/canvas/scene/render_scene.hpp
    delta_prepare: foundation::Result<std::unique_ptr<IPreparedRenderSceneUpdate>>(const SceneDelta&, SceneRevision, SceneRevision) const
    delta_commit: void(std::unique_ptr<IPreparedRenderSceneUpdate>) noexcept
    legacy_prepareApply: retained_adapter_for_existing_RF01_tests
    delta_adapter_rule: converts_only_changed_records_and_never_calls_prepareReplace

  SpatialBoundary:
    interface_header: runtime/scene/include/canvas/scene/spatial_index.hpp
    delta_prepare: foundation::Result<std::unique_ptr<IPreparedSpatialUpdate>>(const SceneDelta&, SceneRevision, SceneRevision) const
    delta_commit: void(std::unique_ptr<IPreparedSpatialUpdate>) noexcept
    legacy_prepareApply: retained_adapter_for_existing_RF01_tests
    delta_adapter_rule: converts_only_changed_bounds_and_never_calls_prepareReplace
    A5_differential: deferred

  ShadowRenderScene:
    header: runtime/scene/include/canvas/scene/shadow_render_scene.hpp
    source: runtime/scene/src/shadow_render_scene.cpp
    delta_prepare: forwards_same_SceneDelta_to_primary_and_shadow
    delta_failure: first_error_preserved_as_foundation_Result
    no_full_snapshot: true

  UniformGridSpatialIndex:
    header: runtime/scene/include/canvas/scene/uniform_grid_spatial_index.hpp
    source: runtime/scene/src/uniform_grid_spatial_index.cpp
    delta_prepare: bounded_cell_updates_from_SceneDelta
    no_full_rebuild: true
    A5_spatial_differential: forbidden

  SceneApply:
    prepare_order: [SceneRecordStore, RenderBoundary.delta_prepare, SpatialBoundary.delta_prepare]
    commit_order: [SceneRecordStore, RenderBoundary.delta_commit, SpatialBoundary.delta_commit, revision_publish]
    prepare_failure: no_published_store_consumer_or_revision_changes
    commit: noexcept

