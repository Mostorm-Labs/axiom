D1_prepared_publication_contract:
  prepare:
    may_allocate: true
    may_fail: true
    live_published_state_mutation: forbidden
    must_complete_or_materialize:
      - validation_and_before_image_checks
      - spatial_identity_resolution_or_reservation
      - old_new_coverage_and_differential
      - newly_required_record_storage
      - newly_required_lookup_storage
      - final_affected_cell_memberships_or_equivalent_prepared_state
      - overflow_state_or_equivalent_prepared_state
      - all_capacity_nodes_or_storage_needed_so_commit_introduces_no_new_failure_surface
  commit:
    noexcept_required: true
    must_complete_after_successful_prepare: true
    actual_ordinary_dynamic_allocation: forbidden
    unprepared_fallible_growth: forbidden
    fallible_rehash_or_reallocation: forbidden
    coverage_recomputation: forbidden
    full_index_rebuild: forbidden
    full_record_clone: forbidden
    unrelated_full_cell_scan: forbidden
    new_error_surface: forbidden
    implementation_APIs_are_not_the_contract: true
    API_use_allowed_when_preconditions_make_it_no_fail_no_allocation:
      - vector_push_back_with_proven_prepared_capacity
      - vector_resize_with_proven_prepared_capacity_and_nonfallible_element_work
      - existing_key_operator_access
      - node_handle_or_preallocated_node_transfer
      - swap_or_move_of_prepared_storage_when_noexcept_and_allocation_free
      - link_unlink_preallocated_nodes
      - scalar_or_bounds_write
      - revision_and_diagnostics_publication
  prepare_failure:
    published_state_unchanged: true
    bound_revision_unchanged: true
    committed_locality_diagnostics_unchanged: true

