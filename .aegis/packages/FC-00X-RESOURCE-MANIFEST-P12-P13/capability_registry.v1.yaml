schema: axiom.snapshot-capability-registry.v1
status: candidate_requires_independent_control_review
capabilities:
  - id: legacy-no-manifest-v1
    mode: read_only_compatibility
    allows:
      - absent_resource_manifest_field
      - empty_manifest_projection
    forbids:
      - malformed_present_manifest_fallback
      - new_snapshot_without_explicit_manifest
      - provider_metadata_filling_manifest
    migration_window: legacy_snapshot_schema_version_1_or_2_without_manifest_only
    expiry_rule: reader_must_emit_explicit_manifest_on_next_write
  - id: resource-manifest-v1
    mode: canonical_read_write
    requires:
      - explicit_resource_manifest
      - digest_algorithm_1
      - snapshot_revision_frontier_digest_binding
  - id: shape2-triangle-v1
    mode: inherited_snapshot_admission
    source: SnapshotCapability::kShape2Triangle
    numeric_value: 1
    applies_to:
      - legacy_schema2_external_admission
      - schema3_required_ids_when_object_set_uses_shape2_triangle
    encoding: ASCII capability id in sorted CapabilityRequirementsV1.required_ids
unknown_policy: fail_closed
