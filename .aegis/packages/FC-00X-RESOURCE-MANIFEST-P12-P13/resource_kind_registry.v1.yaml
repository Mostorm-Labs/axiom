resource_kind_registry:
  schema: axiom.resource-kind-registry.v1
  status: candidate_requires_independent_control_review
  values:
    - {id: 1, symbol: Image, metadata_schema: image-resource-metadata-v1, decode_version: 1, layout_version: 0, max_metadata_bytes: 4096}
    - {id: 2, symbol: Font, metadata_schema: font-resource-metadata-v1, decode_version: 1, layout_version: 1, max_metadata_bytes: 8192}
    - {id: 3, symbol: Brush, metadata_schema: brush-resource-metadata-v1, decode_version: 1, layout_version: 0, max_metadata_bytes: 4096}
  reserved: 4..255
  unknown_policy: fail_closed_for_required_entries
  metadata_encoding: canonical-protobuf-bytes-with-explicit-schema-version
  metadata_schemas:
    image-resource-metadata-v1: [schema_version=1, pixel_width>=1, pixel_height>=1, color_policy=1]
    font-resource-metadata-v1: [schema_version=1, collection_index=0..65535-present, layout_profile=1]
    brush-resource-metadata-v1: [schema_version=1, asset_role=1|2, pixel_width>=1, pixel_height>=1, color_policy=1]
  content_hash: sha256-lowercase-hex-with-algorithm-prefix
  entry_limits:
    max_entries: 65535
    max_tombstones: 65535
    max_metadata_total_bytes: 8388608
    max_lineage_token_bytes: 32
  metadata_rules:
    schema_version_field_required: true
    unknown_fields: reject
    duplicate_fields: reject
    absent_vs_default: distinct_unless_registry_declares_equal
