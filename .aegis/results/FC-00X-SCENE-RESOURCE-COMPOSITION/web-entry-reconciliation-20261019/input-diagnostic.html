<!doctype html><meta charset="utf-8"><title>Web input diagnostic</title>
<iframe id="page" src="/ink_playground/" width="1200" height="900"></iframe>
<pre id="result">PENDING</pre>
<script type="module">
const results = [];
const frame = document.getElementById('page');
const wait = () => new Promise(resolve => setTimeout(resolve, 25));
const run = async () => {
  try {
    for (let i = 0; !frame.contentWindow.axiomInkPlayground && i < 300; ++i) await wait();
    const { module: m, host } = frame.contentWindow.axiomInkPlayground;
    const doc = frame.contentDocument;
    const observe = () => {
      const name = m.stringToNewUTF8('web-drawing-failure-diagnostic');
      const raw = m._axiom_ink_run_baseline_observation(host, name);
      m._free(name);
      return JSON.parse(m.UTF8ToString(raw));
    };
    const pixels = id => {
      const c = doc.getElementById(id), gl = c.getContext('webgl2');
      const data = new Uint8Array(c.width * c.height * 4);
      gl.readPixels(0, 0, c.width, c.height, gl.RGBA, gl.UNSIGNED_BYTE, data);
      let visible = 0, dark = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3]) ++visible;
        if (data[i + 3] && data[i] < 230 && data[i + 1] < 230) ++dark;
      }
      return { visible, dark, glError: gl.getError() };
    };
    results.push({ step: 'before', observation: observe(), ink: pixels('ink'), preview: pixels('arcPreview') });
    let sequence = 0n, time = 1000000000n;
    for (const [phase, x] of [[0, 30], [1, 90], [1, 140], [2, 180]]) {
      time += 16000000n;
      const accepted = m._axiom_ink_platform_batch(host, 1, 101, ++sequence, time,
        x, 80, .5, phase, 1, 3, x, 80);
      const rendered = m._axiom_ink_preview_render(host);
      results.push({ step: 'wasm', phase, accepted, rendered, observation: observe(),
        ink: pixels('ink'), preview: pixels('arcPreview') });
    }
    const canvas = doc.getElementById('ink');
    // Only capture is stubbed for untrusted DOM test events. This does not
    // establish physical capture behavior; the input and rendering stay real.
    canvas.setPointerCapture = () => {};
    canvas.releasePointerCapture = () => {};
    const rect = canvas.getBoundingClientRect();
    const forwarded = [], errors = [];
    const original = m._axiom_ink_platform_batch;
    m._axiom_ink_platform_batch = (...args) => {
      const accepted = original(...args);
      forwarded.push({ source: args[1], pointer: args[2], sequence: String(args[3]),
        timestamp: String(args[4]), x: args[5], y: args[6], phase: args[8], accepted });
      return accepted;
    };
    frame.contentWindow.addEventListener('error', event => errors.push(event.message));
    for (const [type, x] of [['pointerdown', 30], ['pointermove', 100], ['pointerup', 180]]) {
      canvas.dispatchEvent(new frame.contentWindow.PointerEvent(type, { pointerId: 501,
        pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true,
        clientX: rect.left + x, clientY: rect.top + 150, pressure: .5, buttons: type === 'pointerup' ? 0 : 1 }));
      await wait();
    }
    m._axiom_ink_preview_render(host);
    results.push({ step: 'dom', forwarded, errors, observation: observe(),
      ink: pixels('ink'), preview: pixels('arcPreview'), hud: doc.getElementById('hud').textContent });
    document.getElementById('result').textContent = JSON.stringify({ status: 'DIAGNOSTIC', results });
  } catch (error) {
    document.getElementById('result').textContent = JSON.stringify({ status: 'FAIL', results, error: String(error), stack: error.stack });
  }
};
frame.addEventListener('load', run, { once: true });
</script>
