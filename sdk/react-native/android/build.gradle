buildscript {
 repositories { google(); mavenCentral() }
 dependencies {
  classpath 'com.android.tools.build:gradle:8.11.0'
  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
 }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'
def nativeSdk = project.findProperty('axiomNativeSdkRoot') ?: file('../native/android').absolutePath
android {
 namespace 'dev.mostorm.axiom'
 compileSdk 36
 ndkVersion '27.2.12479018'
 defaultConfig {
  minSdk 26
  externalNativeBuild { cmake { arguments "-DAXIOM_NATIVE_SDK_ROOT=${nativeSdk}"; cppFlags '-std=c++20' } }
 }
 externalNativeBuild { cmake { path 'CMakeLists.txt' } }
 sourceSets { main { jniLibs.srcDirs = ["${nativeSdk}/lib"]; assets.srcDirs = ['../native/assets'] } }
}
react { jsRootDir = file('../src/specs'); libraryName = 'AxiomNativeSpec'; codegenJavaPackageName = 'dev.mostorm.axiom' }
dependencies { implementation 'com.facebook.react:react-android' }
