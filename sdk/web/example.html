<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom SDK Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font: 13px system-ui, sans-serif; color: #243246; background: #f5f7fa; }
  button, select, input { font: inherit; }
  button, select, input[type=number] { min-height: 32px; border: 1px solid #d7dee8; border-radius: 6px; color: inherit; background: white; }
  button { padding: 5px 11px; white-space: nowrap; cursor: pointer; }
  button:hover:not(:disabled) { background: #f0f5fc; border-color: #a8bfdc; }
  button[aria-pressed=true] { color: #174c99; background: #e7f0ff; border-color: #8bb1eb; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid #3978cf; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #tools { flex: none; background: #fff; border-bottom: 1px solid #dbe2ec; }
  .toolbar-row { display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #edf0f5; }
  .toolbar-row:last-child { border: 0; background: #f8fafc; }
  .row-label { flex: 0 0 44px; color: #7b8798; font-size: 12px; }
  .row-content { min-width: 0; flex: 1; display: flex; align-items: center; gap: 16px; overflow-x: auto; padding: 8px 2px; scrollbar-width: thin; }
  .group { display: flex; flex: none; align-items: center; gap: 6px; white-space: nowrap; }
  #ink-parameters { flex-wrap: wrap; white-space: normal; max-width: min(1500px, calc(100vw - 90px)); row-gap: 10px; }
  #ink-parameters output { min-width: 30px; font-variant-numeric: tabular-nums; }
  .group + .group { border-left: 1px solid #e1e6ee; padding-left: 16px; }
  label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=color] { width: 30px; height: 30px; padding: 2px; border: 1px solid #d7dee8; border-radius: 6px; background: white; cursor: pointer; }
  input[type=number] { width: 68px; padding: 4px 6px; }
  input[type=range] { width: 100px; accent-color: #3978cf; }
  label[data-mixed=true]::after { content: "混合"; color: #946317; font-size: 10px; }
  .mixed-value { color: #946317; font-size: 11px; }
  input[type=checkbox] { accent-color: #3978cf; }
  select { max-width: 170px; padding: 4px 8px; }
  .hint { color: #8290a3; white-space: nowrap; }
  #context-title { color: #52657d; font-weight: 500; white-space: nowrap; flex: none; }
  #canvas { flex: 1; min-height: 160px; position: relative; overflow: hidden; background: white; }
  #status { flex: none; min-height: 28px; padding: 6px 16px; margin: 0; color: #6a7a90; font-size: 12px; white-space: pre-wrap; }
  #status[data-error=true] { color: #b42318; background: #fff1f0; }
  dialog { width: min(390px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; margin: auto; padding: 22px; border: 1px solid #dbe2ec; border-radius: 12px; color: inherit; box-shadow: 0 12px 60px #172c4c30; }
  dialog::backdrop { background: #15243a35; }
  dialog h2 { margin: 0 0 18px; font-size: 17px; }
  .settings { display: grid; gap: 16px; }
  .settings > label { justify-content: space-between; }
  .settings select { min-width: 125px; }
  .settings .hint { white-space: normal; line-height: 1.6; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .primary { color: white; background: #2866ba; border-color: #2866ba; }
  .primary:hover:not(:disabled) { color: white; background: #1f55a0; }
  #background-preview { display: block; height: 80px; border: 1px solid #d7dee8; border-radius: 6px; }
  @media (max-width: 600px) { .toolbar-row { padding: 0 8px; } .row-label { flex-basis: 34px; } .row-content { gap: 10px; } .group + .group { padding-left: 10px; } }
</style>
<header id="tools" aria-busy="true" inert>
  <nav class="toolbar-row" aria-label="绘制工具"><span class="row-label">工具</span><div id="drawing-tools" class="row-content"></div></nav>
  <nav class="toolbar-row" aria-label="工具与对象参数"><span class="row-label">参数</span><div id="context-tools" class="row-content"><span id="context-title"></span></div></nav>
  <nav class="toolbar-row" aria-label="文字与对象属性"><span class="row-label">属性</span><div id="detail-tools" class="row-content"></div></nav>
  <nav class="toolbar-row" aria-label="画板操作"><span class="row-label">画板</span><div id="board-tools" class="row-content"></div></nav>
</header>
<div id="canvas"></div>
<output id="status" role="status">Loading SDK…</output>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="background-panel" aria-labelledby="background-title">
  <h2 id="background-title">画板背景</h2>
  <div class="settings">
    <label>背景样式<select id="background-mode"><option value="plain">纯色</option><option value="dots">点阵</option><option value="grid">方格线</option></select></label>
    <label>底色<input id="background-color" type="color" aria-label="底色"></label>
    <label>点线颜色<input id="background-pattern-color" type="color" aria-label="点线颜色"></label>
    <span id="background-preview" aria-label="背景预览"></span>
  </div>
  <div class="dialog-actions"><button id="background-cancel" type="button">取消更改</button><button id="background-apply" type="button" class="primary">应用背景</button></div>
</dialog>
<dialog id="export-panel" aria-labelledby="export-title">
  <h2 id="export-title">导出画板图片</h2>
  <div class="settings">
    <label>图片格式<select id="export-format"><option value="png">PNG</option><option value="jpg">JPG</option><option value="jpeg">JPEG</option></select></label>
    <label>导出倍率<select id="export-scale"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <label>透明背景<input id="export-transparent" type="checkbox"></label>
    <label>包含点线<input id="export-pattern" type="checkbox" checked></label>
    <span class="hint">导出画板全部内容，包含屏幕外的对象。</span>
  </div>
  <div class="dialog-actions"><button id="export-cancel" type="button">取消</button><button id="export-image" type="button" class="primary">导出图片</button></div>
</dialog>
<dialog id="table-panel" aria-labelledby="table-title">
  <h2 id="table-title">插入表格</h2><div class="settings">
    <label>行数<input id="table-rows" type="number" value="3" min="1" max="64" step="1"></label>
    <label>列数<input id="table-columns" type="number" value="3" min="1" max="64" step="1"></label>
    <span class="hint">最多 1024 个单元格。确认后点击画板放置，Esc 取消。双击单元格编辑文字。</span>
  </div><div class="dialog-actions"><button id="table-cancel">取消</button><button id="table-place" class="primary">在画板放置</button></div>
</dialog>
<script type="module">
import {createRuntime} from './axiom.mjs';
const $ = id => document.getElementById(id);
const status = $('status'), tools = $('tools');
let sdk, syncContext = () => {}, syncBackground = () => {};
const fail = error => { status.dataset.error = 'true'; status.textContent = `${error.code || 'ERROR'}: ${error.message}`; };
const show = () => {
  if (!sdk) return;
  const state = sdk.readState();
  status.dataset.error = 'false';
  status.textContent = `${state.objects} objects · ${state.selected.length} selected · Zoom ${state.camera.scale.toFixed(2)}`;
  syncContext(state); syncBackground();
};
const run = async action => { try { await action(); show(); } catch (error) { fail(error); } };
const button = (parent, label, action, id) => {
  const element = document.createElement('button'); element.type = 'button'; element.textContent = label;
  if (id) element.id = id;
  element.onclick = () => run(action); parent.append(element); return element;
};
const group = (parent, id) => {
  const element = document.createElement('div'); element.className = 'group';
  if (id) element.id = id;
  parent.append(element); return element;
};
const field = (parent, label, type, id) => {
  const wrapper = document.createElement('label'); wrapper.textContent = label;
  const input = document.createElement('input'); input.type = type; input.id = id;
  input.setAttribute('aria-label', label); wrapper.append(input); parent.append(wrapper); return input;
};
const select = (parent, label, id, choices) => {
  const wrapper = document.createElement('label'); wrapper.textContent = label;
  const input = document.createElement('select'); input.id = id; input.setAttribute('aria-label', label);
  for (const [value, text] of choices) input.add(new Option(text, value));
  wrapper.append(input); parent.append(wrapper); return input;
};
const hex = color => '#' + color.slice(0, 3).map(n => Math.round(n * 255).toString(16).padStart(2, '0')).join('');
const rgba = (value, alpha = 1) => [1, 3, 5].map(i => parseInt(value.slice(i, i + 2), 16) / 255).concat(alpha);
const setValue = (input, value) => { if (document.activeElement !== input) input.value = value; };
try {
  sdk = await createRuntime({mount: $('canvas'), permission: 'localSingleUser', onError: fail, onChange: show});
  const drawing = $('drawing-tools'), context = $('context-tools'), details = $('detail-tools'), board = $('board-tools');
  const drawingGroup = group(drawing);
  const toolButtons = [];
  const addTool = (label, key, action, parent = drawingGroup) => {
    const element = button(parent, label, action); element.dataset.tool = key;
    element.setAttribute('aria-pressed', 'false'); toolButtons.push(element);
  };
  for (const [label, tool, code] of [['Ink', 'ink', 0], ['Text', 'text', 4]])
    addTool(label, `tool:${code}`, () => sdk.selectTool(tool));
  for (const [shape, label, code] of [['rectangle', '矩形', 0], ['ellipse', '椭圆', 1], ['triangle', '三角形', 2], ['line', '直线', 3], ['arrow', '连线', 4], ['sticky', '便签', 5]])
    addTool(label, `shape:${code}`, () => sdk.selectShape(shape));
  addTool('Eraser', 'tool:2', () => sdk.selectTool('partialEraser'));
  button(drawingGroup,'表格',()=> $('table-panel').showModal(),'table-open');
  const pathSamples={
    hole:[{op:'move',point:[0,0]},{op:'line',point:[160,0]},{op:'line',point:[160,160]},{op:'line',point:[0,160]},{op:'close'},{op:'move',point:[40,40]},{op:'line',point:[120,40]},{op:'line',point:[120,120]},{op:'line',point:[40,120]},{op:'close'}],
    curve:[{op:'move',point:[0,50]},{op:'quad',control:[50,-20],point:[100,50]},{op:'cubic',control1:[130,110],control2:[165,-10],point:[200,50]}]
  };
  const addPath=kind=>run(async()=>{await sdk.text.finish();await sdk.selectTool('select');const camera=sdk.readState().camera,rect=sdk.canvas.getBoundingClientRect();await sdk.createVectorPath({commands:pathSamples[kind],fillRule:kind==='hole'?'evenodd':'nonzero',x:(rect.width/2-camera.x)/camera.scale-80,y:(rect.height/2-camera.y)/camera.scale-80});});
  button(drawingGroup,'带孔路径',()=>addPath('hole'),'path-hole');
  button(drawingGroup,'开放曲线',()=>addPath('curve'),'path-curve');
  let tablePlacement=null;
  $('table-cancel').onclick=()=> $('table-panel').close();
  $('table-place').onclick=()=>run(async()=>{
    const rows=Number($('table-rows').value),columns=Number($('table-columns').value);
    if(!Number.isInteger(rows)||!Number.isInteger(columns)||rows<1||columns<1||rows>64||columns>64||rows*columns>1024)throw Error('请输入有效行列数，总单元格不超过 1024');
    await sdk.text.finish();await sdk.selectTool('select');tablePlacement={rows,columns};$('table-panel').close();
    sdk.canvas.style.cursor='crosshair';status.textContent='点击画板放置表格，Esc 取消';
  });
  const cancelPlacement=()=>{tablePlacement=null;sdk.canvas.style.cursor='';};
  $('canvas').addEventListener('pointerdown',event=>{if(tablePlacement){event.preventDefault();event.stopImmediatePropagation();$('canvas').setPointerCapture(event.pointerId);}},true);
  $('canvas').addEventListener('pointerup',event=>{if(!tablePlacement)return;event.preventDefault();event.stopImmediatePropagation();const placement=tablePlacement;cancelPlacement();const rect=sdk.canvas.getBoundingClientRect(),camera=sdk.readState().camera;
    void run(()=>sdk.table.create({...placement,x:(event.clientX-rect.left-camera.x)/camera.scale,y:(event.clientY-rect.top-camera.y)/camera.scale}));},true);
  $('canvas').addEventListener('pointercancel',cancelPlacement,true);
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&tablePlacement){cancelPlacement();show();}});


  const file = $('file'); let replaceImage = false;
  const chooseImage = replace => { replaceImage = replace; file.value = ''; file.click(); };
  button(group(drawing), '导入图片', () => chooseImage(false), 'image-import');
  file.onchange = () => run(async () => {
    const image = file.files?.[0]; if (!image) return;
    const bytes = new Uint8Array(await image.arrayBuffer());
    if (replaceImage) await sdk.replaceImage(bytes, image.type); else await sdk.importImage(bytes, image.type);
  });

  const inkGroup = group(context, 'ink-parameters');
  const presetNames = {'round-regular':'规则圆头笔','round-handdrawn':'手绘圆头笔','laser-transient':'激光笔','marker-compact-v1':'马克笔','chalk-compact-v1':'粉笔','crayon-wax-v1':'蜡笔','watercolor-lite-v1':'轻量水彩','vector-solid-v1': '旧圆头笔', 'marker-flat-v1': '旧马克笔', 'chalk-grain-v1': '旧粉笔', 'membrane-v1': '纹理笔'};
  const presets = [...sdk.brushPresets().reduce((map,preset)=>{
    const previous=map.get(preset.profileId);
    if(!previous||preset.revision>previous.revision)map.set(preset.profileId,preset);
    return map;
  },new Map()).values()];
  const brush = select(inkGroup, '笔刷', 'ink-preset', [['', '切换预设…'], ...presets.map((preset, index) => [String(index), presetNames[preset.profileId] || `笔刷 ${index + 1}`])]);
  const brushHint=document.createElement('span');brushHint.id='ink-hint';brushHint.className='hint';inkGroup.append(brushHint);
  brush.onchange = () => run(async () => { if (brush.value !== '') { const preset = presets[Number(brush.value)]; await sdk.selectBrush(preset.profileId, preset.revision); await sdk.selectTool('ink'); syncBrush(); } });

  const pressureMode=select(inkGroup,'压力来源','ink-pressure',[['1','模拟压力（默认）'],['2','设备压力（需设备能力）']]);
  const inkColor=field(inkGroup,'笔迹颜色','color','ink-color');
  inkColor.onchange=()=>run(async()=>{const c=sdk.readBrushConfig();if(c)await sdk.setBrushConfig({...c,color:rgba(inkColor.value,c.color[3])});});
  const inkControls={};
  for(const [key,label,min,max,step] of [['size','笔宽',1,128,1],['opacity','透明度',0,1,.05],['thinning','粗细变化 Thinning',-1,1,.01],['streamline','轨迹稳定 Streamline',0,1,.01],['smoothing','曲线平滑 Smoothing',0,1,.01],['startTaper','起笔收尖（世界单位）',0,128,1],['endTaper','收笔收尖（世界单位）',0,128,1],['markerAngle','笔头角度',-3.14,3.14,.05],['markerFlatness','扁率',.05,1,.05],['density','粉笔覆盖率',0,1,.05],['textureScale','纸纹尺度',.25,32,.25],['deposition','蜡笔沉积',0,1,.05],['wetEdge','水彩湿边',0,1,.05]]){
    const control=field(inkGroup,label,'range','ink-'+key);control.min=min;control.max=max;control.step=step;inkControls[key]=control;
    const value=document.createElement('output');value.textContent=control.value;control.parentElement.append(value);
    control.oninput=()=>{value.textContent=control.value;};
    control.onchange=()=>run(async()=>{const c=sdk.readBrushConfig();if(c){await sdk.setBrushConfig({...c,[key]:Number(control.value)});syncBrush();}});
  }
  const vectorControls=['thinning','streamline','smoothing','startTaper','endTaper'];
  const familyControls={1:['size','opacity',...vectorControls],2:['size','opacity','markerAngle','markerFlatness',...vectorControls],3:['size','opacity','density','textureScale'],4:['size','opacity','deposition','textureScale','thinning','streamline','startTaper','endTaper'],5:['size','opacity','wetEdge','textureScale'],6:['size','opacity']};
  const easingMode=select(inkGroup,'粗细响应 Easing','ink-easing',[['1','Linear'],['2','Ease in'],['3','Ease out'],['4','Smoothstep']]);
  const pressureModel=select(inkGroup,'模拟压力算法','ink-pressure-model',[['2','点间距（perfect-freehand 风格）'],['1','速度 / 时间']]);
  const startCap=field(inkGroup,'起笔圆头 Cap','checkbox','ink-start-cap');
  const endCap=field(inkGroup,'收笔圆头 Cap','checkbox','ink-end-cap');
  for(const [control,key] of [[easingMode,'easing'],[pressureModel,'pressureModel'],[startCap,'startCap'],[endCap,'endCap']]){
    control.onchange=()=>run(async()=>{const c=sdk.readBrushConfig();if(c){await sdk.setBrushConfig({...c,[key]:control.type==='checkbox'?control.checked:Number(control.value)});syncBrush();}});
  }
  const familyHints={1:'平滑圆头 · 速度模拟粗细',2:'斜切扁头 · 半透明叠色',3:'干颗粒 · 纸面留白',4:'柔边蜡笔 · 压力控制出墨与纸纹',5:'透明色洗 · 湿边积色',6:'临时光迹 · 自动消退'};
  const syncBrush=()=>{const c=sdk.readBrushConfig();for(const [key,control] of Object.entries(inkControls)){control.disabled=!c;control.parentElement.hidden=!!c&&!familyControls[c.family]?.includes(key);if(c)control.value=c[key];const output=control.parentElement.querySelector('output');if(output)output.textContent=control.value;}const vector=!!c&&(c.family===1||c.family===2||(c.family===4&&c.version===2));
    for(const [control,key] of [[easingMode,'easing'],[pressureModel,'pressureModel'],[startCap,'startCap'],[endCap,'endCap']]){control.parentElement.hidden=!vector;control.disabled=!vector;if(c){if(control.type==='checkbox')control.checked=c[key];else control.value=String(c[key]);}}
    pressureModel.parentElement.hidden=!vector||c?.pressureSource!==1;
    pressureMode.disabled=!c;pressureMode.parentElement.hidden=c?.family===6;inkColor.disabled=!c;if(c){pressureMode.value=String(c.pressureSource);inkColor.value=hex(c.color);}brushHint.textContent=c?(c.family===1&&c.thinning===0?'平滑圆头 · 固定笔宽':familyHints[c.family]):'兼容笔刷';};
  inkGroup.append(brushHint);
  pressureMode.onchange=()=>run(async()=>{const c=sdk.readBrushConfig();if(c){await sdk.setBrushConfig({...c,pressureSource:Number(pressureMode.value)});syncBrush();}});
  const initialBrush=new URLSearchParams(location.search).get('brush');
  const initialPreset=presets.find(p=>p.profileId===(initialBrush==='crayon'?'crayon-wax-v1':'round-handdrawn'));
  await sdk.selectBrush(initialPreset.profileId,initialPreset.revision);brush.value=String(presets.indexOf(initialPreset));syncBrush();

  const selectionGroup = group(context, 'selection-parameters');
  const selectionMode = select(selectionGroup, '选择方式', 'selection-mode', [['point', '点选'], ['rectangle', '框选'], ['lasso', '套索']]);
  selectionMode.onchange = () => run(() => sdk.setSelectionMode(selectionMode.value));
  const eraserGroup = group(context, 'eraser-parameters');
  const eraserMode = select(eraserGroup, '擦除方式', 'eraser-mode', [['objectEraser', '整个对象'], ['partialEraser', '局部擦除']]);
  eraserMode.onchange = () => run(() => sdk.selectTool(eraserMode.value));

  const appearanceGroup = group(context, 'appearance-parameters');
  const fillEnabled = field(appearanceGroup, '填充', 'checkbox', 'object-fill-enabled');
  const fill = field(appearanceGroup, '填充色', 'color', 'object-fill');
  const strokeEnabled = field(appearanceGroup, '描边', 'checkbox', 'object-stroke-enabled');
  const stroke = field(appearanceGroup, '描边色', 'color', 'object-stroke');
  const strokeWidth = field(appearanceGroup, '线宽', 'number', 'object-stroke-width'); strokeWidth.min = '.1'; strokeWidth.step = '.5';
  fillEnabled.onchange = () => run(() => sdk.setAppearance({fillEnabled: fillEnabled.checked}));
  strokeEnabled.onchange = () => run(() => sdk.setAppearance({strokeEnabled: strokeEnabled.checked}));
  fill.onchange = () => run(() => sdk.setAppearance({fill: rgba(fill.value, sdk.readSelection().appearance.fill[3])}));
  stroke.onchange = () => run(() => sdk.setAppearance({stroke: rgba(stroke.value, sdk.readSelection().appearance.stroke[3])}));
  strokeWidth.onchange = () => run(() => sdk.setAppearance({strokeWidth: Number(strokeWidth.value)}));
  const sketchGroup=group(context,'sketch-parameters');
  const styleScope=document.createElement('span');styleScope.className='hint';sketchGroup.append(styleScope);
  const sketchEnabled=field(sketchGroup,'手绘','checkbox','sketch-enabled');
  const roughness=field(sketchGroup,'程度','range','sketch-roughness');roughness.min='0';roughness.max='3';roughness.step='.01';
  const roughLabel=document.createElement('output');roughLabel.id='sketch-degree';roughLabel.style.minWidth='30px';sketchGroup.append(roughLabel);
  const quickStyle=select(sketchGroup,'快选','sketch-preset',[['','自定义'],['0','规则'],['1','轻微'],['2','明显']]);
  const styleFill=select(sketchGroup,'填充','sketch-fill-kind',[['none','无'],['solid','纯色'],['hachure','斜线'],['crosshatch','交叉线']]);
  const styleColor=field(sketchGroup,'填充色','color','sketch-fill-color');
  const styleStrokeEnabled=field(sketchGroup,'描边','checkbox','sketch-stroke-enabled');
  const styleStroke=field(sketchGroup,'描边色','color','sketch-stroke-color');
  const styleWidth=field(sketchGroup,'线宽','number','sketch-stroke-width');styleWidth.min='.1';styleWidth.max='1024';styleWidth.step='.5';
  const styleOpacity=field(sketchGroup,'透明度','number','sketch-opacity');styleOpacity.min='0';styleOpacity.max='1';styleOpacity.step='.05';
  const styleDash=select(sketchGroup,'线型','sketch-dash',[['solid','实线'],['dash','虚线']]);
  const hatchGap=field(sketchGroup,'间距','number','sketch-gap');hatchGap.min='2';hatchGap.max='1024';hatchGap.step='1';
  const hatchWidth=field(sketchGroup,'排线宽','number','sketch-hatch-width');hatchWidth.min='.1';hatchWidth.max='64';hatchWidth.step='.1';
  const hatchAngle=field(sketchGroup,'角度','number','sketch-angle');hatchAngle.min='-180';hatchAngle.max='180';hatchAngle.step='5';
  const radius=field(sketchGroup,'圆角','range','corner-radius');radius.min='0';radius.max='128';radius.step='.5';
  const radiusValue=field(sketchGroup,'半径','number','corner-radius-value');radiusValue.min='0';radiusValue.max='16384';radiusValue.step='.5';radiusValue.title='对象本地单位；按形状与线段尺寸限制实际圆角';
  const sketchDetails=group(details,'sketch-details');
