<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom SDK Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font: 13px system-ui, sans-serif; color: #243246; background: #f5f7fa; }
  button, select, input { font: inherit; }
  button, select, input[type=number] { min-height: 32px; border: 1px solid #d7dee8; border-radius: 6px; color: inherit; background: white; }
  button { padding: 5px 11px; white-space: nowrap; cursor: pointer; }
  button:hover:not(:disabled) { background: #f0f5fc; border-color: #a8bfdc; }
  button[aria-pressed=true] { color: #174c99; background: #e7f0ff; border-color: #8bb1eb; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid #3978cf; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #tools { flex: none; background: #fff; border-bottom: 1px solid #dbe2ec; }
  .toolbar-row { display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #edf0f5; }
  .toolbar-row:last-child { border: 0; background: #f8fafc; }
  .row-label { flex: 0 0 44px; color: #7b8798; font-size: 12px; }
  .row-content { min-width: 0; flex: 1; display: flex; align-items: center; gap: 16px; overflow-x: auto; padding: 8px 2px; scrollbar-width: thin; }
  .group { display: flex; flex: none; align-items: center; gap: 6px; white-space: nowrap; }
  .group + .group { border-left: 1px solid #e1e6ee; padding-left: 16px; }
  label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=color] { width: 30px; height: 30px; padding: 2px; border: 1px solid #d7dee8; border-radius: 6px; background: white; cursor: pointer; }
  input[type=number] { width: 68px; padding: 4px 6px; }
  input[type=checkbox] { accent-color: #3978cf; }
  select { max-width: 170px; padding: 4px 8px; }
  .hint { color: #8290a3; white-space: nowrap; }
  #context-title { color: #52657d; font-weight: 500; white-space: nowrap; flex: none; }
  #canvas { flex: 1; min-height: 160px; position: relative; overflow: hidden; background: white; }
  #status { flex: none; min-height: 28px; padding: 6px 16px; margin: 0; color: #6a7a90; font-size: 12px; white-space: pre-wrap; }
  #status[data-error=true] { color: #b42318; background: #fff1f0; }
  dialog { width: min(390px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; margin: auto; padding: 22px; border: 1px solid #dbe2ec; border-radius: 12px; color: inherit; box-shadow: 0 12px 60px #172c4c30; }
  dialog::backdrop { background: #15243a35; }
  dialog h2 { margin: 0 0 18px; font-size: 17px; }
  .settings { display: grid; gap: 16px; }
  .settings > label { justify-content: space-between; }
  .settings select { min-width: 125px; }
  .settings .hint { white-space: normal; line-height: 1.6; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .primary { color: white; background: #2866ba; border-color: #2866ba; }
  .primary:hover:not(:disabled) { color: white; background: #1f55a0; }
  #background-preview { display: block; height: 80px; border: 1px solid #d7dee8; border-radius: 6px; }
  @media (max-width: 600px) { .toolbar-row { padding: 0 8px; } .row-label { flex-basis: 34px; } .row-content { gap: 10px; } .group + .group { padding-left: 10px; } }
</style>
<header id="tools" aria-busy="true" inert>
  <nav class="toolbar-row" aria-label="绘制工具"><span class="row-label">工具</span><div id="drawing-tools" class="row-content"></div></nav>
  <nav class="toolbar-row" aria-label="工具与对象参数"><span class="row-label">参数</span><div id="context-tools" class="row-content"><span id="context-title"></span></div></nav>
  <nav class="toolbar-row" aria-label="画板操作"><span class="row-label">画板</span><div id="board-tools" class="row-content"></div></nav>
</header>
<div id="canvas"></div>
<output id="status" role="status">Loading SDK…</output>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="background-panel" aria-labelledby="background-title">
  <h2 id="background-title">画板背景</h2>
  <div class="settings">
    <label>背景样式<select id="background-mode"><option value="plain">纯色</option><option value="dots">点阵</option><option value="grid">方格线</option></select></label>
    <label>底色<input id="background-color" type="color" aria-label="底色"></label>
    <label>点线颜色<input id="background-pattern-color" type="color" aria-label="点线颜色"></label>
    <span id="background-preview" aria-label="背景预览"></span>
  </div>
  <div class="dialog-actions"><button id="background-cancel" type="button">取消更改</button><button id="background-apply" type="button" class="primary">应用背景</button></div>
</dialog>
<dialog id="export-panel" aria-labelledby="export-title">
  <h2 id="export-title">导出画板图片</h2>
  <div class="settings">
    <label>图片格式<select id="export-format"><option value="png">PNG</option><option value="jpg">JPG</option><option value="jpeg">JPEG</option></select></label>
    <label>导出倍率<select id="export-scale"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <label>透明背景<input id="export-transparent" type="checkbox"></label>
    <label>包含点线<input id="export-pattern" type="checkbox" checked></label>
    <span class="hint">导出画板全部内容，包含屏幕外的对象。</span>
  </div>
  <div class="dialog-actions"><button id="export-cancel" type="button">取消</button><button id="export-image" type="button" class="primary">导出图片</button></div>
</dialog>
<script type="module">
import {createRuntime} from './axiom.mjs';
const $ = id => document.getElementById(id);
const status = $('status'), tools = $('tools');
let sdk, syncContext = () => {}, syncBackground = () => {};
const fail = error => { status.dataset.error = 'true'; status.textContent = `${error.code || 'ERROR'}: ${error.message}`; };
const show = () => {
  if (!sdk) return;
  const state = sdk.readState();
  status.dataset.error = 'false';
  status.textContent = `${state.objects} objects · ${state.selected.length} selected · Zoom ${state.camera.scale.toFixed(2)}`;
  syncContext(state); syncBackground();
};
const run = async action => { try { await action(); show(); } catch (error) { fail(error); } };
const button = (parent, label, action, id) => {
  const element = document.createElement('button'); element.type = 'button'; element.textContent = label;
  if (id) element.id = id;
  element.onclick = () => run(action); parent.append(element); return element;
};
const group = (parent, id) => {
  const element = document.createElement('div'); element.className = 'group';
  if (id) element.id = id;
  parent.append(element); return element;
};
const field = (parent, label, type, id) => {
  const wrapper = document.createElement('label'); wrapper.textContent = label;
  const input = document.createElement('input'); input.type = type; input.id = id;
  input.setAttribute('aria-label', label); wrapper.append(input); parent.append(wrapper); return input;
};
const select = (parent, label, id, choices) => {
  const wrapper = document.createElement('label'); wrapper.textContent = label;
  const input = document.createElement('select'); input.id = id; input.setAttribute('aria-label', label);
  for (const [value, text] of choices) input.add(new Option(text, value));
  wrapper.append(input); parent.append(wrapper); return input;
};
const hex = color => '#' + color.slice(0, 3).map(n => Math.round(n * 255).toString(16).padStart(2, '0')).join('');
const rgba = (value, alpha = 1) => [1, 3, 5].map(i => parseInt(value.slice(i, i + 2), 16) / 255).concat(alpha);
const setValue = (input, value) => { if (document.activeElement !== input) input.value = value; };
try {
  sdk = await createRuntime({mount: $('canvas'), permission: 'localSingleUser', onError: fail, onChange: show});
  const drawing = $('drawing-tools'), context = $('context-tools'), board = $('board-tools');
  const drawingGroup = group(drawing);
  const toolButtons = [];
  const addTool = (label, key, action, parent = drawingGroup) => {
    const element = button(parent, label, action); element.dataset.tool = key;
    element.setAttribute('aria-pressed', 'false'); toolButtons.push(element);
  };
  for (const [label, tool, code] of [['Ink', 'ink', 0], ['Text', 'text', 4]])
    addTool(label, `tool:${code}`, () => sdk.selectTool(tool));
  for (const [shape, label, code] of [['rectangle', '矩形', 0], ['ellipse', '椭圆', 1], ['triangle', '三角形', 2], ['line', '直线', 3], ['arrow', '连线', 4], ['sticky', '便签', 5]])
    addTool(label, `shape:${code}`, () => sdk.selectShape(shape));
  addTool('Eraser', 'tool:2', () => sdk.selectTool('partialEraser'));

  const file = $('file'); let replaceImage = false;
  const chooseImage = replace => { replaceImage = replace; file.value = ''; file.click(); };
  button(group(drawing), '导入图片', () => chooseImage(false), 'image-import');
  file.onchange = () => run(async () => {
    const image = file.files?.[0]; if (!image) return;
    const bytes = new Uint8Array(await image.arrayBuffer());
    if (replaceImage) await sdk.replaceImage(bytes, image.type); else await sdk.importImage(bytes, image.type);
  });

  const inkGroup = group(context, 'ink-parameters');
  const presetNames = {'vector-solid-v1': '圆头笔', 'marker-flat-v1': '马克笔', 'chalk-grain-v1': '粉笔', 'membrane-v1': '纹理笔'};
  const presets = [...new Map(sdk.brushPresets().map(preset => [preset.profileId, preset])).values()];
  const brush = select(inkGroup, '笔刷', 'ink-preset', [['', '切换预设…'], ...presets.map((preset, index) => [String(index), presetNames[preset.profileId] || `笔刷 ${index + 1}`])]);
  brush.onchange = () => run(async () => { if (brush.value !== '') { const preset = presets[Number(brush.value)]; await sdk.selectBrush(preset.profileId, preset.revision); } });

  const selectionGroup = group(context, 'selection-parameters');
  const selectionMode = select(selectionGroup, '选择方式', 'selection-mode', [['point', '点选'], ['rectangle', '框选'], ['lasso', '套索']]);
  selectionMode.onchange = () => run(() => sdk.setSelectionMode(selectionMode.value));
  const eraserGroup = group(context, 'eraser-parameters');
  const eraserMode = select(eraserGroup, '擦除方式', 'eraser-mode', [['objectEraser', '整个对象'], ['partialEraser', '局部擦除']]);
  eraserMode.onchange = () => run(() => sdk.selectTool(eraserMode.value));

  const appearanceGroup = group(context, 'appearance-parameters');
  const fillEnabled = field(appearanceGroup, '填充', 'checkbox', 'object-fill-enabled');
  const fill = field(appearanceGroup, '填充色', 'color', 'object-fill');
  const strokeEnabled = field(appearanceGroup, '描边', 'checkbox', 'object-stroke-enabled');
  const stroke = field(appearanceGroup, '描边色', 'color', 'object-stroke');
  const strokeWidth = field(appearanceGroup, '线宽', 'number', 'object-stroke-width'); strokeWidth.min = '.1'; strokeWidth.step = '.5';
  fillEnabled.onchange = () => run(() => sdk.setAppearance({fillEnabled: fillEnabled.checked}));
  strokeEnabled.onchange = () => run(() => sdk.setAppearance({strokeEnabled: strokeEnabled.checked}));
  fill.onchange = () => run(() => sdk.setAppearance({fill: rgba(fill.value, sdk.readSelection().appearance.fill[3])}));
  stroke.onchange = () => run(() => sdk.setAppearance({stroke: rgba(stroke.value, sdk.readSelection().appearance.stroke[3])}));
  strokeWidth.onchange = () => run(() => sdk.setAppearance({strokeWidth: Number(strokeWidth.value)}));
  const sizeGroup = group(context, 'size-parameters');
  const width = field(sizeGroup, '宽', 'number', 'object-width'), height = field(sizeGroup, '高', 'number', 'object-height');
  for (const input of [width, height]) { input.min = '.1'; input.step = '1'; input.onchange = () => run(() => sdk.resizeSelection(Number(width.value), Number(height.value))); }

  const textGroup = group(context, 'text-parameters');
  const fontSize = select(textGroup, '字号', 'text-size', [['', '设置字号…'], ['32', 'Title · 32'], ['24', 'Heading · 24'], ['20', 'Subheading · 20'], ['16', 'Body · 16']]);
  fontSize.onchange = () => run(() => sdk.text.format({fontSize: Number(fontSize.value)}));
  const textButtons = [];
  for (const [name, label] of [['bold', 'B'], ['italic', 'I'], ['underline', 'U'], ['strikethrough', '删除线'], ['bulleted', '项目符号']]) {
    const element = button(textGroup, label, () => sdk.text.format({[name]: !sdk.text.read().format[name]}));
    element.title = name; element.setAttribute('aria-label', name); textButtons.push([name, element]);
  }
  textGroup.onpointerdown = () => { void sdk.text.completeComposition().catch(fail); };

  const imageGroup = group(context, 'image-parameters');
  button(imageGroup, '替换图片', () => chooseImage(true), 'image-replace');
  const crop = button(imageGroup, '裁剪', () => sdk.beginCrop(sdk.readSelectedImage().objectId), 'image-crop');
  const cropGroup = group(context, 'crop-parameters');
  button(cropGroup, '完成裁剪', () => sdk.commitCrop(sdk.readCrop().token), 'crop-done');
  button(cropGroup, '取消裁剪', () => sdk.cancelCrop(sdk.readCrop().token), 'crop-cancel');
  const objectGroup = group(context, 'object-actions');
  const groupButton = button(objectGroup, '组合', () => sdk.group());
  const ungroupButton = button(objectGroup, '取消组合', () => sdk.ungroup());
  const enterGroup = button(objectGroup, '进入组合', () => sdk.enterGroup());
  const leaveGroup = button(objectGroup, '退出组合', () => sdk.leaveGroup());
  const deleteButton = button(objectGroup, '删除', () => sdk.deleteSelection());

  const historyGroup = group(board);
  const undo = button(historyGroup, 'Undo', () => sdk.undo(), 'undo');
  const redo = button(historyGroup, 'Redo', () => sdk.redo(), 'redo');
  button(historyGroup, 'Fit', () => sdk.fitContent(), 'fit');
  const navigationGroup = group(board);
  addTool('Select', 'tool:1', () => sdk.selectTool('select'), navigationGroup);
  addTool('Hand', 'tool:3', () => sdk.selectTool('hand'), navigationGroup);
  const boardGroup = group(board);
  button(boardGroup, '创建分区', () => sdk.createSection(), 'section-create');
  button(boardGroup, '背景', () => $('background-panel').showModal(), 'background-open');
  button(boardGroup, '导出图片', () => $('export-panel').showModal(), 'export-open');

  const contextHint = document.createElement('span'); contextHint.className = 'hint'; context.append(contextHint);
  // The v1 actions array follows the SDK SelectionAction order. Availability
  // comes from the Runtime; these names only identify the projected actions.
  const actionIndex = {delete: 1, size: 6, appearance: 7, group: 9, ungroup: 10};

  // Visibility and enabled states are projections of the public SDK readback.
  // The Demo does not maintain another selection or editing owner.
  syncContext = state => {
    const selected = sdk.readSelection(), text = sdk.text.read(), image = sdk.readSelectedImage(), cropping = sdk.readCrop();
    const capability = action => selected.actions[actionIndex[action]]?.available === true;
    const activeKey = state.creationMode ? `shape:${state.shape}` : `tool:${state.tool}`;
    for (const element of toolButtons) element.setAttribute('aria-pressed', String(element.dataset.tool === activeKey));
    const toolName = toolButtons.find(element => element.dataset.tool === activeKey)?.textContent || '工具';
    $('context-title').textContent = selected.count ? `已选 ${selected.count} 个对象` : toolName;
    inkGroup.hidden = state.creationMode || state.tool !== 0 || selected.count > 0;
    selectionGroup.hidden = state.creationMode || state.tool !== 1 || selected.count > 0;
    eraserGroup.hidden = state.creationMode || state.tool !== 2;
    selectionMode.value = ['point', 'rectangle', 'lasso'][state.selectionMode];
    eraserMode.value = state.eraserMode === 1 ? 'objectEraser' : 'partialEraser';
    appearanceGroup.hidden = selected.count !== 1 || !capability('appearance') || !selected.appearance;
    if (!appearanceGroup.hidden) {
      const appearance = selected.appearance;
      fillEnabled.checked = appearance.fillEnabled; strokeEnabled.checked = appearance.strokeEnabled;
      setValue(fill, hex(appearance.fill)); setValue(stroke, hex(appearance.stroke)); setValue(strokeWidth, appearance.strokeWidth);
      fill.disabled = !appearance.fillEnabled; stroke.disabled = strokeWidth.disabled = !appearance.strokeEnabled;
    }
    sizeGroup.hidden = selected.count !== 1 || !capability('size');
    if (!sizeGroup.hidden) { setValue(width, Number(selected.width.toFixed(2))); setValue(height, Number(selected.height.toFixed(2))); }
    textGroup.hidden = !(state.tool === 4 || text.phase !== 0 || selected.kind === 4);
    if (!textGroup.hidden) {
      const size = text.format.fontSize;
      if (size && !Array.from(fontSize.options).some(option => option.value === String(size))) fontSize.add(new Option(String(size), String(size)));
      setValue(fontSize, size ? String(size) : '');
      for (const [name, element] of textButtons) element.setAttribute('aria-pressed', String(Boolean(text.format[name])));
    }
    imageGroup.hidden = !image.available; crop.disabled = !image.editable || cropping.active;
    cropGroup.hidden = !cropping.active;
    objectGroup.hidden = selected.count === 0 && !selected.groupScope;
    groupButton.hidden = selected.count < 2; groupButton.disabled = !capability('group');
    ungroupButton.hidden = selected.kind !== 9; ungroupButton.disabled = !capability('ungroup'); deleteButton.disabled = !capability('delete');
    enterGroup.hidden = selected.kind !== 9; leaveGroup.hidden = !selected.groupScope;
    undo.disabled = !state.canUndo; redo.disabled = !state.canRedo;
    contextHint.hidden = Array.from(context.children).some(element => element.classList.contains('group') && !element.hidden);
    contextHint.textContent = state.creationMode ? '拖动绘制，选中对象后可调整样式与尺寸' : state.tool === 3 ? '拖动画板移动视角' : '选择工具或对象以调整参数';
  };

  const backgroundMode = $('background-mode'), backgroundColor = $('background-color'), patternColor = $('background-pattern-color');
  let backgroundDirty = false, backgroundDraft = sdk.readBackground();
  const previewDraft = () => {
    const ink = `rgba(${backgroundDraft.patternColor.slice(0, 3).map(n => Math.round(n * 255)).join(',')},${backgroundDraft.patternColor[3]})`;
    const preview = $('background-preview'); preview.style.backgroundColor = backgroundColor.value; preview.style.backgroundSize = '12px 12px';
    preview.style.backgroundImage = backgroundMode.value === 'dots' ? `radial-gradient(circle,${ink} 1px,transparent 1.5px)` : backgroundMode.value === 'grid' ? `linear-gradient(${ink} 1px,transparent 1px),linear-gradient(90deg,${ink} 1px,transparent 1px)` : 'none';
  };
  for (const input of [backgroundMode, backgroundColor, patternColor]) input.oninput = () => {
    backgroundDirty = true;
    if (input === backgroundMode) backgroundDraft.mode = input.value;
    else if (input === backgroundColor) backgroundDraft.color = rgba(input.value);
    else backgroundDraft.patternColor = rgba(input.value, backgroundDraft.patternColor[3]);
    previewDraft();
  };
  syncBackground = () => {
    if (backgroundDirty) return;
    backgroundDraft = sdk.readBackground(); backgroundMode.value = backgroundDraft.mode;
    backgroundColor.value = hex(backgroundDraft.color); patternColor.value = hex(backgroundDraft.patternColor); previewDraft();
  };
  $('background-apply').onclick = () => run(async () => { await sdk.setBackground(backgroundDraft); backgroundDirty = false; $('background-panel').close(); });
  $('background-cancel').onclick = () => { backgroundDirty = false; syncBackground(); $('background-panel').close(); };

  const exportFormat = $('export-format'), transparent = $('export-transparent');
  exportFormat.onchange = () => { transparent.disabled = exportFormat.value !== 'png'; if (transparent.disabled) transparent.checked = false; };
  $('export-cancel').onclick = () => $('export-panel').close();
  $('export-image').onclick = () => run(async () => {
    const exportButton = $('export-image'); exportButton.disabled = true;
    try {
      const format = exportFormat.value;
      const image = await sdk.exportImage({format, scale: Number($('export-scale').value), background: transparent.checked ? 'transparent' : 'document', includePattern: $('export-pattern').checked});
      const url = URL.createObjectURL(new Blob([image.bytes], {type: image.mimeType})), link = document.createElement('a');
      link.href = url; link.download = `axiom-board.${format}`; document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000); $('export-panel').close();
    } catch (error) {
      if (error.code === 'EXPORT_TOO_LARGE') error.message = '图片尺寸过大，请降低导出倍率或缩小画板内容范围';
      throw error;
    } finally { exportButton.disabled = false; }
  });
  tools.inert = false; tools.setAttribute('aria-busy', 'false'); show();
  window.addEventListener('pagehide', () => { void sdk.close().catch(fail); }, {once: true});
} catch (error) { fail(error); }
</script>
</html>
