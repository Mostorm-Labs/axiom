<!doctype html><meta charset="utf-8"><title>Axiom JavaScript SDK</title>
<style>body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#eef2f6}button[aria-pressed=true]{background:#a9d5ff}#canvas{flex:1;min-height:160px}#status{padding:5px;margin:0}</style>
<nav id="tools"></nav><div id="canvas"></div><pre id="status">Loading SDK…</pre>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<script type="module">
import {createRuntime} from './axiom.mjs';
const tools=document.getElementById('tools'),status=document.getElementById('status');
const fail=e=>{status.textContent=`${e.code||'ERROR'}: ${e.message}`;};
let sdk, active, syncBackground=()=>{};
const show=()=>{const s=sdk.readState();status.textContent=`${s.objects} objects · ${s.selected.length} selected · Zoom ${s.camera.scale.toFixed(2)}`;syncBackground();};
const add=(label,action,isTool=false)=>{const button=document.createElement('button');button.textContent=label;button.type='button';if(isTool)button.dataset.tool='true';tools.append(button);
  button.onclick=async()=>{try{await action();if(isTool){active?.setAttribute('aria-pressed','false');active=button;active.setAttribute('aria-pressed','true');}show();}catch(e){fail(e);}};return button;};
try{
 sdk=await createRuntime({mount:document.getElementById('canvas'),permission:'localSingleUser',onError:fail,onChange:()=>show()});
 const backgroundMode=document.createElement('select');backgroundMode.id='background-mode';backgroundMode.setAttribute('aria-label','背景样式');
 for(const [value,label] of [['plain','纯色'],['dots','点阵'],['grid','方格线']]){const option=document.createElement('option');option.value=value;option.textContent=label;backgroundMode.append(option);}
 const colorInput=(id,label)=>{const wrapper=document.createElement('label');wrapper.textContent=label;const input=document.createElement('input');input.type='color';input.id=id;input.setAttribute('aria-label',label);wrapper.append(input);tools.append(wrapper);return input;};
 tools.append(backgroundMode);
 const backgroundColor=colorInput('background-color','底色'),patternColor=colorInput('background-pattern-color','点线颜色');
 const preview=document.createElement('span');preview.setAttribute('aria-label','背景预览');preview.style.cssText='display:inline-block;width:48px;height:28px;border:1px solid #889';tools.append(preview);
 let backgroundDirty=false,backgroundDraft=sdk.readBackground();
 const hex=color=>'#'+color.slice(0,3).map(n=>Math.round(n*255).toString(16).padStart(2,'0')).join('');
 const rgba=value=>[1,3,5].map(i=>parseInt(value.slice(i,i+2),16)/255).concat(1);
 const previewDraft=()=>{const ink=`rgba(${backgroundDraft.patternColor.slice(0,3).map(n=>Math.round(n*255)).join(',')},${backgroundDraft.patternColor[3]})`;preview.style.backgroundColor=backgroundColor.value;preview.style.backgroundSize='12px 12px';preview.style.backgroundImage=backgroundMode.value==='dots'?`radial-gradient(circle,${ink} 1px,transparent 1.5px)`:backgroundMode.value==='grid'?`linear-gradient(${ink} 1px,transparent 1px),linear-gradient(90deg,${ink} 1px,transparent 1px)`:'none';};
 for(const input of [backgroundMode,backgroundColor,patternColor])input.oninput=()=>{backgroundDirty=true;if(input===backgroundMode)backgroundDraft.mode=input.value;else if(input===backgroundColor)backgroundDraft.color=rgba(input.value);else backgroundDraft.patternColor=rgba(input.value).slice(0,3).concat(backgroundDraft.patternColor[3]);previewDraft();};
 syncBackground=()=>{if(backgroundDirty)return;const value=sdk.readBackground();backgroundDraft=value;backgroundMode.value=value.mode;backgroundColor.value=hex(value.color);patternColor.value=hex(value.patternColor);previewDraft();};
 const applyBackground=add('应用背景',async()=>{await sdk.setBackground(backgroundDraft);backgroundDirty=false;syncBackground();});applyBackground.id='background-apply';
 const cancelBackground=add('取消更改',()=>{backgroundDirty=false;syncBackground();});cancelBackground.id='background-cancel';
 syncBackground();
 for(const [label,tool] of [['Ink','ink'],['Select','select'],['Object eraser','objectEraser'],['Partial eraser','partialEraser'],['Hand','hand'],['Text','text']])add(label,()=>sdk.selectTool(tool),true);
 for(const shape of ['rectangle','ellipse','triangle','sticky','arrow'])add(shape==='arrow'?'Connector':shape,()=>sdk.selectShape(shape),true);
 for(const mode of ['point','rectangle','lasso'])add(`${mode} selection`,()=>sdk.setSelectionMode(mode),true);
 for(const [label,action] of [['Undo',()=>sdk.undo()],['Redo',()=>sdk.redo()],['Fit',()=>sdk.fitContent()],['Group',()=>sdk.group()],['Ungroup',()=>sdk.ungroup()],['Enter group',()=>sdk.enterGroup()],['Leave group',()=>sdk.leaveGroup()],['Section',()=>sdk.createSection()],['Delete',()=>sdk.deleteSelection()]])add(label,action);
 for(const [label,size] of [['Title',32],['Heading',24],['Subheading',20],['Body',16]]){const b=add(label,()=>sdk.text.format({fontSize:size}));b.onpointerdown=()=>sdk.text.completeComposition().catch(fail);}
 for(const field of ['bold','italic','underline','strikethrough','bulleted']){const b=add(field,()=>sdk.text.format({[field]:!sdk.text.read().format[field]}));b.onpointerdown=()=>sdk.text.completeComposition().catch(fail);}
 const file=document.getElementById('file');let replace=false;
 add('Import image',()=>{replace=false;file.value='';file.click();});add('Replace image',()=>{replace=true;file.value='';file.click();});
 file.onchange=async()=>{try{const f=file.files?.[0];if(!f)return;const bytes=new Uint8Array(await f.arrayBuffer());if(replace)await sdk.replaceImage(bytes,f.type);else await sdk.importImage(bytes,f.type);show();}catch(e){fail(e);}};
 add('Crop',()=>sdk.beginCrop(sdk.readSelectedImage().objectId));add('Crop done',()=>sdk.commitCrop(sdk.readCrop().token));add('Crop cancel',()=>sdk.cancelCrop(sdk.readCrop().token));
 active=tools.querySelector('[data-tool]');active.setAttribute('aria-pressed','true');show();
 window.addEventListener('pagehide',()=>{void sdk.close().catch(fail);},{once:true});
}catch(e){fail(e);}
</script>
