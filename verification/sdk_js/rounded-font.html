<!doctype html><meta charset="utf-8"><title>Rounded corners and handwriting public consumer</title>
<style>body{margin:0}.mount{width:800px;height:650px}#b,#c{position:absolute;left:900px;top:0}</style><div id="a" class="mount"></div><div id="b" class="mount"></div><div id="c" class="mount"></div>
<script type="module">
import {createRuntime} from './axiom.mjs';
const documentId='86868686868686868686868686868686',checks={},errors=[],packets=[],owners=[];let sdk,ids={},token,before,generation,count,routeBefore,fontIds;
const wait=async()=>{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await new Promise(r=>setTimeout(r,100));};const check=(v,n)=>{if(!v)throw Error(n);checks[n]=true;};const stable=v=>JSON.stringify(v,(_,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(k=>[k,x[k]])):x);const same=(a,b)=>stable(a)===stable(b);const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join('');const png=(owner=sdk)=>owner.exportImage({bounds:[0,0,800,650],padding:0});
async function create(id,restore){const r=await createRuntime({mount:document.getElementById(id),documentId,permission:'localSingleUser',...(restore?{restore,builtinFonts:false}:{}),onError:e=>errors.push(String(e)),onOperation:bytes=>{if(id==='a')packets.push(bytes);}});owners.push(r);return r;}async function rejects(fn,name){let rejected=false;try{await fn();}catch{rejected=true;}check(rejected,name);}
window.probe={ready:(async()=>{sdk=await create('a');})(),info:()=>sdk.readBuildInfo(),diagnostics:()=>({checks,errors,state:sdk.readState(),appearance:sdk.appearance.read(),text:sdk.text.read()}),
 async select(){await sdk.selectTool('select');},
 async start(){check(sdk.readBuildInfo().features.roundedCorners===1&&sdk.readBuildInfo().features.fontFallback===2,'publicCapabilities');const f=sdk.text.fonts().entries;check(f[0].family.includes('Noto'),'originalDefaultFontOrder');fontIds={latin:f.find(f=>f.family==='Excalifont')?.id,cjk:f.find(f=>f.family==='Xiaolai')?.id};check(fontIds.latin&&fontIds.cjk,'bothOfficialFontsAdmitted');check(sdk.resources.list().entries.find(e=>e.resourceId===fontIds.latin).layoutVersion==='2'||sdk.resources.list().entries.find(e=>e.resourceId===fontIds.latin).layoutVersion===2,'fontFallbackIsVersionedResource');await sdk.appearance.setDefaults({cornerRadius:24,enabled:false,fillKind:'solid',fill:[.2,.5,.8,1],strokeEnabled:true,strokeWidth:2});await sdk.selectShape('rectangle');return {checks};},
 async rectangle(){check(sdk.readState().objects===1,'roundedRectangleCreated');ids.rect=sdk.readState().primary;check(sdk.appearance.read().values.cornerRadius===24,'creationMaterializesRadius');await sdk.selectTool('select');before=sdk.appearance.read();generation=sdk.readState().generation;count=packets.length;token=(await sdk.appearance.begin()).token;for(const cornerRadius of [8,32,40])await sdk.appearance.updatePreview(token,{cornerRadius});await wait();check(sdk.appearance.read().values.cornerRadius===24&&sdk.readState().generation===generation&&packets.length===count,'radiusPreviewTransient');return {checks};},
 async commitPreview(){await sdk.appearance.commit(token);await wait();check(sdk.appearance.read().values.cornerRadius===40&&packets.length===count+1&&BigInt(sdk.readState().generation)===BigInt(generation)+1n,'radiusCommitOneOperation');return {checks};},
 async commit(){await sdk.undo();check(sdk.appearance.read().values.cornerRadius===24,'radiusSingleUndo');await sdk.redo();check(sdk.appearance.read().values.cornerRadius===40,'radiusRedo');const no=(await sdk.appearance.begin()).token;count=packets.length;check(!(await sdk.appearance.commit(no)).changed&&packets.length===count,'radiusNoop');const cancel=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(cancel,{cornerRadius:0});await sdk.appearance.cancel(cancel);check(sdk.appearance.read().values.cornerRadius===40&&packets.length===count,'radiusCancelNoOperation');await sdk.appearance.patch({enabled:true,roughness:1.5});const seed=sdk.appearance.read().values.seed;await sdk.appearance.patch({cornerRadius:24});check(sdk.appearance.read().values.seed===seed,'radiusDoesNotReseedSketch');await sdk.appearance.patch({enabled:false});return {checks};},
 async cornerMiss(){check(sdk.readState().selected.length===0,'roundedShapeCornerIsNotFilledHit');return {checks};},
 async triangleMode(){await sdk.selectShape('triangle');},
 async triangle(){ids.triangle=sdk.readState().primary;check(sdk.appearance.read().values.cornerRadius===24,'triangleRadiusSupported');await sdk.selectShape('ellipse');return {checks};},
 async ellipse(){ids.ellipse=sdk.readState().primary;check(sdk.appearance.read().radiusExcluded.includes(ids.ellipse)&&sdk.appearance.read().values.cornerRadius===0,'ellipseExplicitlyExcluded');await rejects(()=>sdk.appearance.patch({cornerRadius:8}),'ellipseRadiusRejects');await sdk.selectTool('select');await sdk.appearance.setDefaults({cornerRadius:24});ids.connector=(await sdk.createConnector({start:{point:[340,70]},end:{point:[650,240]},routing:2})).objectId;for(let n=0;n<100&&sdk.readConnector(ids.connector).routeStatus!==1;n++)await wait();routeBefore=sdk.readConnector(ids.connector);check(routeBefore.routeStatus===1&&routeBefore.route.length>2,'orthogonalRouteReady');const a=routeBefore.route[0],b=routeBefore.route[1];return {checks,mid:[(a[0]+b[0])/2,(a[1]+b[1])/2]};},
 async connector(){check(sdk.readState().primary===ids.connector,'connectorSelected');await sdk.appearance.patch({cornerRadius:40,enabled:true,roughness:2});check(same(sdk.readConnector(ids.connector).route,routeBefore.route),'cornerDoesNotRewriteRoute');check(sdk.appearance.read().values.cornerRadius===40,'connectorRadiusReadback');await sdk.appearance.patch({enabled:false});const t=await sdk.table.create({rows:2,columns:2,x:470,y:360});ids.table=t.objectId;check(sdk.appearance.read().radiusExcluded.includes(ids.table),'tableRadiusExcluded');return {checks,elbow:routeBefore.route[1]};},
 async bendMiss(){check(sdk.readState().primary!==ids.connector,'invisibleSharpBendIsNotHit');return {checks};},
 async multiMode(){await sdk.setSelectionMode('rectangle');},
 async multi(){const observation=sdk.appearance.read();check(observation.radiusEligible.length===3&&observation.radiusExcluded.includes(ids.ellipse)&&observation.radiusExcluded.includes(ids.table),'mixedRadiusApplicability');count=packets.length;const seeds=new Map(observation.objects.map(o=>[o.objectId,o.values.seed]));await sdk.appearance.patch({cornerRadius:16});check(packets.length===count+1,'mixedRadiusAtomic');const after=sdk.appearance.read();check(!after.mixed.includes('cornerRadius')&&after.values.cornerRadius===16,'mixedRadiusExcludesUnsupportedKinds');check(after.objects.every(o=>o.values.seed===seeds.get(o.objectId)),'mixedRadiusRetainsSeeds');await sdk.undo();check(same(sdk.appearance.read().objects,observation.objects),'mixedRadiusUndo');await sdk.redo();for(const v of [-1,16385,Infinity])await rejects(()=>sdk.appearance.patch({cornerRadius:v}),'invalidRadius'+String(v));await sdk.setSelectionMode('point');return {checks};},
 async fonts(){await sdk.text.create(30,490,700);await sdk.text.format({font:fontIds.latin,fontSize:26});await sdk.text.replace('Canvas 2323 我爱我家 繁體中文');await wait();check(sdk.text.read().geometry.diagnostics.length===0,'mixedFontSharedGeometry');check(sdk.text.read().format.font===fontIds.latin,'fontSelectionReadback');check(sdk.text.read().geometry.caret.every(Number.isFinite),'mixedFontCaretFinite');await sdk.text.finish();await wait();const table=sdk.table.read(ids.table),rowId=table.rows[0].id,columnId=table.columns[0].id;await sdk.table.setCellStyle({objectId:ids.table,rowId,columnId,format:{font:fontIds.latin,fontSize:18}});await sdk.table.edit({objectId:ids.table,rowId,columnId});await sdk.text.replace('A1 中文');await sdk.text.finish();check(sdk.table.read(ids.table).cells[0].format.font===fontIds.latin,'tableFontReadback');return {checks};},
 async restoreRemote(){const expected=await hash((await png()).bytes),metadata={generation:sdk.readState().generation,documentRevision:'29',recoveryFrontier:[8,1,16,1,24,29]},saved=await sdk.captureSnapshot(metadata);const restored=await create('c',{bytes:saved.bytes,metadata:{...metadata,checkpointDigest:saved.checkpointDigest,resourceBinding:'88'}});for(const entry of sdk.resources.list().entries)if(entry.token){const t=restored.resources.token(entry.resourceId);if(t)await restored.resources.publish(t,sdk.resources.readBytes(entry.token));}check(await hash((await png(restored)).bytes)===expected,'roundedAndFontSnapshotPixels');await restored.close();const remote=await create('b');for(const bytes of packets)await remote.applyRemoteOperation(bytes);check(await hash((await png(remote)).bytes)===expected,'roundedAndFontRemotePixels');return {checks};},
 async fixture(){const mount=document.createElement('div');mount.style.cssText='width:1000px;height:680px';document.body.append(mount);const owner=await createRuntime({mount,documentId:'87'.repeat(16),permission:'localSingleUser',onError:e=>errors.push(String(e))});await owner.applyRemoteOperation(new Uint8Array(await(await fetch('./fixture.bin')).arrayBuffer()));const image=await owner.exportImage({bounds:[0,0,1000,680],padding:0});const rgba=async blob=>{const b=await createImageBitmap(blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;const ctx=c.getContext('2d');ctx.drawImage(b,0,0);b.close();return ctx.getImageData(0,0,c.width,c.height).data;};const a=await rgba(new Blob([image.bytes],{type:image.mimeType})),b=await rgba(await(await fetch('./native-render.png')).blob());check(a.length===b.length,'nativeWebImageSize');let max=0,sum=0;for(let i=0;i<a.length;++i){const delta=Math.abs(a[i]-b[i]);max=Math.max(max,delta);sum+=delta;}check(max<=2&&sum/a.length<=.02,'nativeWebRoundedFontPixelTolerance');await owner.close();return {checks,pixels:{channels:a.length,max,mean:sum/a.length},bytes:Array.from(image.bytes)};},
 async pixels(){const image=await png();return {checks,bytes:Array.from(image.bytes)};},async close(){for(const owner of owners){try{await owner.close();}catch{}}return {checks,errors};}
};
</script>
