<!doctype html><meta charset="utf-8"><title>Sketch extended public consumer</title>
<style>body{margin:0}.mount{width:800px;height:650px}#b,#c{position:absolute;left:900px;top:0}</style>
<div id="a" class="mount"></div><div id="b" class="mount"></div><div id="c" class="mount"></div>
<script type="module">
import {createRuntime} from './axiom.mjs';
const documentId='84848484848484848484848484848484',checks={},errors=[],packets=[],owners=[];
let sdk,ids={},selection,previewToken,previewGeneration,previewPackets,previewImage,remoteEcho=0;
const check=(value,name)=>{if(!value)throw Error(name);checks[name]=true;};
const wait=async()=>{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await new Promise(r=>setTimeout(r,80));};
const stable=v=>JSON.stringify(v,(_,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(k=>[k,x[k]])):x);
const same=(a,b)=>stable(a)===stable(b);
const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join('');
const png=(owner=sdk,bounds=[0,0,800,650])=>owner.exportImage({bounds,padding:0});
async function create(id,restore){const r=await createRuntime({mount:document.getElementById(id),documentId,permission:'localSingleUser',...(restore?{restore,builtinFonts:false}:{}),onError:e=>errors.push(String(e)),onOperation:bytes=>{if(id==='a')packets.push(bytes);else if(id==='b')++remoteEcho;}});owners.push(r);return r;}
async function rejects(fn,name){let rejected=false;try{await fn();}catch{rejected=true;}check(rejected,name);}
const ring=[{op:'move',point:[0,0]},{op:'line',point:[160,0]},{op:'line',point:[160,160]},{op:'line',point:[0,160]},{op:'close'},{op:'move',point:[40,40]},{op:'line',point:[120,40]},{op:'line',point:[120,120]},{op:'line',point:[40,120]},{op:'close'}];
const reversedRing=[...ring.slice(0,5),{op:'move',point:[40,40]},{op:'line',point:[40,120]},{op:'line',point:[120,120]},{op:'line',point:[120,40]},{op:'close'}];
const curve=[{op:'move',point:[0,0]},{op:'quad',control:[50,-45],point:[100,0]},{op:'cubic',control1:[130,35],control2:[165,-35],point:[200,0]}];
async function editSelected(label){const before=sdk.appearance.read(),generation=sdk.readState().generation,count=packets.length;const token=(await sdk.appearance.begin()).token;for(const roughness of [.2,1.2,2.75])await sdk.appearance.updatePreview(token,{roughness});await wait();check(sdk.readState().generation===generation&&packets.length===count,label+'PreviewTransient');await sdk.appearance.commit(token);check(BigInt(sdk.readState().generation)===BigInt(generation)+1n&&packets.length===count+1,label+'SingleCommit');check(sdk.appearance.read().values.seed===before.values.seed,label+'SeedPreserved');await sdk.undo();check(same(sdk.appearance.read().objects,before.objects),label+'SingleUndo');await sdk.redo();check(sdk.appearance.read().values.roughness===2.75,label+'Redo');const g=sdk.readState().generation,c=packets.length;const cancel=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(cancel,{roughness:.5});await sdk.appearance.cancel(cancel);check(sdk.readState().generation===g&&packets.length===c,label+'CancelNoOperation');const noop=(await sdk.appearance.begin()).token;check(!(await sdk.appearance.commit(noop)).changed&&packets.length===c,label+'Noop');}
window.probe={ready:(async()=>{sdk=await create('a');await sdk.selectTool('select');})(),info:()=>sdk.readBuildInfo(),diagnostics:()=>({checks,errors,state:sdk.readState(),appearance:sdk.appearance.read()}),
 async start(){await sdk.appearance.setDefaults({enabled:true,roughness:1.5,fillKind:'hachure',fill:[.2,.5,.8,1],strokeEnabled:true,stroke:[.1,.2,.3,1],strokeWidth:2});const created=await sdk.createVectorPath?.({commands:ring,fillRule:'evenodd',x:30,y:40});check(Boolean(created?.objectId),'publicVectorPathActuallyCreates');ids.hole=created.objectId;const path=sdk.readVectorPath(ids.hole);check(path.available&&same(path.commands,ring)&&path.fillRule==='evenodd','canonicalPathReadback');check(sdk.appearance.read().eligible.includes(ids.hole),'pathSelectedByOwner');check(sdk.readBuildInfo().features.sketchExtended===1,'extendedCapability');await editSelected('Path');return {checks};},
 async holeHit(){check(sdk.readState().selected.length===0,'holeDoesNotSelectFilledBody');return {checks};},
 async bodyHit(){check(sdk.readState().primary===ids.hole,'filledPathBodySelectsBetweenHatches');return {checks};},
 async rest(){
  await sdk.createSection({boundary:[440,300,320,260],title:'手绘分区'});ids.section=sdk.readSection().objectId;check(sdk.appearance.read().eligible.includes(ids.section),'sectionAppearanceEligible');const content=sdk.readSection(ids.section);await editSelected('Section');check(same(sdk.readSection(ids.section).boundary,content.boundary)&&same(sdk.readSection(ids.section).children,content.children)&&sdk.readSection(ids.section).title===content.title,'sectionAppearancePreservesMembershipTitle');
  ids.nonzero=(await sdk.createVectorPath({commands:ring,fillRule:'nonzero',x:250,y:40})).objectId;
  ids.reversed=(await sdk.createVectorPath({commands:reversedRing,fillRule:'nonzero',x:250,y:300})).objectId;
  await sdk.appearance.setDefaults({fillKind:'none'});ids.curve=(await sdk.createVectorPath({commands:curve,x:30,y:290})).objectId;check(same(sdk.readVectorPath(ids.curve).commands,curve),'openCurveCanonicalUnchanged');
  ids.table=(await sdk.table.create({rows:3,columns:2,x:470,y:40})).objectId;let table=sdk.table.read(ids.table);const grid=structuredClone(table.grid);check(sdk.appearance.read().eligible.includes(ids.table),'tableAppearanceEligible');check(sdk.appearance.read().fillExcluded.includes(ids.table)&&sdk.appearance.read().strokeExcluded.includes(ids.table),'tablePaintOwnerExplicit');await editSelected('Table');check(same(sdk.table.read(ids.table).grid,grid),'tableDoesNotDuplicateGridPaint');const g=sdk.readState().generation;await rejects(()=>sdk.appearance.patch({strokeWidth:8}),'tableGenericStrokeRejects');await rejects(()=>sdk.appearance.patch({fillKind:'hachure'}),'tableGenericFillRejects');check(sdk.readState().generation===g,'inapplicableParametersAtomic');
  await sdk.table.setGridStyle({objectId:ids.table,color:[.15,.25,.35,1],width:2});const seed=sdk.appearance.read().values.seed;table=sdk.table.read(ids.table);await sdk.table.edit({objectId:ids.table,rowId:table.rows[0].id,columnId:table.columns[0].id});await sdk.text.replace('共享网格');await sdk.text.finish();check(sdk.table.read(ids.table).cells[0].text==='共享网格','tableTextEditingPreserved');await sdk.table.insertRow({objectId:ids.table,index:3});await sdk.table.removeRow({objectId:ids.table,rowId:sdk.table.read(ids.table).rows[3].id});check(sdk.appearance.read().values.seed===seed&&sdk.table.read(ids.table).rows.length===3,'tableTopologyKeepsSeed');
  await sdk.selectSection(ids.section);await wait();selection=sdk.appearance.read();previewGeneration=sdk.readState().generation;previewPackets=packets.length;previewImage=await hash((await png()).bytes);previewToken=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(previewToken,{roughness:3,fillKind:'crosshatch',fill:[.8,.55,.15,.3],gap:12,strokeWidth:5});await wait();check(await hash((await png()).bytes)===previewImage,'sectionPreviewExportCanonical');return {checks};
 },
 async commitPreview(){await sdk.appearance.commit(previewToken);await wait();check(BigInt(sdk.readState().generation)===BigInt(previewGeneration)+1n&&packets.length===previewPackets+1,'sectionPreviewSingleAtomicCommit');return {checks};},
 async pixels(){const image=await png();const bitmap=await createImageBitmap(new Blob([image.bytes],{type:image.mimeType}));const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);bitmap.close();const count=(x,y,w,h)=>{const p=ctx.getImageData(x,y,w,h).data;let n=0;for(let i=0;i<p.length;i+=4)if(p[i]<240||p[i+1]<240||p[i+2]<240)++n;return n;};check(count(85,95,50,50)===0,'evenOddHoleEmpty');check(count(305,95,50,50)>40,'nonzeroSameWindingFilled');check(count(305,355,50,50)===0,'nonzeroReverseWindingHoleEmpty');check(count(102,288,6,4)===0,'openCurveHasNoImplicitClosingStroke');const area=count(40,50,25,25);check(area>10&&area<550,'patternHasActualGaps');return {checks,bytes:Array.from(image.bytes)};},
 async multiMode(){await sdk.selectTool('select');await sdk.setSelectionMode('rectangle');},
 async multi(){const before=sdk.appearance.read();check(before.eligible.length===6,'allNewKindsInMixedSelection');check(before.fillExcluded.includes(ids.table)&&before.strokeExcluded.includes(ids.table),'mixedFieldApplicability');const seeds=new Map(before.objects.map(o=>[o.objectId,o.values.seed]));const c=packets.length;await sdk.appearance.patch({roughness:1.25,strokeWidth:3,fillKind:'crosshatch',fill:[.2,.5,.8,1]});const after=sdk.appearance.read();check(after.objects.every(o=>o.values.seed===seeds.get(o.objectId)),'mixedSeedsPreserved');check(!after.mixed.includes('roughness')&&after.values.roughness===1.25,'mixedIgnoresSeeds');check(!after.mixed.includes('strokeWidth')&&after.values.strokeWidth===3,'mixedStrokeExcludesTableGrid');check(packets.length===c+1,'mixedOneOperation');await sdk.undo();check(same(sdk.appearance.read().objects,before.objects),'mixedUndoAll');await sdk.redo();const token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await sdk.multi.setPermission('contextUnavailable');await rejects(()=>sdk.appearance.commit(token),'newKindsPermissionStalesSession');await sdk.multi.setPermission('localSingleUser');return {checks};},
 async restoreRemote(){const metadata={generation:sdk.readState().generation,documentRevision:'29',recoveryFrontier:[8,1,16,1,24,29]},saved=await sdk.captureSnapshot(metadata);const restored=await create('c',{bytes:saved.bytes,metadata:{...metadata,checkpointDigest:saved.checkpointDigest,resourceBinding:'88'}});for(const e of sdk.resources.list().entries)if(e.token){const t=restored.resources.token(e.resourceId);if(t)await restored.resources.publish(t,sdk.resources.readBytes(e.token));}const expected=await hash((await png()).bytes);check(await hash((await png(restored)).bytes)===expected,'newKindsSnapshotExactAppearance');check(same(restored.readVectorPath(ids.hole).commands,ring),'snapshotCanonicalPath');const remote=await create('b');for(const bytes of packets)await remote.applyRemoteOperation(bytes);check(remoteEcho===0,'newKindsRemoteNoEcho');check(await hash((await png(remote)).bytes)===expected,'newKindsRemoteExactAppearance');const token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await rejects(()=>remote.appearance.commit(token),'newKindsForeignTokenRejects');await sdk.appearance.cancel(token);return {checks};},
 async staleStart(){await sdk.setSelectionMode('point');previewToken=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(previewToken,{roughness:3});previewGeneration=sdk.readState().generation;previewPackets=packets.length;},
 async staleEnd(){await rejects(()=>sdk.appearance.commit(previewToken),'newKindsSelectionStalesSession');check(sdk.readState().generation===previewGeneration&&packets.length===previewPackets,'staleSelectionNoOperation');const g=sdk.readState().generation;for(const options of [{commands:[{op:'bad'}]},{commands:[{op:'line',point:[2,3]}]},{commands:ring,fillRule:'unknown'},{commands:[{op:'move',point:[Infinity,0]}]},{commands:[{op:'move',point:[0,0,1]}]},{commands:[{op:'move',point:[0]}]},{commands:ring,extra:true}])await rejects(()=>sdk.createVectorPath(options),'pathInvalid'+Object.keys(checks).length);check(sdk.readState().generation===g,'invalidPathCreateAtomic');return {checks};},
 async fixture(){const mount=document.createElement('div');mount.style.cssText='position:absolute;left:1800px;width:800px;height:550px';document.body.append(mount);const owner=await createRuntime({mount,documentId:'73'.repeat(16),permission:'localSingleUser',builtinFonts:false,onError:e=>errors.push(String(e))});owners.push(owner);await owner.applyRemoteOperation(new Uint8Array(await (await fetch('./fixture.bin')).arrayBuffer()));const output=await owner.exportImage({bounds:[0,0,800,550],padding:0});const rgba=async(blob)=>{const b=await createImageBitmap(blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');x.drawImage(b,0,0);b.close();return x.getImageData(0,0,c.width,c.height).data;};const a=await rgba(new Blob([output.bytes],{type:output.mimeType})),b=await rgba(await(await fetch('./native-render.png')).blob());check(a.length===b.length,'extendedNativeWebImageSize');let max=0,sum=0;for(let i=0;i<a.length;++i){const delta=Math.abs(a[i]-b[i]);max=Math.max(max,delta);sum+=delta;}check(max<=2&&sum/a.length<=.02,'extendedNativeWebPixelTolerance');return {checks,pixels:{channels:a.length,max,mean:sum/a.length},bytes:Array.from(output.bytes)};},
 async close(){for(const owner of owners)await owner.close();return {checks,errors};}
};
</script>
