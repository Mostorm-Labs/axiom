<!doctype html><meta charset="utf-8"><title>Sketch v1 external consumer</title>
<style>body{margin:0}.mount{width:800px;height:550px}#b,#c{position:absolute;left:850px;top:0}</style>
<div id="a" class="mount"></div><div id="b" class="mount"></div><div id="c" class="mount"></div>
<script type="module">
import {createRuntime} from './axiom.mjs';
const documentId='73737373737373737373737373737373',checks={},errors=[],packets=[],owners=[];
let sdk,remote,reopened,savedStyle,exportHash,dragToken,dragPackets,dragGeneration,routeId;
const check=(value,name)=>{if(!value)throw Error(name);checks[name]=true;};
const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join('');
async function create(id,restore){const r=await createRuntime({mount:document.getElementById(id),documentId,permission:'localSingleUser',...(restore?{restore,builtinFonts:false}:{}),onError:e=>errors.push(String(e)),onOperation:bytes=>{if(id==='a')packets.push(bytes);else if(id==='b')checks.remoteEcho=true;}});owners.push(r);return r;}
async function rejects(fn,name){let rejected=false;try{await fn();}catch{rejected=true;}check(rejected,name);}
const png=async()=>sdk.exportImage({padding:12,background:'transparent'});
window.probe={ready:(async()=>{sdk=await create('a');await sdk.selectShape('rectangle');})(),info:()=>sdk.readBuildInfo(),
 diagnostics:()=>({errors,checks,state:sdk.readState(),read:sdk.appearance.read()}),select:()=>sdk.selectTool('select'),read:()=>sdk.appearance.read(),state:()=>sdk.readState(),
 async run(){
  check(sdk.readSelection().count===1,'realPointerSelected');check(sdk.readBuildInfo().features.appearancePreview===1,'advertisedCapability');
  await sdk.appearance.patch({enabled:true,roughness:1,fillKind:'hachure',gap:8,hatchWidth:1,angle:-45,fill:[.2,.5,.8,1],stroke:[.1,.15,.2,1],strokeEnabled:true,strokeWidth:2});
  let s=sdk.appearance.read();const seed=s.values.seed;check(typeof seed==='string'&&BigInt(seed)>0n,'runtimeSeedLossless');check(s.values.roughness===1&&s.values.fillKind==='hachure','styleReadback');
  const count=packets.length,generation=sdk.readState().generation;
  let token=(await sdk.appearance.begin()).token;
  for(const degree of [.1,.3,.6,1.4,2.3])await sdk.appearance.updatePreview(token,{roughness:degree});
  await wait();check(sdk.readState().generation===generation&&packets.length===count,'previewNoCanonicalOrSync');check(sdk.appearance.read().values.roughness===1,'previewReadIsCanonical');
  const committed=await sdk.appearance.commit(token);await wait();check(committed.changed&&BigInt(sdk.readState().generation)===BigInt(generation)+1n&&packets.length===count+1,'oneCommitOneOperation');
  check(sdk.appearance.read().values.roughness===2.3&&sdk.appearance.read().values.seed===seed,'commitRetainsSeed');
  await sdk.undo();check(sdk.appearance.read().values.roughness===1&&sdk.appearance.read().values.seed===seed,'singleUndoRestoresDrag');await sdk.redo();check(sdk.appearance.read().values.roughness===2.3,'redoRestoresDrag');
  const beforeCancel=sdk.readState().generation;token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await sdk.appearance.cancel(token);check(sdk.readState().generation===beforeCancel&&sdk.appearance.read().values.roughness===2.3,'cancelNoOperation');
  token=(await sdk.appearance.begin()).token;const noop=await sdk.appearance.commit(token);check(!noop.changed&&sdk.readState().generation===beforeCancel,'noopCommitNoOperation');await rejects(()=>sdk.appearance.commit(token),'expiredTokenRejected');
  await sdk.appearance.patch({enabled:false});check(sdk.appearance.read().values.seed===seed,'disableKeepsSeed');await sdk.appearance.patch({enabled:true,roughness:0});check(sdk.appearance.read().values.seed===seed&&sdk.appearance.read().values.fillKind==='hachure','zeroRetainsSeedAndPattern');
  const hatch=sdk.appearance.read().values;await sdk.setAppearance({strokeWidth:5});check(sdk.appearance.read().values.fillKind==='hachure'&&sdk.appearance.read().values.gap===hatch.gap&&sdk.appearance.read().values.hatchWidth===hatch.hatchWidth,'legacyWidthPreservesPatternDensity');
  await sdk.appearance.patch({roughness:1.5,strokeWidth:2});
  const p=await png();exportHash=await hash(p.bytes);await wait();check(await hash((await png()).bytes)===exportHash,'redrawDeterministicExport');await sdk.panBy(80,30);await sdk.zoomAt(200,150,1.4);check(await hash((await png()).bytes)===exportHash,'cameraDoesNotResample');await sdk.zoomAt(0,0,1);const camera=sdk.readState().camera;await sdk.panBy(-camera.x,-camera.y);
  const stale=sdk.appearance.read();await sdk.appearance.patch({opacity:.8});await rejects(()=>sdk.appearance.patch({roughness:3},stale),'staleObservationRejected');await sdk.appearance.patch({opacity:1});
  const g=sdk.readState().generation;for(const patch of [{roughness:3.1},{gap:1},{hatchWidth:0},{angle:181},{styleVersion:2},{seed:'99'},{opacity:2},{fillKind:'unknown'},{dash:[0,4]},{roughness:NaN}])await rejects(()=>sdk.appearance.patch(patch),'invalid'+Object.keys(checks).length);check(sdk.readState().generation===g,'invalidAtomic');
  token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await sdk.multi.setPermission('contextUnavailable');await rejects(()=>sdk.appearance.commit(token),'permissionChangeStalesSession');await sdk.multi.setPermission('localSingleUser');check(sdk.appearance.read().values.roughness===1.5,'staleClearsWithoutCommit');
  token=(await sdk.appearance.begin()).token;remote=await create('b');await rejects(()=>remote.appearance.commit(token),'foreignRuntimeTokenRejected');await sdk.appearance.cancel(token);
  savedStyle=sdk.appearance.read().values;const metadata={generation:sdk.readState().generation,documentRevision:'17',recoveryFrontier:[8,1,16,1,24,17]},saved=await sdk.captureSnapshot(metadata);
  reopened=await create('c',{bytes:saved.bytes,metadata:{...metadata,checkpointDigest:saved.checkpointDigest,resourceBinding:'79'}});
  for(const entry of sdk.resources.list().entries)if(entry.token){const target=reopened.resources.token(entry.resourceId);if(target)await reopened.resources.publish(target,sdk.resources.readBytes(entry.token));}
  check(await hash((await reopened.exportImage({padding:12,background:'transparent'})).bytes)===await hash((await png()).bytes),'snapshotExactRenderedAppearance');
  for(const bytes of packets)await remote.applyRemoteOperation(bytes);check(!checks.remoteEcho,'remoteNoEcho');check(await hash((await remote.exportImage({padding:12,background:'transparent'})).bytes)===await hash((await png()).bytes),'remoteExactRenderedAppearance');
  token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await rejects(()=>sdk.appearance.commit({...token,serial:'invalid'}),'invalidTokenRejected');await rejects(()=>sdk.appearance.commit(token),'invalidTokenClearsPreview');
  token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});await rejects(()=>sdk.appearance.commit({...token,owner:'foreign'}),'foreignTokenRejectsActivePreview');await rejects(()=>sdk.appearance.commit(token),'foreignTokenClearsPreview');
  token=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(token,{roughness:3});document.getElementById('a').style.width='780px';await wait();await new Promise(r=>setTimeout(r,100));await rejects(()=>sdk.appearance.commit(token),'surfaceResizeInvalidatesSession');document.getElementById('a').style.width='800px';await wait();
  const oldSeed=sdk.appearance.read().values.seed;await sdk.appearance.patch({reseed:true});check(sdk.appearance.read().values.seed!==oldSeed,'explicitReseed');await sdk.undo();check(sdk.appearance.read().values.seed===oldSeed,'reseedUndo');
  return {checks};
 },
 async pixels(){const mount=document.createElement('div');mount.className='mount';mount.style.position='absolute';mount.style.left='1700px';document.body.append(mount);const pixel=await createRuntime({mount,documentId,permission:'localSingleUser',builtinFonts:false,onError:e=>errors.push(String(e))});owners.push(pixel);await pixel.applyRemoteOperation(new Uint8Array(await(await fetch('fixture.bin')).arrayBuffer()));const image=await pixel.exportImage({bounds:[0,0,800,550],padding:0});const native=await(await fetch('native-render.png')).blob();async function decode(blob){const bitmap=await createImageBitmap(blob),canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);bitmap.close();return ctx.getImageData(0,0,canvas.width,canvas.height).data;}const a=await decode(native),b=await decode(new Blob([image.bytes],{type:'image/png'}));let max=0,total=0,changed=0;check(a.length===b.length,'nativeWebPixelDimensions');for(let i=0;i<a.length;i++){const delta=Math.abs(a[i]-b[i]);max=Math.max(max,delta);total+=delta;if(delta)++changed;}check(max<=2&&total/a.length<=.02,'nativeWebPixelsWithinAATolerance');return {bytes:Array.from(image.bytes),pixels:{maxChannelError:max,meanChannelError:total/a.length,changedChannels:changed,channels:a.length},checks};},
 async previewOnly(){dragGeneration=sdk.readState().generation;exportHash=await hash((await png()).bytes);dragToken=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(dragToken,{roughness:3,fillKind:'solid',fill:[1,0,0,1]});await wait();check(await hash((await png()).bytes)===exportHash,'previewExportUsesCommittedContent');},
 async commitPreview(){await sdk.appearance.commit(dragToken);await wait();check(BigInt(sdk.readState().generation)===BigInt(dragGeneration)+1n,'previewCommitSingleGeneration');return {checks};},
 async undoPreview(){await sdk.undo();},
 async prepare(shape,roughness=1,fillKind='hachure',width=2,opacity=1,dash=[]){await sdk.appearance.setDefaults({enabled:true,roughness,fillKind,strokeEnabled:true,strokeWidth:width,opacity,dash,fill:[.25,.55,.8,1],stroke:[.1,.15,.2,1]});await sdk.selectShape(shape);},
 async matrixDone(){await sdk.selectTool('select');const p=await sdk.exportImage({scale:1});check(p.bytes.length>1000,'visualMatrixExport');await sdk.table.create({rows:2,columns:2,x:470,y:20});return {checks,errors};},
 async sticky(){const s=sdk.appearance.read();check(s.values.fillKind==='crosshatch'&&s.values.enabled,'stickyCreationUsesDefaultAppearance');return {checks};},
 async selectMode(){await sdk.selectTool('select');await sdk.setSelectionMode('rectangle');},
 async multi(){const s=sdk.appearance.read();check(s.eligible.length>2,'multiEligible');check(s.fillExcluded.length>0&&s.strokeExcluded.length>0,'tableExplicitPaintExclusions');const seeds=s.objects.map(o=>o.values.seed);check(new Set(seeds).size===seeds.length,'newObjectSeedsIndependent');const count=packets.length;await sdk.appearance.patch({roughness:1.25});await wait();const n=sdk.appearance.read();check(n.objects.every((o,i)=>o.values.seed===seeds[i]),'multiPreservesEachSeed');check(!n.mixed.includes('roughness')&&n.values.roughness===1.25,'roughnessMixedIgnoresSeeds');check(packets.length===count+1,'multiAtomicSingleOperation');await sdk.undo();check(same(sdk.appearance.read().objects,s.objects),'multiUndoAll');  await sdk.group();const groupGeneration=sdk.readState().generation;check(sdk.appearance.read().eligible.length===0&&sdk.appearance.read().excluded.length===1,'groupExcludedWithoutRecursion');await rejects(()=>sdk.appearance.patch({roughness:2}),'groupAppearanceRejects');check(sdk.readState().generation===groupGeneration,'groupPatchNoOperation');await sdk.ungroup();return {checks};},
 async begin(){await sdk.setSelectionMode('point');dragPackets=packets.length;dragGeneration=sdk.readState().generation;dragToken=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(dragToken,{roughness:3});},
 async stale(){await rejects(()=>sdk.appearance.commit(dragToken),'selectionChangeStalesSession');check(sdk.readState().generation===dragGeneration&&packets.length===dragPackets,'staleSelectionNoOperation');return {checks};},
 async routeSetup(){await sdk.createSticky({size:140,x:300,y:150});routeId=(await sdk.createConnector({start:{point:[80,220]},end:{point:[700,220]},routing:2})).objectId;await sdk.selectTool('select');for(let n=0;n<100&&sdk.readConnector(routeId).routeStatus!==1;n++)await wait();const r=sdk.readConnector(routeId);check(r.routeStatus===1,'orthogonalFixtureReady');const segments=r.route.slice(1).map((p,i)=>({length:Math.hypot(p[0]-r.route[i][0],p[1]-r.route[i][1]),mid:[(p[0]+r.route[i][0])/2,(p[1]+r.route[i][1])/2]})).sort((a,b)=>b.length-a.length);return {mid:segments[0].mid,route:r};},
 async routePreview(){check(sdk.readState().primary===routeId,'orthogonalFixtureSelected');await sdk.appearance.patch({enabled:true,roughness:2,strokeWidth:2,strokeEnabled:true});await new Promise(r=>setTimeout(r,300));dragToken=(await sdk.appearance.begin()).token;await sdk.appearance.updatePreview(dragToken,{strokeWidth:40});await wait();return sdk.readConnector(routeId);},
 async routeCommit(){await sdk.appearance.commit(dragToken);await wait();return {checks,route:sdk.readConnector(routeId)};},
 async close(){for(const r of owners)await r.close();return {checks,errors};}
};
</script>
