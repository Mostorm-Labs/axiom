<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom 圆角与手绘字体</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;font:14px system-ui;color:#24344a}header{display:flex;align-items:center;gap:18px;padding:18px 28px;background:white;border-bottom:1px solid #e0e6ef}h1{font-size:18px;margin:0}p{margin:14px 28px;color:#68778c}a{color:#2866ba}#board{width:calc(100% - 56px);max-width:1000px;aspect-ratio:1000/680;min-height:320px;background:white;margin:18px 28px;box-shadow:0 3px 24px #1e304412}button{border:1px solid #d6dfeb;border-radius:6px;background:white;padding:7px 14px;color:inherit;cursor:pointer}</style><header><h1>圆角与手绘字体</h1><a href="example.html">打开四行工具栏 Demo</a><button id="export" disabled>导出 PNG</button></header><p>矩形与三角形：规则 / 手绘圆角；右侧：圆角折线箭头。字体：Excalifont 中英混排、Xiaolai 小赖。</p><div id="board"></div><p id="status">正在加载共享 Runtime…</p><script type="module">
import {createRuntime} from './axiom.mjs';try{const sdk=await createRuntime({mount:document.getElementById('board'),documentId:'87'.repeat(16),permission:'localSingleUser'});await sdk.applyRemoteOperation(new Uint8Array(await(await fetch('./rounded-fixture.bin')).arrayBuffer()));await sdk.selectTool('select');await sdk.fitContent();document.getElementById('status').textContent='样例已就绪。圆角独立于手绘程度；中文回退使用资源清单中的小赖字体，无系统字体替代。';const button=document.getElementById('export');button.disabled=false;button.onclick=async()=>{const result=await sdk.exportImage({bounds:[0,0,1000,680],padding:0}),url=URL.createObjectURL(new Blob([result.bytes],{type:result.mimeType})),a=document.createElement('a');a.href=url;a.download='axiom-rounded-handwriting.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}catch(error){document.getElementById('status').textContent=String(error);}</script></html>
