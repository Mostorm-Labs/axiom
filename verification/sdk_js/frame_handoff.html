<!doctype html><meta charset="utf-8"><title>SDK frame handoff regression</title>
<style>#mount{width:480px;height:360px}</style><div id="mount"></div><pre id="result">PENDING</pre>
<script type="module">
import {createRuntime,createAnchorLayer} from './axiom.mjs';
const results=[],errors=[],scenarios=[];
const check=(ok,label)=>{if(!ok)throw Error(label);results.push(label);};
const wait=()=>new Promise(r=>setTimeout(r,20));
const until=async(fn,label)=>{for(let i=0;i<250;i++){if(fn())return;await wait();}throw Error('timeout '+label);};
let held=false,delayed=0,frames=0;
let delayLoss=false;const lossFacts=[],wrapped=new WeakMap();
const add=EventTarget.prototype.addEventListener,remove=EventTarget.prototype.removeEventListener;
EventTarget.prototype.addEventListener=function(type,listener,options){
  if(type==='webglcontextlost'&&typeof listener==='function'){
    if(!wrapped.has(listener))wrapped.set(listener,function(event){if(delayLoss){event.preventDefault();lossFacts.push(()=>listener.call(this,event));}else listener.call(this,event);});
    return add.call(this,type,wrapped.get(listener),options);
  }
  return add.call(this,type,listener,options);
};
EventTarget.prototype.removeEventListener=function(type,listener,options){return remove.call(this,type,type==='webglcontextlost'?(wrapped.get(listener)||listener):listener,options);};
const original=WebGL2RenderingContext.prototype.clientWaitSync;
// Delay a real ready fence; never fabricate completion or hide a GL failure.
WebGL2RenderingContext.prototype.clientWaitSync=function(...args){
  const status=original.apply(this,args);
  if(held&&(status===this.ALREADY_SIGNALED||status===this.CONDITION_SATISFIED)){++delayed;return this.TIMEOUT_EXPIRED;}
  return status;
};
let sdk;
const pointer=(type,x,y)=>{const c=sdk.canvas,r=c.getBoundingClientRect();
  c.dispatchEvent(new PointerEvent(type,{pointerId:31,pointerType:'mouse',clientX:r.left+x,clientY:r.top+y,
    buttons:type==='pointerup'?0:1,bubbles:true,cancelable:true}));};
const blue=()=>{const c=sdk.canvas,g=c.getContext('webgl2'),f=g.getParameter(g.FRAMEBUFFER_BINDING),p=new Uint8Array(4),d=devicePixelRatio||1;
  // Auto-selection now shows the Shape's centered text placeholder. Sample
  // below it so this remains an oracle for canonical fill and frame handoff.
  g.bindFramebuffer(g.FRAMEBUFFER,null);g.readPixels(Math.round(120*d),c.height-Math.round(120*d),1,1,g.RGBA,g.UNSIGNED_BYTE,p);g.bindFramebuffer(g.FRAMEBUFFER,f);
  return p[2]>p[0]+20&&p[3]>0;};
try{
  sdk=await createRuntime({mount:document.getElementById('mount'),onError:e=>errors.push({code:e.code,details:e.details}),onFrame:()=>++frames});
  sdk.canvas.setPointerCapture=()=>{};sdk.canvas.hasPointerCapture=()=>false;
  await until(()=>frames>0,'initial real presentation');
  const anchors=createAnchorLayer({runtime:sdk});
  const anchor=anchors.create({rect:[20,30,100,60]});
  const anchorElement=anchors.getElement(anchor.id);
  const anchorWidth=()=>anchorElement.getBoundingClientRect().width;
  check(Math.abs(anchorWidth()-100)<.05,'anchor starts at the submitted scale');
  const projected=anchors.readTransform();projected[4]=500;
  check(Math.abs(anchors.readTransform()[4])<.05,'transform readback is an owned copy');
  await sdk.selectShape('rectangle');
  held=true;
  await sdk.zoomAt(0,0,1.01);
  await until(()=>delayed>0,'real pending GPU fence');
  await until(()=>Math.abs(anchorWidth()-101)<.05,'anchor follows submitted pixels before the GPU fence is acknowledged');
  check(Math.abs(anchorWidth()-101)<.05,'anchor follows submitted pixels before the GPU fence is acknowledged');
  const beforeZoomDelay=delayed;
  await sdk.zoomAt(0,0,1.05);
  await until(()=>delayed>beforeZoomDelay+1,'new camera demand while the old frame is still held');
  check(Math.abs(sdk.readState().camera.scale-1.05)<.001,
    'new camera demand is accepted while the old frame is still held');
  pointer('pointerdown',40,40);
  pointer('pointermove',160,140);pointer('pointerup',160,140);
  await until(()=>sdk.readState().objects===1,'canonical input committed while prior fence pending');
  check(sdk.readState().objects===1,'canonical input committed while prior fence pending');
  held=false;
  await until(blue,'new canonical pixels after pending frame');
  await until(()=>Math.abs(anchorWidth()-105)<.05,'anchor follows the replacement pixels');
  check(anchors.get(anchor.id).rect[2]===100,'camera updates preserve the stored world rectangle');
  check(!errors.length,'no rejected completion after superseded preview');
  scenarios.push('pending-input');
  const before=frames;
  for(let i=0;i<8;i++)await sdk.selectTool('select');
  await wait();await wait();
  check(!errors.length,'idle opportunities do not acknowledge an already presented frame');
  scenarios.push('no-duplicate-completion');
  held=true;await sdk.setAppearance({selected:false,fill:[0,0,1,1]});
  const previousDelays=delayed;
  await sdk.zoomAt(0,0,1.1);
  await until(()=>delayed>previousDelays,'pending resize fence');
  document.getElementById('mount').style.width='520px';
  await until(()=>sdk.readState().surface.width===520,'new surface metrics');
  held=false;
  await until(()=>frames>before,'resized real presentation');
  await until(()=>!document.querySelector('#mount canvas[id$="-retained"]'),'resized qualified display');
  check(sdk.readState().objects===1&&!errors.length,'resize invalidates old work without losing document');
  check(Math.abs(anchorWidth()-110)<.05,'anchor projection follows the resized canvas');
  scenarios.push('pending-resize');
  const canvases=[sdk.canvas,document.querySelector('#mount canvas[id$="-preview"]')];
  const extensions=canvases.map(c=>c.getContext('webgl2').getExtension('WEBGL_lose_context'));
  check(extensions.every(Boolean),'real context loss extension');
  held=true;const previousLossDelays=delayed;
  await sdk.zoomAt(0,0,1.2);
  await until(()=>delayed>previousLossDelays,'pending native-loss fence');
  const framesAtLoss=frames;delayLoss=true;
  for(const e of extensions)e.loseContext();
  await until(()=>lossFacts.length===2&&!sdk.readState().surface.available,'native loss before delayed DOM delivery');
  check(frames===framesAtLoss,'lost GPU fences do not become successful presentations');
  scenarios.push('native-loss-before-dom');
  delayLoss=false;for(const fact of lossFacts.splice(0))fact();held=false;
  for(const e of extensions)e.restoreContext();
  await until(()=>sdk.readState().surface.available,'surface recovery');
  await until(blue,'recovered canonical pixels');
  await until(()=>Math.abs(anchorWidth()-120)<.05,'anchor projection resumes after context recovery');
  check(!errors.length,'no stale completion after context recovery');
  scenarios.push('context-recovery');
  await sdk.selectBrush('round-handdrawn',4);
  await sdk.selectTool('ink');
  await sdk.setBrushConfig({...sdk.readBrushConfig(),size:8,color:[1,0,0,1],opacity:1});
  const strokeStart=sdk.readState();
  const redStrokeAt=(x,y)=>{
    const c=sdk.canvas,g=c.getContext('webgl2'),fb=g.getParameter(g.FRAMEBUFFER_BINDING);
    const rect=c.getBoundingClientRect(),pixel=new Uint8Array(4);
    g.bindFramebuffer(g.FRAMEBUFFER,null);
    try {
      g.readPixels(Math.floor(x*c.width/rect.width),c.height-1-Math.floor(y*c.height/rect.height),
        1,1,g.RGBA,g.UNSIGNED_BYTE,pixel);
    } finally { g.bindFramebuffer(g.FRAMEBUFFER,fb); }
    return pixel[0]>pixel[1]+80 && pixel[0]>pixel[2]+80 && pixel[3]>200;
  };
  const touch=(type,id,x,y)=>{
    const canvas=sdk.canvas,rect=canvas.getBoundingClientRect();
    canvas.dispatchEvent(new PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:rect.left+x,
      clientY:rect.top+y,buttons:type==='pointerup'?0:1,bubbles:true,cancelable:true}));
  };
  pointer('pointerdown',250,160);pointer('pointermove',265,164);
  await until(()=>document.querySelector('#mount canvas[id$="-preview"]').style.visibility==='visible','live short stroke');
  // Dispatch Up and both contacts before another display opportunity can run.
  pointer('pointerup',280,168);
  touch('pointerdown',41,180,140);touch('pointerdown',42,300,140);
  await until(()=>sdk.readState().objects===strokeStart.objects+1,'short stroke committed');
  const committed=sdk.readState();
  check(committed.activeContacts===2,'two stationary contacts held after pen up');
  await until(()=>sdk.readState().lastCommit.presentedGeneration===committed.generation,'latest stroke visible before the pinch moves');
  check(redStrokeAt(265,164),'new stroke occupies canonical surface during stationary claim');
  check(sdk.readState().camera.scale===strokeStart.camera.scale &&
        Math.abs(anchorWidth()-strokeStart.camera.scale*100)<.05,'stationary contacts preserve submitted camera');
  touch('pointermove',42,325,140);
  await until(()=>sdk.readState().camera.scale>strokeStart.camera.scale &&
    Math.abs(anchorWidth()-sdk.readState().camera.scale*100)<.05,'first real pinch move submitted');
  const camera=sdk.readState().camera;
  const zoom=camera.scale/strokeStart.camera.scale;
  check(redStrokeAt((265-strokeStart.camera.x)*zoom+camera.x,(164-strokeStart.camera.y)*zoom+camera.y),
    'first submitted pinch keeps the new stroke at its projected location');
  touch('pointerup',42,325,140);touch('pointerup',41,180,140);
  check(sdk.readState().objects===committed.objects && sdk.readState().generation===committed.generation &&
    sdk.readState().activeContacts===0 && !errors.length,'pinch preserves committed stroke and releases contacts');
  scenarios.push('short-stroke-pinch');
  anchors.dispose();
  await sdk.close();
  check(!anchorElement.isConnected,'disposing the Shell layer releases its DOM anchors');
  document.getElementById('result').textContent=JSON.stringify({status:'PASS',results,scenarios,delayed,frames});
}catch(e){held=false;document.getElementById('result').textContent=JSON.stringify({status:'FAIL',results,scenarios,delayed,frames,error:String(e),errors,state:sdk?.readState(),selection:sdk?.readSelection()});}
finally{held=false;delayLoss=false;WebGL2RenderingContext.prototype.clientWaitSync=original;EventTarget.prototype.addEventListener=add;EventTarget.prototype.removeEventListener=remove;}
</script>
