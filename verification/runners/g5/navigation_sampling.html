<!doctype html><meta charset="utf-8"><title>G5 cold/warm root SDK consumer</title>
<style>body{margin:0}#mount{width:800px;height:500px}</style><div id="mount"></div>
<script type="module">
import {createRuntime} from '/axiom.mjs';
import {postInputReceiptWait} from '/navigation_metrics.mjs';
const errors=[],frames=[],bindings=new WeakMap();
let sdk,active=null,sequence=0;
const raf=()=>new Promise(requestAnimationFrame);
const until=async(fn,label)=>{for(let i=0;i<1800;++i){if(fn())return;await raf();}throw Error(label);};
const proto=WebGL2RenderingContext.prototype;
const bind=proto.bindFramebuffer;
proto.bindFramebuffer=function(target,fb){if(target===this.FRAMEBUFFER||target===this.DRAW_FRAMEBUFFER)bindings.set(this,fb);return bind.call(this,target,fb);};
for(const name of ['drawArrays','drawElements','drawArraysInstanced','drawElementsInstanced','clear','blitFramebuffer','clearBufferfv','clearBufferiv','clearBufferuiv']){
  const raw=proto[name];proto[name]=function(...args){
    const color=name==='clear'?!!(args[0]&this.COLOR_BUFFER_BIT):name==='blitFramebuffer'?!!(args[8]&this.COLOR_BUFFER_BIT):name.startsWith('clearBuffer')?args[0]===this.COLOR:true;
    if(active&&color&&this.canvas===sdk?.canvas&&!bindings.get(this)){
      ++active.draws;active.displayTimes.push(performance.now());if(name.startsWith('clear'))++active.colorClears;
    }
    return raw.apply(this,args);
  };
}
for(const name of ['fenceSync','clientWaitSync']){
  const raw=proto[name];proto[name]=function(...args){
    const started=performance.now(),result=raw.apply(this,args);
    if(active)active.fences.push({name,at:started,duration:performance.now()-started,timeout:name==='clientWaitSync'?args[2]:null,status:name==='clientWaitSync'?result:null});
    return result;
  };
}
new PerformanceObserver(list=>{if(active)active.longTasks.push(...list.getEntries().map(e=>({start:e.startTime,duration:e.duration})));}).observe({type:'longtask',buffered:false});
const mark=(kind,id)=>console.info('G5_SAMPLE_MARK '+JSON.stringify({kind,id,at:performance.now()}));
function pointer(type,x,y){
  const r=sdk.canvas.getBoundingClientRect(),e=new PointerEvent(type,{pointerId:1,pointerType:'mouse',
    clientX:r.left+x,clientY:r.top+y,button:type==='pointermove'?-1:0,buttons:type==='pointerup'?0:1,
    pressure:type==='pointerup'?0:.5,bubbles:true,cancelable:true});
  Object.defineProperty(e,'timeStamp',{value:1000+(++sequence)*4});sdk.canvas.dispatchEvent(e);
}
async function settle(prior){await until(()=>frames.length>prior,'canonical receipt did not arrive');for(let i=0;i<10;++i)await raf();}
async function click(x,y){const n=frames.length;pointer('pointerdown',x,y);pointer('pointerup',x,y);await settle(n);}
async function pixels(){
  const c=sdk.canvas,g=c.getContext('webgl2'),previous=g.getParameter(g.FRAMEBUFFER_BINDING);
  const bytes=new Uint8Array(c.width*c.height*4);g.bindFramebuffer(g.FRAMEBUFFER,null);
  g.readPixels(0,0,c.width,c.height,g.RGBA,g.UNSIGNED_BYTE,bytes);g.bindFramebuffer(g.FRAMEBUFFER,previous);
  const hash=await crypto.subtle.digest('SHA-256',bytes),ext=g.getExtension('WEBGL_debug_renderer_info');
  return {sha256:Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join(''),
    width:c.width,height:c.height,renderer:ext?g.getParameter(ext.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER)};
}
function touch(type,id,x,y){
  const r=sdk.canvas.getBoundingClientRect(),e=new PointerEvent(type,{pointerId:id,pointerType:'touch',
    clientX:r.left+x,clientY:r.top+y,buttons:type==='pointerup'?0:1,pressure:.5,width:12,height:12,bubbles:true,cancelable:true});
  Object.defineProperty(e,'timeStamp',{value:1000+(++sequence)*4});sdk.canvas.dispatchEvent(e);
}
async function phase(id,{mode='wheel',burst=1,panOnly=false}={}){
  const before=sdk.readState(),prior=frames.length;
  const value={id,samples:[],displayTimes:[],draws:0,colorClears:0,fences:[],longTasks:[],before};
  mark('begin',id);active=value;value.started=performance.now();
  value.contactDispatch=[];
  const contact=(...args)=>{const start=performance.now();touch(...args);value.contactDispatch.push({type:args[0],ms:performance.now()-start});};
  if(mode==='touch'){contact('pointerdown',2,40,90);await raf();contact('pointerdown',3,120,90);}
  await raf();let previous=performance.now();
  for(let i=0;i<72;++i){
    const beforeDraws=value.draws,tick=performance.now(),pan=panOnly||i>=36;
    if(mode==='touch'){
      const dx=(i<36?i+1:71-i)*4;contact('pointermove',2,40+dx,90);contact('pointermove',3,120+dx,90);
    }else for(let b=0;b<burst;++b)sdk.canvas.dispatchEvent(new WheelEvent('wheel',{clientX:400,clientY:250,ctrlKey:!pan,
      deltaX:pan?(i<(panOnly?36:54)?-8:8):0,deltaY:pan?(i<(panOnly?36:54)?-4:4):(i<18?-2:2),bubbles:true,cancelable:true}));
    const dispatchMs=performance.now()-tick,rafTimestamp=await raf(),now=performance.now();
    value.samples.push({index:i,at:now,rafTimestamp,interval:now-previous,dispatchMs,draws:value.draws-beforeDraws});previous=now;
  }
  if(mode==='touch'){contact('pointerup',2,40,90);contact('pointerup',3,120,90);}
  value.inputEnded=performance.now();value.framesDuringInput=frames.length-prior;
  mark('input-ended',id);
  value.afterInput=sdk.readState();
  // Exact settle remains observable even if a slow input loop allowed one earlier.
  await until(()=>postInputReceiptWait(frames.slice(prior),value.inputEnded)!==null,'post-input canonical completion timeout');
  value.settleMilliseconds=postInputReceiptWait(frames.slice(prior),value.inputEnded);
  for(let i=0;i<12;++i)await raf();
  value.ended=performance.now();active=null;mark('end',id);
  value.longTasks=value.longTasks.filter(t=>t.start>=value.started&&t.start<value.ended);
  value.after=sdk.readState();value.receipts=frames.slice(prior);
  value.checks={documentUnchanged:before.generation===value.after.generation&&before.objects===value.after.objects,
    selectionUnchanged:JSON.stringify(before.selected)===JSON.stringify(value.after.selected),
    operationUnchanged:JSON.stringify(before.lastCommit)===JSON.stringify(value.after.lastCommit),
    noCanonicalReceiptDuringInput:value.framesDuringInput===0,
    cameraReturned:Math.abs(before.camera.scale-value.after.camera.scale)<.0001&&Math.abs(before.camera.x-value.after.camera.x)<.01&&Math.abs(before.camera.y-value.after.camera.y)<.01};
  value.pixels=await pixels();return value;
}
window.probe={
  async setup(workload,selected,profile='round-handdrawn',revision=4,options={}){
    const started=performance.now();
    const mount=document.getElementById('mount');
    if(options.width)mount.style.width=options.width+'px';if(options.height)mount.style.height=options.height+'px';
    const points=options.points??2048,lines=options.lines??2;
    const uiReadTimes=[];
    sdk=await createRuntime({mount:document.getElementById('mount'),documentId:'99999999999999999999999999999999',
      permission:'localSingleUser',onError:e=>errors.push(String(e)),onFrame:frame=>frames.push({at:performance.now(),...frame}),
      onChange:options.uiReads?()=>{if(!sdk)return;const start=performance.now();
        sdk.readState();sdk.readSelection();sdk.text.read();sdk.readSelectedImage();sdk.readCrop();sdk.table.read();
        if(sdk.readState().selected.length)sdk.appearance.read();else sdk.appearance.readDefaults();sdk.readBackground();
        uiReadTimes.push(performance.now()-start);
      }:undefined});
    sdk.canvas.setPointerCapture=()=>{};sdk.canvas.hasPointerCapture=()=>false;
    sdk.data.attach({capacity:64});const brushSelection=await sdk.selectBrush(profile,revision);
    if(options.brush)await sdk.setBrushConfig({...sdk.readBrushConfig(),...options.brush});
    if(options.drawZoom){const prior=frames.length;await sdk.zoomAt(318,457,options.drawZoom);await settle(prior);}
    for(let line=0;line<lines;++line){
      const prior=frames.length;
      for(let i=0;i<points;++i){
        const t=i*.017;
        pointer(i===0?'pointerdown':i===points-1?'pointerup':'pointermove',
          options.scribble?300+Math.sin(t)*220+Math.sin(t*.37)*60:40+i*(options.span?options.span/points:1.5),
          options.scribble?350+Math.sin(t*.73)*180:90+line*(options.lineSpacing??310)+Math.sin(i*.035)*42);
      }
      await settle(prior);
    }
    if(options.transformedStroke){
      await sdk.selectTool('select');await click(options.scribble?300:40,options.scribble?350:90);
      if(!sdk.readState().selected.length)throw Error('stroke transform fixture target missing');
      const prior=frames.length;await sdk.transformSelection([1,0,0,1,12,8]);await settle(prior);
    }
    for(let i=0;i<(options.shapes??0);++i){
      await sdk.selectShape(i%2?'ellipse':'rectangle');
      const prior=frames.length;pointer('pointerdown',100+i*60,220+i*30);pointer('pointerup',270+i*60,340+i*30);await settle(prior);
    }
    let target=null;const prior=frames.length;
    if(workload==='image'||workload==='mixed'){
      const c=document.createElement('canvas');c.width=2048;c.height=1024;
      const ctx=c.getContext('2d'),gradient=ctx.createLinearGradient(0,0,c.width,c.height);
      gradient.addColorStop(0,'#345eb8');gradient.addColorStop(1,'#f19d42');ctx.fillStyle=gradient;ctx.fillRect(0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      target=(await sdk.importImage(new Uint8Array(await blob.arrayBuffer()),'image/png')).objectId;
      await sdk.transformSelection([1,0,0,1,200,170]);
    }
    if(workload==='table'||workload==='mixed'){
      target=(await sdk.table.create({rows:3,columns:3,x:220,y:160})).objectId;
      const t=sdk.table.read(target);await sdk.table.edit({objectId:target,rowId:t.rows[0].id,columnId:t.columns[0].id});
      await sdk.text.replace('G5 Table 0123456789');await sdk.text.finish();
    }
    if(workload==='sticky'||workload==='mixed'){
      target=(await sdk.createSticky({size:180,x:250,y:workload==='mixed'?600:160})).objectId;
      await sdk.text.edit(target);await sdk.text.replace('G5 Sticky\nCold / warm navigation');await sdk.text.finish();
    }else if(!['long-line','image','table','mixed'].includes(workload))throw Error('unknown workload');
    if(target)await settle(prior);
    await sdk.selectTool('select');
    if(selected){
      if(workload==='long-line'||workload==='mixed'){await click(40,90);target=sdk.readState().primary;}
      else if(sdk.readState().primary!==target)await click(workload==='sticky'?300:260,200);
      if(!sdk.readState().selected.length||sdk.readState().primary!==target)throw Error('fixture target not selected');
    }else{await click(790,490);if(sdk.readState().selected.length)throw Error('fixture selection not cleared');}
    if(options.zoom){const prior=frames.length;await sdk.zoomAt(318,457,options.zoom);await settle(prior);}
    for(let i=0;i<12;++i)await raf();
    window.probe.uiReadTimes=uiReadTimes;
    return {workload,selected,profile,revision,options,brushSelection,target,setupMs:performance.now()-started,build:sdk.readBuildInfo(),state:sdk.readState(),initialPixels:await pixels(),errors};
  },
  async measure(id,options){return phase(id,options);},
  async interruptSelection(options){
    const rect=sdk.canvas.getBoundingClientRect();await click(rect.width-16,rect.height-24);
    pointer('pointerdown',40,90);pointer('pointerup',40,90);
    return phase('interrupted-selection',options);
  },
  async run(){const cold=await phase('cold'),warm=await phase('warm');return {cold,warm,errors};},
  async close(){for(let p;(p=sdk.data.readNext());)sdk.data.release(p);await sdk.close();return {closed:!document.querySelector('#mount canvas'),errors};}
};
</script>
