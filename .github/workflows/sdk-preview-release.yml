name: Axiom SDK and demo release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an unpublished vX.Y.Z candidate using this new run/build number (tag ref required)'
        type: boolean
        default: false
      browser_probe_only:
        description: 'Run browser environment diagnostic only (no product qualification or release)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/sdk-preview-release.yml'
      - 'tools/release/**'
      - 'runtime/**'
      - 'apps/axiom_canvas_demo/**'
      - 'apps/minimal_runtime_host/**'
      - 'verification/sdk_cpp_windows/**'
      - 'verification/sdk_web_external/**'
      - 'CMakeLists.txt'
      - 'cmake/AxiomRuntime*'
      - 'sdk/**'
      - 'verification/sdk_windows_dll/**'
      - 'verification/sdk_js/**'
      - '*sdk.lock.json'
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: axiom-sdk-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    if: github.event_name != 'workflow_dispatch' || !inputs.browser_probe_only
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: identity
        shell: bash
        run: |
          python tools/release/version_identity.py --ci --require-fresh-build
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  browser-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_probe_only
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe real Chrome startup
        shell: pwsh
        run: |
          node --version
          Get-Item "$env:ProgramFiles\Google\Chrome\Application\chrome.exe" | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.ProductVersion}}
          node tools/release/chrome_probe.mjs "$env:ProgramFiles\Google\Chrome\Application\chrome.exe" out/chrome-probe.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-chrome-probe-${{ github.run_attempt }}
          path: out/chrome-probe.json
  build:
    needs: identity
    if: github.event_name != 'workflow_dispatch' || !inputs.browser_probe_only
    name: Build and verify ${{ matrix.platform }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            semantic_target: windows-x64-msvc-static
            skia_target: windows-x64-d3d12
          - platform: web
            semantic_target: web-wasm32
            skia_target: web-wasm-webgl2
    env:
      PYTHONUTF8: '1'
      AXIOM_BUILD_NUMBER: ${{ needs.identity.outputs.build_number }}
      AXIOM_SDK_STORE: ${{ github.workspace }}/out/sdk-store
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.51'
      - name: Verify Chrome environment before SDK build
        if: matrix.platform == 'web'
        shell: pwsh
        run: |
          node tools/release/chrome_probe.mjs "$env:ProgramFiles\Google\Chrome\Application\chrome.exe" out/preview-build-web/chrome-probe.json
          exit $LASTEXITCODE
      - name: Install build utilities
        run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
      - name: Resolve locked Semantic SDK and lightweight dependencies
        shell: pwsh
        run: |
          python tools/setup_build_environment.py --core --semantic --target '${{ matrix.semantic_target }}' --facts-output out/preview-facts.json --status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/setup_build_environment.py --semantic --target '${{ matrix.semantic_target }}' --offline --status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked Emscripten toolchain
        if: matrix.platform == 'web'
        run: python tools/bootstrap_deps.py --web
      - name: Fetch locked Skia SDK
        run: >-
          python tools/skia/fetch.py --profile tools/skia/profiles/r1-full-v1.json
          --lock r1-full-skia-sdk.lock.json --target ${{ matrix.skia_target }} --variant release
      - name: Test release packaging rules
        run: >-
          python -m unittest
          tools.release.tests.test_preview_package
          tools.release.tests.test_consumer_package
          tools.release.tests.test_npm_publish
          tools.release.tests.test_native_package
          tools.release.tests.test_version_identity -v
      - name: Check public JavaScript SDK types
        if: matrix.platform == 'web'
        run: npx --yes --ignore-scripts --package typescript@5.9.3 -- tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext verification/sdk_js/api_types_test.mts
      - name: Test standalone JavaScript SDK server
        if: matrix.platform == 'web'
        run: python -m unittest verification.sdk_js.test_server -v
      - name: Build, test and package
        shell: pwsh
        run: |
          $taskArgs = @('--platform', '${{ matrix.platform }}', '--facts', 'out/preview-facts.json', '--skia', '.deps/skia-sdk/${{ matrix.skia_target }}/release', '--build', 'out/preview-build-${{ matrix.platform }}', '--output', 'out/preview-assets', '--revision', '${{ github.sha }}')
          if ('${{ matrix.platform }}' -eq 'web') {
            $taskArgs += @('--emsdk', '.deps/emsdk', '--chrome', "$env:ProgramFiles\Google\Chrome\Application\chrome.exe")
          }
          python tools/release/build_preview.py @taskArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-consumer-${{ matrix.platform }}
          path: out/preview-assets/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-sdk-evidence-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            out/preview-build-${{ matrix.platform }}/windows-external.json
            out/preview-build-${{ matrix.platform }}/windows-zip-external.json
            out/preview-build-${{ matrix.platform }}/sdk-consumer-regressions.xml
            out/preview-build-${{ matrix.platform }}/js-browser.json
            out/preview-build-${{ matrix.platform }}/chrome-probe.json
            out/preview-build-${{ matrix.platform }}/evidence/*.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    if: (github.event_name == 'push' || inputs.publish_release) && startsWith(github.ref, 'refs/tags/v')
    needs: [identity, build]
    env:
      AXIOM_BUILD_NUMBER: ${{ needs.identity.outputs.build_number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: axiom-consumer-*
          path: release-assets
          merge-multiple: true
      - name: Verify all assets and source identity
        run: python tools/release/consumer_package.py --verify-release release-assets --revision "$GITHUB_SHA"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Matching consumer SDK and demos for Windows x64 and JavaScript/WebAssembly. Windows apps link only axiom.lib and deploy axiom.dll plus runtime assets. JS apps import axiom.mjs with axiom.wasm and axiom.data. Semantic, Skia and Runtime component archives are private build inputs; their licenses are included. The 0.x SDK release does not imply production readiness or a cross-version C++ ABI declaration.

          Includes tables, extended vector paths and appearance, font fallback and rounded corners, compact pressure-responsive round/marker/chalk/crayon/watercolor brushes, GPU preview and G5 navigation improvements, persistent document backgrounds, PNG/JPG/JPEG export, and the contextual Web Demo. npm package: `@mostorm/axiom` at `http://npm.nearhub.cc/`.

          Known limits: physical-input/IME coverage is incomplete; document persistence, synchronization and durable close are owned by the embedding application; Undo history is not restored from checkpoints. The known D07 Protobuf/Abseil allocation-failure hang is unresolved.

          See each archive's README and manifest.json, and verify SHA256SUMS and release.json before use. All four assets share one exact source revision, SemVer and pipeline build number. SDK/API display X.Y.Z.Build; npm keeps X.Y.Z plus buildNumber. Performance evidence checkpoints include known unresolved cumulative erase/live-continuity limits; this release is not a performance Gate PASS.
          EOF
          display_version=$(python -c 'import json; print(json.load(open("release-assets/release.json"))["sdk_version"])')
          version=$(python -c 'import json; print(json.load(open("release-assets/release.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --draft --title "Axiom SDK $display_version" --notes-file release-notes.txt
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS release-assets/release.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest=true

  publish-npm:
    if: (github.event_name == 'push' || inputs.publish_release) && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'http://npm.nearhub.cc/'
          scope: '@mostorm'
          always-auth: true
      - uses: actions/download-artifact@v4
        with:
          name: axiom-consumer-web
          path: npm-assets
      - name: Verify the exact Web Release payload
        run: >-
          python tools/release/npm_publish.py
          --archive npm-assets/axiom-sdk-js.zip
          --output npm-package --revision "$GITHUB_SHA"
      - name: Publish the private npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AXIOM_NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "Missing AXIOM_NPM_TOKEN repository secret"; exit 1; }
          npm whoami --registry=http://npm.nearhub.cc/
          npm publish ./npm-package --ignore-scripts --tag=latest --registry=http://npm.nearhub.cc/
          version=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("npm-package/package.json", "utf8")).version)')
          npm view "@mostorm/axiom@$version" version --json --registry=http://npm.nearhub.cc/

  react-native:
    if: (github.event_name == 'push' || inputs.publish_release) && startsWith(github.ref, 'refs/tags/v')
    needs: [identity, publish]
    uses: ./.github/workflows/rn-sdk-release.yml
    with:
      release_build_number: ${{ needs.identity.outputs.build_number }}
      publish_release: true
    secrets: inherit
