name: GT-G4.7 Qualification

on:
  push:
    branches: [codex/g4-7-development]
    paths:
      - "CMakeLists.txt"
      - "runtime/**"
      - "verification/runtime_qualification/**"
      - "verification/**"
      - ".aegis/packages/GT-G4.7/**"
      - ".aegis/results/GT-G4.7/**"
      - "r1-full-skia-sdk.lock.json"
      - "semantic-sdk.lock.json"
      - "tools/setup_build_environment.py"
      - "tools/semantic/**"
      - "tools/skia/**"
      - ".github/workflows/g4-7-qualification.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "runtime/**"
      - "verification/runtime_qualification/**"
      - "verification/**"
      - ".aegis/packages/GT-G4.7/**"
      - ".aegis/results/GT-G4.7/**"
      - "r1-full-skia-sdk.lock.json"
      - "semantic-sdk.lock.json"
      - "tools/setup_build_environment.py"
      - "tools/semantic/**"
      - "tools/skia/**"
      - ".github/workflows/g4-7-qualification.yml"

permissions:
  contents: read

jobs:
  windows:
    name: g4.7/windows-qualification
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Resolve locked Semantic SDK
        shell: pwsh
        run: python tools/setup_build_environment.py --core --semantic --target windows-x64-msvc-static --facts-output out/g47-windows-environment.json --github-env "$env:GITHUB_ENV" --status
      - name: Fetch locked Skia SDK
        shell: pwsh
        run: python tools/skia/fetch.py --profile tools/skia/profiles/r1-full-v1.json --lock r1-full-skia-sdk.lock.json --target windows-x64-d3d12 --variant release
      - name: Configure and build G4.7 targets
        shell: pwsh
        run: |
          $sdk=(Resolve-Path .deps/skia-sdk/windows-x64-d3d12/release).Path
          cmake -S . -B out/g47-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCANVAS_BUILD_POC01=OFF `
            -DCANVAS_BUILD_RF01=ON -DCANVAS_BUILD_RENDER=ON `
            -DAXIOM_BUILD_RUNTIME_QUALIFICATION=ON -DCANVAS_SEMANTIC_ENABLE_PROTOBUF=ON `
            -DAXIOM_BUILD_DEBUG_UI=ON -DAXIOM_DEBUG_UI_PROFILE=full `
            -DCMAKE_CXX_FLAGS="/wd4100 /wd4702" `
            -DCANVAS_RENDER_ENABLE_SKIA_PROGRAMMABLE_BRUSH=ON `
            -DCANVAS_RENDER_ENABLE_SKIA_HEADLESS=ON -DCANVAS_RENDER_BUILD_TESTS=ON `
            -DCANVAS_SKIA_SDK_ROOT="$sdk" -DAXIOM_PROTOC="$env:AXIOM_PROTOC" `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" -DBUILD_TESTING=ON
          cmake --build out/g47-windows --config RelWithDebInfo --target axiom_text_layout_tests axiom_image_resource_tests axiom_text_pipeline_tests axiom_g47_text_host_tests axiom_g47_qualification_runner --parallel 2
          ctest --test-dir out/g47-windows -C RelWithDebInfo -R "^(G47TextLayout|G47ImageResource|G47TextPipeline|G47TextHost|G47QualificationReplay)$" --output-on-failure
          out/g47-windows/verification/runtime_qualification/axiom_g47_qualification_runner.exe out/g47-windows/qualification-100k 50000
      - uses: actions/upload-artifact@v4
        with:
          name: g4-7-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/g47-windows-environment.json
            out/g47-windows/Testing/Temporary/LastTest.log
            out/g47-windows/qualification-100k/
            out/g47-windows/verification/runtime_qualification/icudtl.dat
          if-no-files-found: error

  web:
    name: g4.7/web-qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
      - name: Resolve locked Web Semantic SDK
        run: python tools/setup_build_environment.py --core --semantic --target web-wasm32 --facts-output out/g47-web-environment.json --status
      - name: Install locked Emscripten and Skia
        run: |
          python tools/bootstrap_deps.py --web
          python tools/skia/fetch.py --profile tools/skia/profiles/r1-full-v1.json --lock r1-full-skia-sdk.lock.json --target web-wasm-webgl2 --variant release
      - name: Build Web qualification target
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          python verification/tools/g47_configure.py web --facts out/g47-web-environment.json --build out/g47-web --skia .deps/skia-sdk/web-wasm-webgl2/release
          cmake --build out/g47-web --target axiom_ink_playground_web --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: g4-7-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/g47-web-environment.json
            out/g47-web/verification/runtime_qualification/axiom_ink_playground_web.js
            out/g47-web/verification/runtime_qualification/axiom_ink_playground_web.wasm
            verification/runtime_qualification/platform/web/index.html
          if-no-files-found: error
