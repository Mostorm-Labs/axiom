name: Task14 verified getenv green materialization

on:
  push:
    branches:
      - fix/semantic-test-getenv-portability

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-test-getenv-portability
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace the one Windows-deprecated getenv call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('runtime/semantic/tests/g1_04_b_operation_matrix_test.cpp')
          text = path.read_text(encoding='utf-8')
          old = (
              '    const char* path = std::getenv("AXIOM_B10_OBSERVATIONS");\n'
              '    if (path == nullptr) return;\n'
              '    std::ofstream out(path, std::ios::app);\n'
          )
          new = (
              '    std::ofstream out;\n'
              '#if defined(_WIN32)\n'
              '    char* path = nullptr;\n'
              '    std::size_t path_size = 0U;\n'
              '    const int getenv_result = _dupenv_s(&path, &path_size, "AXIOM_B10_OBSERVATIONS");\n'
              '    if (getenv_result != 0 || path == nullptr) {\n'
              '        std::free(path);\n'
              '        return;\n'
              '    }\n'
              '    out.open(path, std::ios::app);\n'
              '    std::free(path);\n'
              '#else\n'
              '    const char* path = std::getenv("AXIOM_B10_OBSERVATIONS");\n'
              '    if (path == nullptr) return;\n'
              '    out.open(path, std::ios::app);\n'
              '#endif\n'
          )
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "runtime/semantic/tests/g1_04_b_operation_matrix_test.cpp"
      - name: Prove the directory-level GREEN contract
        shell: bash
        run: |
          python -m unittest \
            tools.semantic.tests.test_runtime_cmake_discovery.RuntimeCMakeDiscoveryTest.test_semantic_test_getenv_users_declare_windows_safe_path \
            -v
      - name: Remove materializer and commit exact verified bytes
        shell: bash
        run: |
          rm .github/workflows/tmp-task14-getenv-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/tmp-task14-getenv-materialize.yml\nruntime/semantic/tests/g1_04_b_operation_matrix_test.cpp'
          git commit -m "fix: use Windows-safe getenv in operation matrix test"
          git push origin HEAD:fix/semantic-test-getenv-portability
