name: Materialize fixture decoder MSVC exception fix

on:
  push:
    branches:
      - fix/semantic-fixture-decoder-msvc-exceptions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-fixture-decoder-msvc-exceptions

      - name: Apply target-local MSVC exception flag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime/semantic/tests/CMakeLists.txt")
          source = path.read_text(encoding="utf-8")
          old = '''target_link_libraries(canvas_semantic_g1_04_c_fixture_decoder_test PRIVATE canvas_runtime_semantic GTest::gtest_main)
gtest_discover_tests(canvas_semantic_g1_04_c_fixture_decoder_test)'''
          new = '''target_link_libraries(canvas_semantic_g1_04_c_fixture_decoder_test PRIVATE canvas_runtime_semantic GTest::gtest_main)
if(MSVC)
  target_compile_options(canvas_semantic_g1_04_c_fixture_decoder_test PRIVATE /EHsc)
endif()
gtest_discover_tests(canvas_semantic_g1_04_c_fixture_decoder_test)'''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one fixture decoder target block, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Prove focused GREEN contract
        shell: bash
        run: |
          python -m unittest tools.semantic.tests.test_runtime_cmake_discovery.RuntimeCMakeDiscoveryTest.test_g1_04_c_fixture_decoder_target_enables_msvc_exceptions -v

      - name: Remove materializer and commit verified bytes
        shell: bash
        run: |
          rm .github/workflows/materialize-fixture-decoder-msvc-exceptions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/semantic/tests/CMakeLists.txt .github/workflows/materialize-fixture-decoder-msvc-exceptions.yml
          git commit -m "fix: enable MSVC exceptions for semantic fixture decoder test"
          git push origin HEAD:fix/semantic-fixture-decoder-msvc-exceptions
