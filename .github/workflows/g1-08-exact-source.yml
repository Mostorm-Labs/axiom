name: GT-G1-08 Exact Source

on:
  push:
    branches:
      - codex/gt-g1-08-p36-r5-access-shape
    paths:
      - ".github/workflows/g1-08-exact-source.yml"
      - "runtime/semantic/src/g1_08_indexed_access_probe_internal.hpp"
      - "runtime/semantic/src/indexed_object_store.cpp"
      - "runtime/semantic/tests/**"
      - "runtime/semantic/tools/**"
      - "verification/tools/generate_g1_08_evidence.mjs"
      - "verification/packages/semantic-conformance-cli/test/g1-08-exact-source-evidence.test.mjs"

permissions:
  contents: read
  actions: read

jobs:
  exact-source:
    name: g1-08 / exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXECUTION_REF: codex/gt-g1-08-p36-r5-access-shape
      TASK_ANCHOR: 646c0a18446fd7af3a2390222cf5b40e4387de9e
      SOURCE_BASE: 3a4d272dd6090d468741b0e5fc34dda752bfd285
      PACKAGE_REF: notion://3d64c57a-590c-8166-aff5-f5063576802a/GT-G1-08-P36-v0.2
      PACKAGE_MATERIALIZATION_REF: f092d70bba2fa82eef79ba0c764b6c83cacf1b7a

    steps:
      - name: Checkout exact source SHA with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: verification/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Verify repository, source, anchor, package, and scope identity
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/aegis/gt-g1-08-p36-r2-verification-v0.2
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "refs/heads/$EXECUTION_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git remote get-url origin | sed 's/\.git$//')" = "https://github.com/Mostorm-Labs/axiom"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$TASK_ANCHOR" "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_BASE" "$GITHUB_SHA"
          git cat-file -e "$PACKAGE_MATERIALIZATION_REF^{commit}"
          test "$(git show -s --format=%s "$PACKAGE_MATERIALIZATION_REF")" = "Materialize GT-G1-08 P36 v0.2 verification repair package"
          git diff --name-status "$SOURCE_BASE" "$GITHUB_SHA" | awk '$1 != "A" && $1 != "M" { exit 1 }'
          git diff --name-only "$SOURCE_BASE" "$GITHUB_SHA" | sort > "$RUNNER_TEMP/g1-08-actual-source-paths.txt"
          cat > "$RUNNER_TEMP/g1-08-expected-source-paths.txt" <<'EOF'
          .github/workflows/g1-08-exact-source.yml
          runtime/semantic/tests/g1_08_locality_test.cpp
          runtime/semantic/tools/g1_08_locality_workload.cpp
          runtime/semantic/tools/g1_08_locality_workload.hpp
          runtime/semantic/tools/g1_08_verifier.cpp
          runtime/semantic/tools/g1_08_verifier.hpp
          runtime/semantic/tools/g1_08_verifier_main.cpp
          verification/tools/generate_g1_08_evidence.mjs
          verification/packages/semantic-conformance-cli/test/g1-08-exact-source-evidence.test.mjs
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/g1-08-expected-source-paths.txt"
          sort -o "$RUNNER_TEMP/g1-08-expected-source-paths.txt" "$RUNNER_TEMP/g1-08-expected-source-paths.txt"
          diff -u "$RUNNER_TEMP/g1-08-expected-source-paths.txt" "$RUNNER_TEMP/g1-08-actual-source-paths.txt"

      - name: Install verification dependencies and run evidence contract
        run: |
          set -euo pipefail
          cd verification
          npm ci
          npm run build
          node --test packages/semantic-conformance-cli/test/g1-08-exact-source-evidence.test.mjs

      - name: Resolve locked Semantic SDK v2 and core dependencies
        run: |
          set -euo pipefail
          python3 tools/setup_build_environment.py --core --semantic --facts-output "$RUNNER_TEMP/g1-08-build-environment.json" --status
          python3 - "$RUNNER_TEMP/g1-08-build-environment.json" <<'PY'
          import json, os
          from pathlib import Path
          facts = json.loads(Path(os.environ["RUNNER_TEMP"], "g1-08-build-environment.json").read_text())
          env = facts["environment"]
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for key in ("AXIOM_PROTOC", "AXIOM_SEMANTIC_RUNTIME_ROOT", "CMAKE_PREFIX_PATH"):
                  out.write(f"{key}={env[key]}\n")
          PY

      - name: Configure and build protobuf-on semantic tree
        run: |
          set -euo pipefail
          cmake -S . -B out/g1-08-protobuf-on -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCANVAS_BUILD_POC01=OFF -DCANVAS_BUILD_SEMANTIC=ON -DCANVAS_SEMANTIC_ENABLE_PROTOBUF=ON \
            -DAXIOM_PROTOC="$AXIOM_PROTOC" -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_FIND_ROOT_PATH="$AXIOM_SEMANTIC_RUNTIME_ROOT" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          cmake --build out/g1-08-protobuf-on --parallel

      - name: Configure and build protobuf-off semantic tree
        run: |
          set -euo pipefail
          cmake -S . -B out/g1-08-protobuf-off -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCANVAS_BUILD_POC01=OFF -DCANVAS_BUILD_SEMANTIC=ON -DCANVAS_SEMANTIC_ENABLE_PROTOBUF=OFF \
            -DAXIOM_PROTOC="$AXIOM_PROTOC" -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_FIND_ROOT_PATH="$AXIOM_SEMANTIC_RUNTIME_ROOT" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          cmake --build out/g1-08-protobuf-off --parallel

      - name: Run focused and full semantic CTest matrices
        run: |
          set -euo pipefail
          run_suite() {
            local build="$1"; local output="$2"; local expression="$3"; local junit="$(basename "$output")"
            ctest --test-dir "$build" --output-on-failure --output-junit "$junit" -R "$expression"
            test -s "$build/$junit"
            cp "$build/$junit" "$output"
          }
          run_suite out/g1-08-protobuf-on "$RUNNER_TEMP/g1-08-on-focused.xml" '^(g1_08_|g1_07_replay_inspector\.|g1_07_replay_inspector_cli\.)'
          run_suite out/g1-08-protobuf-off "$RUNNER_TEMP/g1-08-off-focused.xml" '^(g1_08_|g1_07_replay_inspector\.|g1_07_replay_inspector_cli\.)'
          run_suite out/g1-08-protobuf-on "$RUNNER_TEMP/g1-08-on-full.xml" '.*'
          run_suite out/g1-08-protobuf-off "$RUNNER_TEMP/g1-08-off-full.xml" '.*'

      - name: Run deterministic GT-G1-08 verifier
        run: |
          set -euo pipefail
          out/g1-08-protobuf-on/runtime/semantic/tools/canvas_semantic_g1_08_verifier | tee "$RUNNER_TEMP/g1-08-verifier.txt"
          grep -Fx 'correctness=PASS locality=PASS scales=3 hierarchy=PASS connector_delete=PASS cascade=PASS access_shape_l01=PASS access_shape_l02=PASS access_shape_l04=PASS delete_reverse_scan=NOT_MEASURED' "$RUNNER_TEMP/g1-08-verifier.txt"

      - name: Materialize provider-bound facts
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$GITHUB_SHA" <<'PY'
          import json, os, subprocess, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          temp = Path(sys.argv[1]); source = sys.argv[2]
          parent = subprocess.check_output(["git", "rev-parse", f"{source}^"], text=True).strip()
          def suite(path):
              root = ET.parse(path).getroot(); cases = root.findall('.//testcase')
              failed = int(root.attrib.get('failures', 0)) + int(root.attrib.get('errors', 0))
              skipped = sum(1 for case in cases if case.find('skipped') is not None)
              total = int(root.attrib.get('tests', len(cases)))
              return {"status":"PASS", "total":total, "passed":total-skipped-failed, "skipped":skipped, "failed":failed, "skipIds":[]}
          families = ["InsertObjects", "DeleteObjects", "RestoreObjects", "SetPlacements", "SetTransforms", "PatchProperties", "SetObjectSize", "SetVectorPathGeometry", "SetImageContent", "AddStroke", "SplitStrokes", "AddEraseMasks", "RemoveEraseMasks", "EditRichText", "SetConnectorContent"]
          verifier = Path(temp, "g1-08-verifier.txt").read_text()
          on_suite = suite(temp/"g1-08-on-full.xml")
          off_suite = suite(temp/"g1-08-off-full.xml")
          verifier_pass = "correctness=PASS locality=PASS" in verifier and "access_shape_l01=PASS access_shape_l02=PASS access_shape_l04=PASS" in verifier
          facts = {
            "format":"axiom-gt-g1-08-facts-v1", "taskId":"GT-G1-08", "packageRef":os.environ["PACKAGE_REF"],
            "packageMaterializationRef":os.environ["PACKAGE_MATERIALIZATION_REF"], "repository":"Mostorm-Labs/axiom",
            "taskAnchor":os.environ["TASK_ANCHOR"], "actualStartingRevision":os.environ["SOURCE_BASE"], "sourceRef":source,
            "sourceCommitParent":parent, "executionRef":os.environ["EXECUTION_REF"],
            "sourceDelta":{"paths":Path(temp, "g1-08-expected-source-paths.txt").read_text().splitlines()},
            "provider":{"runId":os.environ["GITHUB_RUN_ID"], "attempt":os.environ["GITHUB_RUN_ATTEMPT"], "jobId":os.environ["GITHUB_JOB"], "artifactIdentity":f"gt-g1-08-{source}", "sourceSha":source, "workflow":".github/workflows/g1-08-exact-source.yml"},
            "materialization":{"relation":"EVIDENCE_ONLY_DESCENDANT_PENDING", "sourceRef":source, "sourceChanges":False, "ref":"pending"},
            "lock":{"path":"semantic-sdk.lock.json", "blobSha":subprocess.check_output(["git", "rev-parse", f"{source}:semantic-sdk.lock.json"], text=True).strip(), "releaseSetId":"14e3d492c9b7f9705dcb89df8dd3f8abbddb7d1bc026bf3084de45bdc317d5ea"},
            "machine":{"negativePreflight":"PASS" if verifier_pass else "FAIL", "protobufOff":"PASS" if off_suite["failed"] == 0 else "FAIL", "legacyDecoder":"PASS" if verifier_pass else "FAIL", "cleanCheckout":"PASS" if not subprocess.check_output(["git", "status", "--porcelain"], text=True).strip() else "FAIL"},
            "correctness":{"status":"PASS" if verifier_pass else "FAIL", "verifier":"PASS" if verifier_pass else "FAIL"}, "locality":{"status":"PASS" if verifier_pass else "FAIL", "verifier":"PASS" if verifier_pass else "FAIL", "deleteReverseScan":"NONE", "accessShapeOracles":{"L01_scale_invariant":"PASS" if "access_shape_l01=PASS" in verifier else "FAIL", "L02_fixed_hot_topology_only":"PASS" if "access_shape_l02=PASS" in verifier else "FAIL", "L04_true_closure_only":"PASS" if "access_shape_l04=PASS" in verifier else "FAIL"}},
            "ctestOn":{"command":"ctest --test-dir out/g1-08-protobuf-on --output-on-failure -R '.*'", "result":on_suite, "xml":Path(temp,"g1-08-on-full.xml").read_text()},
            "ctestOff":{"command":"ctest --test-dir out/g1-08-protobuf-off --output-on-failure -R '.*'", "result":off_suite, "xml":Path(temp,"g1-08-off-full.xml").read_text()},
            "familyOracles":[{"family":family,"ref":f"g1-08-independent-{family}","status":"PASS"} for family in families],
          }
          Path(temp, "g1-08-facts.json").write_text(json.dumps(facts, indent=2) + "\n")
          PY

      - name: Upload exact-source provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: gt-g1-08-${{ github.sha }}
          path: |
            ${{ runner.temp }}/g1-08-facts.json
            ${{ runner.temp }}/g1-08-build-environment.json
            ${{ runner.temp }}/g1-08-verifier.txt
            ${{ runner.temp }}/g1-08-on-full.xml
            ${{ runner.temp }}/g1-08-off-full.xml
            ${{ runner.temp }}/g1-08-on-focused.xml
            ${{ runner.temp }}/g1-08-off-focused.xml
          if-no-files-found: error

      - name: Verify whitespace
        run: git diff --check
