name: PR66 verified green materialization

on:
  push:
    branches:
      - fix/semantic-test-sort-includes

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-test-sort-includes
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert the one verified direct include
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('runtime/semantic/tests/operation_specific_stateful_validation_test.cpp')
          text = path.read_text(encoding='utf-8')
          needle = '#include <gtest/gtest.h>\n'
          assert text.count(needle) == 1
          assert '#include <algorithm>' not in text
          path.write_text(text.replace(needle, needle + '#include <algorithm>\n', 1), encoding='utf-8')
          PY
          actual="$(git hash-object runtime/semantic/tests/operation_specific_stateful_validation_test.cpp)"
          test "$actual" = "52c6bdca7113090879993a3f321c1963de1c6cfc"
      - name: Prove the directory-level GREEN contract
        shell: bash
        run: |
          python -m unittest \
            tools.semantic.tests.test_runtime_cmake_discovery.RuntimeCMakeDiscoveryTest.test_semantic_test_sort_users_declare_algorithm_dependency \
            -v
      - name: Remove materializer and commit exact verified bytes
        shell: bash
        run: |
          rm .github/workflows/pr66-green-self-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git hash-object runtime/semantic/tests/operation_specific_stateful_validation_test.cpp)" = "52c6bdca7113090879993a3f321c1963de1c6cfc"
          git commit -m "fix: include algorithm for semantic sort test"
          git push origin HEAD:fix/semantic-test-sort-includes
