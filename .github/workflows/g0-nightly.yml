name: G0 Nightly Full Conformance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    uses: ./.github/workflows/g0-full-platform-conformance.yml
    with:
      cadence: NIGHTLY
      source_commit: ${{ github.sha }}
      repeat_count: 2
    permissions:
      contents: read
