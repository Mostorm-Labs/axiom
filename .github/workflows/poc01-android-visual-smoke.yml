name: POC-01 Android Visual Smoke

on:
  pull_request:
    paths:
      - "pocs/shared_engine/**"
      - "tools/skia/**"
      - "skia-sdk.lock.json"
      - ".github/workflows/poc01-android-visual-smoke.yml"
  workflow_dispatch:

concurrency:
  group: poc01-android-visual-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-visual-smoke:
    name: POC-01 Android visual smoke (hosted emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install locked Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.5" \
            "ndk;27.2.12479018" "emulator" "platform-tools" \
            "system-images;android-35;default;x86_64"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Bootstrap core dependencies
        run: python3 tools/bootstrap_deps.py --core
      - name: Fetch verified Android Skia SDK
        run: |
          python3 tools/skia/fetch.py \
            --target android-x86_64-gles3 \
            --variant release \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build POC-01 Android release visual-smoke APK
        working-directory: pocs/shared_engine/platform/android
        run: |
          gradle :app:assembleRelease -PcanvasPocAbi=x86_64 --no-daemon
          mkdir -p ../../../../out/poc01-android-visual-smoke
          cp app/build/outputs/apk/release/app-release.apk \
            ../../../../out/poc01-android-visual-smoke/app-release.apk
      - name: Check native and APK 16 KB alignment
        run: |
          set -euo pipefail
          APK=out/poc01-android-visual-smoke/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" \
            | tee out/poc01-android-visual-smoke/apk-16kb.txt
          extract_dir="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$extract_dir"
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r library; do
            "$readelf" -lW "$library" | awk '
              $1 == "LOAD" && $NF != "0x4000" {
                print "16 KB ELF alignment failed: " FILENAME " " $0
                exit 1
              }'
          done < <(find "$extract_dir/lib" -type f -name '*.so' -print)
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android visual smoke on hosted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 pocs/shared_engine/tools/run_android_visual_smoke.py \
              --apk out/poc01-android-visual-smoke/app-release.apk \
              --output out/poc01-android-visual-smoke/result \
              --execution-kind emulator
      - name: Validate independent visual Evidence
        if: always()
        run: |
          test -f out/poc01-android-visual-smoke/result/result.json
          python3 -m unittest \
            pocs/shared_engine/tools/test_android_visual_smoke.py \
            pocs/shared_engine/tools/test_android_visual_smoke_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-android-visual-smoke-${{ github.sha }}
          path: out/poc01-android-visual-smoke
          if-no-files-found: error
          retention-days: 30
