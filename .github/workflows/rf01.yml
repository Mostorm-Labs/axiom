name: RF-01 Scene Foundation

on:
  workflow_dispatch:

concurrency:
  group: rf01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap locked core dependencies
        run: python tools/bootstrap_deps.py --core
      - name: Configure dependency-free RF-01 contract
        run: cmake --preset rf01-host-debug
      - name: Build C11, C++20, Scene, and Fake participant checks
        run: cmake --build --preset rf01-host-debug --parallel
      - name: Run ABI, boundary, and atomicity gates
        run: ctest --preset rf01-host-debug --output-on-failure
      - name: Verify patch whitespace
        run: git diff --check
