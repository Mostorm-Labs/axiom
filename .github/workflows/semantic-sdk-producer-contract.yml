name: Semantic SDK Producer Contract

on:
  pull_request:
    paths:
      - "runtime/semantic/CMakeLists.txt"
      - "verification/tests/test_semantic_cmake_contract.py"
      - "deps.lock.json"
      - "tools/sdk/**"
      - "tools/semantic/provider.py"
      - "tools/setup_build_environment.py"
      - "tools/semantic_fetch.py"
      - "verification/tools/qualify_semantic_provider.py"
      - "verification/tests/test_semantic_provider_workflows.py"
      - "tools/semantic/contract.py"
      - "tools/semantic/aggregate.py"
      - "tools/semantic/reuse_release.py"
      - "tools/semantic/publish_release.py"
      - "tools/update_semantic_lock.py"
      - "tools/semantic/profile-v2.json"
      - "tools/semantic/package_host.py"
      - "tools/semantic/package_common.py"
      - "tools/semantic/sources.py"
      - "tools/semantic/build_runtime.py"
      - "tools/semantic/windows_compile.py"
      - "tools/semantic/package_runtime.py"
      - "tools/semantic/toolchain.py"
      - "tools/semantic/qualify_runtime.py"
      - "tools/semantic/smoke_consumer.py"
      - "tools/semantic/cmake_consumer.py"
      - "tools/semantic/smoke/**"
      - "tools/semantic/tests/test_runtime_*.py"
      - "tools/semantic/tests/test_package_runtime_v2.py"
      - "tools/semantic/tests/test_package_host_v2.py"
      - "verification/tests/test_semantic_sdk_workflows.py"
      - ".github/workflows/semantic-sdk-producer-contract.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  host-tools:
    name: host-tool / ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: linux-x86_64, os: ubuntu-24.04}
          - {host: windows-x64, os: windows-2025}
          - {host: macos-universal, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test host package and workflow contracts
        run: python -m unittest tools.semantic.tests.test_package_host_v2 verification.tests.test_semantic_sdk_workflows -v
      - name: Package and execute the locked official host tool
        run: >-
          python tools/semantic/package_host.py --host-key ${{ matrix.host }}
          --output out/semantic-sdk/package-a --probe
      - name: Independently repackage the same verified upstream bytes
        run: >-
          python tools/semantic/package_host.py --host-key ${{ matrix.host }}
          --output out/semantic-sdk/package-b
      - name: Compare package bytes and metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.sdk.archive import file_sha256
          first = Path("out/semantic-sdk/package-a")
          second = Path("out/semantic-sdk/package-b")
          a = json.loads((first / "record.json").read_bytes())
          b = json.loads((second / "record.json").read_bytes())
          assert a == b, "host record is not deterministic"
          assert file_sha256(first / a["asset"]) == file_sha256(second / b["asset"]), "host archive is not deterministic"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-host-${{ matrix.host }}
          path: out/semantic-sdk/package-a
          if-no-files-found: error
          retention-days: 14

  runtime-discovery:
    name: runtime-discovery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install the producer CMake version
        run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with: {arch: x64}
      - name: Verify SDK discovery before compiling dependencies
        run: python -m unittest tools.semantic.tests.test_runtime_cmake_discovery verification.tests.test_semantic_cmake_contract -v

  runtimes:
    needs: [host-tools, runtime-discovery]
    name: runtime / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, os: ubuntu-24.04, family: linux, host: linux-x86_64}
          - {target: windows-x64-msvc-static, os: windows-2025, family: windows, host: windows-x64}
          - {target: macos-arm64, os: macos-15, family: apple, host: macos-universal}
          - {target: macos-x64, os: macos-15, family: apple, host: macos-universal}
          - {target: ios-arm64, os: macos-15, family: apple, host: macos-universal}
          - {target: ios-simulator-arm64, os: macos-15, family: apple, host: macos-universal}
          - {target: android-arm64-v8a, os: ubuntu-24.04, family: android, host: linux-x86_64}
          - {target: android-x86_64, os: ubuntu-24.04, family: android, host: linux-x86_64}
          - {target: web-wasm32, os: ubuntu-24.04, family: web, host: linux-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.30.5 ninja==1.11.1.4
      - name: Test runtime build, package and smoke contracts
        run: >-
          python -m unittest tools.semantic.tests.test_runtime_build_plan
          tools.semantic.tests.test_package_runtime_v2
          tools.semantic.tests.test_runtime_smoke_contract -v
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.family == 'windows'
        with: {arch: x64}
      - name: Install pinned Windows LLVM
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --windows-llvm
          if ($LASTEXITCODE -ne 0) { throw "LLVM download failed" }
          $installer = Resolve-Path .deps/downloads/LLVM-22.1.8-win64.exe
          $installDir = Join-Path $PWD .deps/llvm
          $process = Start-Process $installer -ArgumentList /S,"/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed" }
          (Join-Path $installDir bin) | Out-File $env:GITHUB_PATH -Append
      - name: Verify Windows reproducibility regressions with pinned LLVM
        if: matrix.family == 'windows'
        run: python -m unittest tools.semantic.tests.test_runtime_reproducibility -v
      - name: Install pinned Android NDK
        if: matrix.family == 'android'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: matrix.family == 'web'
        with: {node-version: "24.18.0"}
      - name: Install pinned Emscripten
        if: matrix.family == 'web'
        run: python tools/bootstrap_deps.py --web
      - uses: actions/download-artifact@v4
        with:
          name: semantic-v2-host-${{ matrix.host }}
          path: out/semantic-sdk/host
      - name: Build, package twice and verify relocated runtime consumer
        if: matrix.family != 'web' && matrix.family != 'windows'
        run: python tools/semantic/qualify_runtime.py --target ${{ matrix.target }}
      - name: Verify two independent Windows clean builds and native consumers
        if: matrix.family == 'windows'
        run: python tools/semantic/qualify_runtime.py --target ${{ matrix.target }} --verify-clean-rebuild
      - name: Build, package twice and execute Web runtime consumer
        if: matrix.family == 'web'
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          python tools/semantic/qualify_runtime.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-runtime-${{ matrix.target }}
          path: |
            out/semantic-sdk/runtime/package-a
            out/semantic-sdk/runtime/smoke.json
            out/semantic-sdk/runtime/toolchain.json
            out/semantic-sdk/runtime/reproducibility.json
          if-no-files-found: error
          retention-days: 14

  release-set:
    needs: [host-tools, runtimes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-v2-*
          path: out/semantic-release-inputs
          merge-multiple: false
      - name: Aggregate and verify the complete 3-host and 9-runtime set
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/semantic/aggregate.py --assets out/semantic-release-inputs
          --output out/semantic-release-candidate
      - name: Generate candidate lock without changing repository authority
        shell: bash
        run: |
          tag=$(python -c 'import json; print(json.load(open("out/semantic-release-candidate/release.json"))["tag"])')
          python tools/update_semantic_lock.py --index out/semantic-release-candidate/semantic-sdk-index.json --tag "$tag" --output out/semantic-candidate-lock/semantic-sdk.lock.json
      - name: Validate publication input without creating a Release
        run: >-
          python tools/semantic/publish_release.py --directory out/semantic-release-candidate
          --target-commit ${{ github.sha }} --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-release-set-candidate
          path: out/semantic-release-candidate
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-candidate-lock
          path: out/semantic-candidate-lock
          retention-days: 14
          if-no-files-found: error

  provider-consumer:
    needs: release-set
    name: provider-consumer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: semantic-v2-release-set-candidate
          path: out/provider-candidate
      - name: Qualify real Store resolution, second-worktree offline use and native protoc
        run: >-
          python verification/tools/qualify_semantic_provider.py
          --release-directory out/provider-candidate
          --facts-output out/provider-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-provider-${{ matrix.os }}
          path: out/provider-qualification.json
          retention-days: 14
          if-no-files-found: error

  axiom-cmake-consumer:
    needs: release-set
    name: axiom-cmake-consumer / linux-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install build tools and lightweight core sources only
        run: |
          python -m pip install cmake==3.30.5 ninja==1.11.1.4
          python tools/bootstrap_deps.py --core
      - uses: actions/download-artifact@v4
        with:
          name: semantic-v2-release-set-candidate
          path: out/cmake-candidate
      - name: Resolve candidate into shared Store and verify offline reuse
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path
          from unittest import mock
          from tools.semantic.aggregate import verify_release_directory
          from tools.update_semantic_lock import make_v2_lock
          from tools.sdk.archive import canonical_bytes
          from tools.setup_build_environment import setup_environment, write_facts, write_github_env
          release_dir = Path("out/cmake-candidate").resolve()
          release = verify_release_directory(release_dir)
          lock_path = Path("out/cmake-candidate-lock.json").resolve()
          lock_path.write_bytes(canonical_bytes(make_v2_lock(release_dir / "semantic-sdk-index.json", release["tag"])) + b"\n")
          mirror = Path("out/cmake-mirror").resolve()
          shutil.copytree(release_dir, mirror / release["tag"])
          store = Path("out/shared SDK Store").resolve()
          with mock.patch("tools.sdk.transport._open", side_effect=AssertionError("unexpected network")):
              cold = setup_environment(core=False, semantic=True, lock_path=lock_path,
                                       store_root=store, mirror=str(mirror))
              shutil.rmtree(mirror)
              shutil.rmtree(store / "archives")
              warm = setup_environment(core=False, semantic=True, lock_path=lock_path,
                                       store_root=store, offline=True)
          assert cold["environment"] == warm["environment"]
          assert not warm["semantic"]["resolution"]["networkUsed"]
          assert not Path(".deps/protobuf").exists()
          write_facts(Path("out/cmake-evidence/build-environment.json"), warm)
          write_github_env(Path(os.environ["GITHUB_ENV"]), warm["environment"])
          PYTHON
      - name: Configure Axiom with separate host tool and target SDK
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          from tools.semantic.cmake_consumer import consumer_cmake_arguments
          runtime = Path(os.environ["AXIOM_SEMANTIC_RUNTIME_ROOT"])
          protoc = Path(os.environ["AXIOM_PROTOC"])
          subprocess.run(["cmake", "-S", ".", "-B", "out/axiom-v2-on", "-G", "Ninja",
                          "-DCMAKE_BUILD_TYPE=Debug", "-DCANVAS_BUILD_POC01=OFF",
                          "-DCANVAS_BUILD_SEMANTIC=ON", "-DBUILD_TESTING=ON",
                          "-DCANVAS_SEMANTIC_ENABLE_PROTOBUF=ON",
                          *consumer_cmake_arguments(runtime, protoc)], check=True)
          cache = Path("out/axiom-v2-on/CMakeCache.txt").read_text()
          assert f"AXIOM_PROTOC:FILEPATH={protoc.as_posix()}" in cache
          for package in ("Protobuf", "absl", "utf8_range"):
              record = next(line for line in cache.splitlines() if line.startswith(package + "_DIR:"))
              assert Path(record.split("=", 1)[1]).resolve().is_relative_to(runtime.resolve()), record
          PYTHON
      - name: Build and test full Axiom Semantic against v2 SDK
        run: |
          cmake --build out/axiom-v2-on --parallel 2
          ctest --test-dir out/axiom-v2-on --output-on-failure --output-junit "$PWD/out/cmake-evidence/protobuf-on.xml" --no-tests=error
      - name: Keep Protobuf-off builds independent of SDKs
        run: |
          cmake -S . -B out/axiom-v2-off -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCANVAS_BUILD_POC01=OFF -DCANVAS_BUILD_SEMANTIC=ON -DCANVAS_SEMANTIC_ENABLE_PROTOBUF=OFF -DBUILD_TESTING=ON
          cmake --build out/axiom-v2-off --parallel 2
          ctest --test-dir out/axiom-v2-off --output-on-failure --output-junit "$PWD/out/cmake-evidence/protobuf-off.xml" --no-tests=error
          test ! -d .deps/protobuf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-v2-axiom-cmake-linux
          path: out/cmake-evidence
          if-no-files-found: error
          retention-days: 14
