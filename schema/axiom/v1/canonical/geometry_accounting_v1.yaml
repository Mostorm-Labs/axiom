  - ImageContent
  - PropertyBag
rules:
  count_by_carried_occurrence: true
  deduplicate_equal_values: false
  read_existing_object_store: false
  checked_unsigned_accumulation: true
  overflow_error: INTEGER_OVERFLOW
  exceed_error: GEOMETRY_LIMIT_EXCEEDED
  clamp: forbidden
  truncate: forbidden
  partial_count: forbidden
ownership:
  normative_exact_validation: A3
  early_raw_wire_rejection_when_provable: A2
  stateful_lookup: forbidden
