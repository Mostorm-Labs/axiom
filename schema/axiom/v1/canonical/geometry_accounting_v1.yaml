  "QuadTo.control": 1
  "QuadTo.end": 1
  "CubicTo.control1": 1
  "CubicTo.control2": 1
  "CubicTo.end": 1
  ClosePath: 0
  "StrokeSample.position": 1
  "DabInstance.center": 1
  "DabInstance.size": 1
