edition = "2024";
package auditoryworks.axiom.v1;

import "auditoryworks/axiom/v1/common.proto";
import "auditoryworks/axiom/v1/paint.proto";

// V1 TextStyle is an explicit semantic value. In particular, false italic or
// underline is not equivalent to absence, and a font is never inferred from a
// platform default. The corresponding presence and validation policy is
// implemented in GT-G1-02/04; this structural source intentionally preserves
// the released tags here.
message TextStyle {
  Id128 font_resource_id = 1;
  double font_size = 2;
  uint32 weight = 3;
  bool italic = 4;
  bool underline = 5;
  ColorValue color = 6;
}
message ParagraphStyle { uint32 alignment = 1; }
message TextRun { string text = 1; TextStyle style = 2; }
message Paragraph { Id128 paragraph_id = 1; ParagraphStyle style = 2; repeated TextRun runs = 3; }
message RichTextDocument { repeated Paragraph paragraphs = 1; }
message RichTextContent { RichTextDocument document = 1; }

message InsertTextStep { Id128 paragraph_id = 1; uint32 scalar_offset = 2; string text = 3; TextStyle style = 4; }
message DeleteTextStep { Id128 paragraph_id = 1; uint32 start_scalar = 2; uint32 end_scalar = 3; }
message SetTextStyleStep { Id128 paragraph_id = 1; uint32 start_scalar = 2; uint32 end_scalar = 3; TextStyle style = 4; }
message SplitParagraphStep { Id128 paragraph_id = 1; uint32 scalar_offset = 2; Id128 new_paragraph_id = 3; }
message MergeParagraphStep { Id128 first_paragraph_id = 1; Id128 second_paragraph_id = 2; }
message SetParagraphStyleStep { Id128 paragraph_id = 1; ParagraphStyle style = 2; }
message RichTextStep {
  oneof step {
    InsertTextStep insert_text = 1;
    DeleteTextStep delete_text = 2;
    SetTextStyleStep set_text_style = 3;
    SplitParagraphStep split_paragraph = 4;
    MergeParagraphStep merge_paragraph = 5;
    SetParagraphStyleStep set_paragraph_style = 6;
  }
}
message RichTextDelta { repeated RichTextStep steps = 1; }
